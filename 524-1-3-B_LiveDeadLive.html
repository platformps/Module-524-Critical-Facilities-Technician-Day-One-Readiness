<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLAB 524.1.3 — Live-Dead-Live Verification — UCI 2227 (Training Simulator)</title>
<style>
  :root{
    --bg:#0b1620; --panel:#132433; --panel2:#0f1d29; --line:#4a7291;
    --ink:#dfeaf3; --dim:#8ba6bd; --faint:#7e9bb2;
    --blue:#33a6e8; --navy:#0079C0; --ice:#CFEBFC;
    --ok:#37c07a; --warn:#e8a33d; --stop:#e8604c;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
  button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:5px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:7px 13px}
  button:hover{background:#1b3044;border-color:#2d4d68}
  button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  button.primary:hover{background:#0a8bd8}
  button.danger{background:#4a1f1a;border-color:#6d3129;color:#ffb9ae}
  button:disabled{opacity:.4;cursor:not-allowed}
  select,input[type=text],input[type=number],textarea{
    font-family:inherit;font-size:13px;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:5px;padding:7px 9px}
  textarea{width:100%;resize:vertical;font-size:13px;line-height:1.45}
  h1,h2,h3{margin:0;font-weight:700}
  .mono{font-family:var(--mono)}

  /* ---------- shell ---------- */
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{font-weight:700;letter-spacing:.4px;font-size:14px}
  .brand span{color:var(--blue)}
  .sysname{color:var(--dim);font-size:12px;border-left:1px solid var(--line);padding-left:16px}
  .spacer{flex:1}
  .clock{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:1px}
  .clocklbl{color:var(--faint);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;text-align:right}
  .badge{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700;
    padding:4px 10px;border-radius:20px;background:#16324a;color:var(--blue);border:1px solid #23485f}
  .badge.run{background:#123a2a;color:var(--ok);border-color:#1d5b41}
  .badge.hold{background:#3d3220;color:var(--warn);border-color:#5c4c2e}

  main{flex:1;overflow:auto;padding:18px}
  .wrap{max-width:1500px;margin:0 auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin-bottom:14px}
  .card h3{font-size:15px;margin-bottom:4px}
  .card p{color:var(--dim);margin:0 0 14px;line-height:1.5;font-size:13px}
  .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);font-weight:700}
  .hint{font-size:12px;color:var(--faint);line-height:1.5;margin-top:10px}

  /* ---------- console ---------- */
  .toolbar{display:flex;gap:9px;align-items:center;padding:9px 18px;background:var(--panel2);
    border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1fr 1fr}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px}
  .tile .name{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:700}
  .tile .val{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1.15;margin-top:5px}
  .tile .unit{font-size:14px;color:var(--dim);font-weight:400;margin-left:3px}
  .tile .band{font-size:11px;color:var(--faint);margin-top:5px;font-family:var(--mono)}
  .tile.alarm{border-color:var(--stop);background:#2a1512}
  .tile.alarm .val{color:var(--stop)}
  .tile.caution{border-color:#5c4c2e}
  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .chartbox h3{font-size:13px;margin-bottom:2px}
  .chartbox .sub{font-size:11px;color:var(--faint);margin-bottom:8px}
  canvas{display:block;width:100%;height:auto}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .stepchip{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:4px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .stepchip.on{background:#16324a;border-color:var(--blue);color:var(--ice)}

  /* ---------- alarms ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);
    font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--blue)}
  td{padding:8px 10px;border-bottom:1px solid #182b3b;vertical-align:top}
  tr.ack{opacity:.42}
  .sev{font-size:10px;letter-spacing:.8px;font-weight:700;padding:3px 8px;border-radius:3px;white-space:nowrap}
  .sev.critical{background:#4a1f1a;color:#ff8f7d}
  .sev.high{background:#4a3418;color:#ffc069}
  .sev.medium{background:#1c3a4f;color:#7fc4ea}
  .sev.low{background:#22303a;color:#8ba6bd}
  .tick{display:inline-block;width:15px;height:15px;border:1px solid var(--line);border-radius:3px;
    background:var(--panel2);cursor:pointer;vertical-align:-3px}
  .tick.on{background:var(--blue);border-color:var(--blue)}
  .flt{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .flt .chip{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
    background:var(--panel2);color:var(--dim);cursor:pointer}
  .flt .chip.on{background:#16324a;border-color:var(--blue);color:var(--ice)}
  .counter{font-family:var(--mono);font-size:12px;color:var(--faint)}

  .note{font-size:12px;color:var(--dim);line-height:1.55}
  .hidden{display:none !important}

  /* ---------- submission ---------- */
  .submit{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-top:14px}
  .submit h3{font-size:14px;margin-bottom:3px}
  .submit .sub{font-size:12px;color:var(--faint);margin-bottom:13px}
  .fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
  .result{margin-top:12px;padding:13px;border-radius:7px;font-size:13px;line-height:1.55;display:none}
  .result.show{display:block;background:var(--panel2);border:1px solid var(--line)}
  .result h4{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue);
    font-weight:700;margin:15px 0 6px}
  .result .kvr{display:flex;justify-content:space-between;gap:12px;padding:5px 0;
    border-bottom:1px solid #1a2c3c;font-size:12px}
  .result .kvr span:first-child{color:var(--faint)}
  .result .kvr span:last-child{font-family:var(--mono);text-align:right}
  .result .kvr.wide span:last-child{font-family:var(--sans);text-align:left;max-width:64%}
  .result .todo{margin-top:13px;padding:10px 12px;border:1px solid #5c4c2e;border-radius:6px;
    background:#2b2310;font-size:12.5px;line-height:1.5}
  .result .todo ul{margin:6px 0 0;padding-left:19px}
  .result .close{margin-top:13px;font-size:12.5px;color:var(--dim);line-height:1.5}
  @media print{
    body{background:#fff;color:#000;overflow:visible}
    header,.toolbar,.noprint{display:none !important}
    main{overflow:visible}
  }

  .labtag{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;
    color:var(--blue);margin-bottom:8px}
  .lede{color:var(--dim);line-height:1.6;margin:0 0 26px;max-width:820px}

  /* ---------- additive: GLAB 524.1.3 only ---------- */
  .g4{grid-template-columns:repeat(4,1fr)}
  .sechead{font-size:13px;font-weight:700;margin-bottom:3px}
  .secsub{font-size:12px;color:var(--faint);margin-bottom:12px;line-height:1.5}
  .instrument{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .instrument .kvr{display:flex;justify-content:space-between;gap:12px;padding:5px 0;
    border-bottom:1px solid #162735;font-size:12px}
  .instrument .kvr span:first-child{color:var(--faint)}
  .instrument .kvr span:last-child{font-family:var(--mono);text-align:right}
  .lcd{background:#0a1a12;border:1px solid #1d5b41;border-radius:6px;padding:11px 13px;
    font-family:var(--mono);font-size:32px;font-weight:700;color:#8ef0b6;text-align:right;letter-spacing:1px}
  .lcd small{display:block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
    color:#4f9c76;text-align:left;font-weight:700;margin-bottom:4px}
  .lcd.idle{color:#4f7c68}
  .lead{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-top:8px;border-radius:7px;
    border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12.5px}
  .lead:hover{border-color:#2f5a78;background:#16293a}
  .lead .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .zoombox{margin-top:9px;border:1px dashed #2f5a78;border-radius:7px;padding:11px 12px;
    font-size:12.5px;line-height:1.55;background:#0d1b26}
  .cklist{display:flex;flex-direction:column;gap:9px;margin:12px 0}
  .ck{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;cursor:pointer}
  .ck.spoken{border-top:1px solid var(--line);padding-top:10px;color:var(--ice)}
  .combos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .cbtn{position:relative;padding:14px 10px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel2);text-align:center;cursor:pointer;font-family:var(--mono);
    font-size:16px;font-weight:700;color:var(--ink)}
  .cbtn:hover{border-color:#2f5a78;background:#16293a}
  .cbtn .rdg{display:block;font-size:12px;font-weight:400;color:var(--faint);margin-top:6px}
  .cbtn.done{border-color:#1d5b41;background:#12261c}
  .cbtn.done .rdg{color:#8ef0b6}
  .cbtn .seq{position:absolute;top:5px;left:8px;font-size:10px;font-weight:400;color:var(--faint)}
  .ppebar{display:flex;align-items:center;gap:13px;padding:11px 15px;border-radius:9px;
    border:1px solid var(--line);background:var(--panel2);margin-bottom:14px;flex-wrap:wrap}
  .pill{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700;
    padding:4px 10px;border-radius:20px;border:1px solid #23485f;background:#16324a;color:var(--blue)}
  .pill.ok{background:#123a2a;color:var(--ok);border-color:#1d5b41}
  .rail{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
  .rnode{font-family:var(--mono);font-size:11px;padding:6px 11px;border-radius:4px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .rnode.done{background:#12261c;border-color:#1d5b41;color:#8ef0b6}
  .radiorow{display:flex;gap:22px;flex-wrap:wrap;margin:6px 0 13px}
  .radiorow label{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
  .refline{margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);
    font-size:12px;line-height:1.55;color:var(--dim)}
  .printhead{display:none}
  @media print{
    .printhead{display:block;margin-bottom:12px}
    .tile,.instrument{break-inside:avoid}
  }
</style>

<body>
<div id="app">

  <header>
    <div class="brand">ABSENCE-OF-VOLTAGE <span>VERIFICATION</span></div>
    <div class="sysname">GLAB 524.1.3 &middot; UCI 2227 · objective 2 · <span id="setTag"></span> · TRAINING SIMULATOR — not connected to any live plant</div>
    <div class="spacer"></div>
    <div id="statusBadge" class="badge">Ready</div>
    <div>
      <div class="clocklbl">Site time</div>
      <div class="clock mono" id="clock">--:--:--</div>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <button id="btnReset" class="primary">Restart</button>
    <span class="spacer"></span>
    <span class="counter" id="elapsed">T+00:00</span>
  </div>

  <main>
    <div class="wrap">
      <section id="gateView"></section>
    </div>
  </main>
</div>

<script>
"use strict";
const SET = 1;   /* fixed for this file */
/* ============================================================
   UCI 2227 — GLAB 524.1.3 · Live-Dead-Live Verification
   Standalone training console. Offline, no libraries, no network.
   Telemetry model and chart code are identical to the other lab tools.
   ============================================================ */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry32(1);
function noise(amp){return (rnd()*2-1)*amp;}
function fmtClock(mins){
  const base=3*60+14; // scenarios run from 03:14 site time
  const total=base+mins;
  const h=Math.floor(total/60)%24, m=Math.floor(total%60), s=Math.floor((mins%1)*60);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtElapsed(mins){
  return "T+"+String(Math.floor(mins)).padStart(2,"0")+":"+String(Math.floor((mins%1)*60)).padStart(2,"0");
}
function drawChart(cv,cfg){
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cfg.height||150;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  const x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,W,H);
  const pad={l:46,r:10,t:10,b:20};
  const pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  const {min,max}=cfg;
  const sy=v=>pad.t+ph-((v-min)/(max-min))*ph;
  const sx=i=>pad.l+(i/Math.max(1,cfg.xmax))*pw;

  // alarm band shading
  if(cfg.band){
    x.fillStyle="rgba(232,96,76,.10)";
    if(cfg.band.hi<max) x.fillRect(pad.l,pad.t,pw,sy(cfg.band.hi)-pad.t);
    if(cfg.band.lo>min) x.fillRect(pad.l,sy(cfg.band.lo),pw,pad.t+ph-sy(cfg.band.lo));
  }
  // grid + y labels
  x.strokeStyle="#1d3346"; x.lineWidth=1; x.font="10px "+getComputedStyle(document.body).fontFamily;
  x.fillStyle="#5c7a92"; x.textAlign="right"; x.textBaseline="middle";
  for(let i=0;i<=4;i++){
    const v=min+(max-min)*i/4, yy=sy(v);
    x.beginPath(); x.moveTo(pad.l,yy); x.lineTo(W-pad.r,yy); x.stroke();
    x.fillText(cfg.fmt?cfg.fmt(v):v.toFixed(1),pad.l-6,yy);
  }
  // step markers
  if(cfg.steps) cfg.steps.forEach(s=>{
    if(s>cfg.xmax) return;
    x.strokeStyle="#25415a"; x.setLineDash([3,3]);
    x.beginPath(); x.moveTo(sx(s),pad.t); x.lineTo(sx(s),pad.t+ph); x.stroke(); x.setLineDash([]);
  });
  // series
  (cfg.series||[]).forEach(se=>{
    if(!se.data.length) return;
    x.strokeStyle=se.color; x.lineWidth=se.width||2; x.beginPath();
    se.data.forEach((v,i)=>{ const px=sx(i*(cfg.xstep||1)), py=sy(clamp(v,min,max));
      i?x.lineTo(px,py):x.moveTo(px,py); });
    x.stroke();
    // last point dot
    const li=se.data.length-1;
    x.fillStyle=se.color; x.beginPath();
    x.arc(sx(li*(cfg.xstep||1)),sy(clamp(se.data[li],min,max)),2.6,0,7); x.fill();
  });
  // x label
  x.fillStyle="#5c7a92"; x.textAlign="center"; x.textBaseline="top";
  x.fillText(cfg.xlabel||"minutes",pad.l+pw/2,H-13);
}
function tile(name,val,unit,band,cls){
  return `<div class="tile ${cls||''}"><div class="name">${name}</div>
    <div class="val">${val}<span class="unit">${unit||''}</span></div>
    <div class="band">${band||''}</div></div>`;
}

/* ---------- this lab ---------- */
const LAB={lab:"GLAB 524.1.3",obj:"objective 2",title:"Live-Dead-Live Verification",duration:45};

const SYSTEM="Panelboard DP-2, feeder to rooftop unit RTU-4. 480 V three-phase four-wire, fed from a 2500 kVA service; available fault current at this panel 42 kA. Breaker open, locked and tagged — lock 14, tag signed.";

const COMBOS=[
  {id:"AB",label:"A - B",desc:"phase A to phase B"},
  {id:"BC",label:"B - C",desc:"phase B to phase C"},
  {id:"AC",label:"A - C",desc:"phase A to phase C"},
  {id:"AG",label:"A - G",desc:"phase A to equipment ground"},
  {id:"BG",label:"B - G",desc:"phase B to equipment ground"},
  {id:"CG",label:"C - G",desc:"phase C to equipment ground"}
];

const CHECKS=[
  {id:"case",text:"Case, display and rotary switch intact — no cracks, no moisture, display segments all present."},
  {id:"leads",text:"Both leads inspected end to end — insulation, finger guards, probe tips, boots at the plugs."},
  {id:"cat",text:"Category (CAT) rating and voltage rating checked against this system and this point of use."},
  {id:"cal",text:"Calibration label in date and legible."},
  {id:"fuse",text:"Instrument function and internal fuse considered — accepting that neither can be confirmed by looking, only by proving on a known source."},
  {id:"spoken",text:"I called every one of these checks out loud so a second person could hear it. (Your instructor listens for the spoken version — this tick only records that you did it.)"}
];

const SETUPS=[
  {id:"N1",
   inst:"TM-87 true-RMS digital multimeter",
   cat:"CAT III 1000 V / CAT IV 600 V",
   l1:"Intact. Insulation unbroken along the full length, finger guard seated, probe tip clean and straight, boot tight against the plug.",
   l2:"Intact. No cracking at either boot, no exposed conductor anywhere, strain relief sound.",
   q:1, r:{AB:0,BC:0,AC:0,AG:0,BG:0,CG:0}},

  {id:"N2",
   inst:"TM-87 true-RMS digital multimeter",
   cat:"CAT III 1000 V / CAT IV 600 V",
   l1:"Intact. Insulation unbroken, finger guard seated, probe tip clean. Nothing here to see.",
   l2:"Intact. No cracking, no exposed conductor, strain relief sound.",
   q:0, r:{AB:0,BC:0,AC:0,AG:0,BG:0,CG:0}},

  {id:"N3",
   inst:"DM-220 pocket multimeter",
   cat:"CAT II 600 V",
   l1:"Cracked insulation about 20 mm back from the boot. The crack opens when the lead is flexed and a thread of conductor is visible inside it.",
   l2:"Boot loose at the plug and the strain relief has pulled. Insulation otherwise unbroken.",
   q:1, r:{AB:0,BC:0,AC:0,AG:0,BG:0,CG:0}},

  {id:"N4",
   inst:"TM-87 true-RMS digital multimeter",
   cat:"CAT III 1000 V / CAT IV 600 V",
   l1:"Intact. Insulation unbroken, finger guard seated, probe tip clean and straight.",
   l2:"Intact. No cracking at either boot, no exposed conductor, strain relief sound.",
   q:1, r:{AB:0,BC:0,AC:0,AG:0,BG:277,CG:0}}
];

const RNG_KEY=(0x9E3779B1^Math.imul(SET+1,2654435761))>>>0;
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function kvr(k,v,wide){ return '<div class="kvr'+(wide?" wide":"")+'"><span>'+k+'</span><span>'+v+'</span></div>'; }

const S={learner:"",t:0,timer:null,
  ppe:false,insp:{},zoom:null,decided:null,rd:{},log:[],
  concl:"",reason:"",logDone:false,halted:false,submitted:false,lastLive:null,lastIso:null};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s===undefined||s===null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let V=SETUPS[SET];

/* ---------- model ---------- */
const CALDATES=["04 Feb 2027","19 Mar 2027","28 Apr 2027","11 Jan 2027"];
function fmtV(v){ return (Math.abs(v)<0.6?0:v).toFixed(1); }
function buildReadings(){
  rnd=mulberry32(RNG_KEY);
  const q=V.q;
  const rd={};
  rd.serial=V.inst.slice(0,3)+String(Math.floor(rnd()*90000+10000));
  rd.cal=CALDATES[Math.floor(rnd()*CALDATES.length)];
  rd.live = q ? 480+noise(2.4) : 0;
  COMBOS.forEach(c=>{
    const base=V.r[c.id];
    if(!q) rd[c.id]=0;
    else rd[c.id]= base>0 ? base+noise(1.3) : Math.abs(noise(0.12));
  });
  S.rd=rd;
}
function testsTaken(){ return S.log.filter(e=>e.code==="PROVE"||e.code.indexOf("ISO_")===0); }
function isoTaken(){ return S.log.filter(e=>e.code.indexOf("ISO_")===0); }
function provesTaken(){ return S.log.filter(e=>e.code==="PROVE"); }
function testedSet(){ const s=new Set(); isoTaken().forEach(e=>s.add(e.code.slice(4))); return s; }
function highestReading(){
  let m=0; testsTaken().forEach(e=>{ if(e.code.indexOf("ISO_")===0 && e.raw>m) m=e.raw; });
  return m;
}
function act(code,label,detail,raw){
  S.log.push({n:S.log.length+1,t:fmtClock(S.t),code:code,label:label,
    detail:detail||"",raw:(raw===undefined?null:raw),ppe:S.ppe});
}

/* ---------- view ---------- */
function buildView(){

  el.innerHTML=`

      <button id="btnHalt" class="danger">HALT — stop work</button>

      <div class="tile">
        <div class="sechead">1 · Test instrument — inspect before use</div>

          <div class="kvr"><span>Model</span><span id="mModel">—</span></div>
          <div class="kvr"><span>Serial</span><span id="mSerial">—</span></div>

      </div>
    </div>

    <div class="tile noprint" style="margin-bottom:14px">
      <div class="sechead">3 · Isolated circuit — test every combination</div>
      <div class="secsub" id="sysLine"></div>
      <div class="combos" id="combos"></div>
      <div class="lcd idle" id="isoLcd"><small>Meter display — DP-2</small>--.-</div>
      <div class="hint">Six combinations are required: three phase-to-phase and three phase-to-ground. Testing phase-to-phase only will not find a conductor that is live to ground.</div>
    </div>

    <div class="tile noprint" style="margin-bottom:14px">
      <div class="sechead">5 · Conclusion</div>
      <div class="secsub">State your conclusion and say why. Write it as you would write it in a real log — someone who was not in the room has to be able to read it and know what you found.</div>
      <div class="radiorow">
        <label><input type="radio" name="concl" value="ver"> Verified at zero energy</label>
        <label><input type="radio" name="concl" value="not"> NOT verified</label>
      </div>
      <div class="fld" style="margin-bottom:12px">
        <label>Reason — what you tested, what it read, and what that means</label>

      <button class="primary" id="btnConclude">Record conclusion</button>
      <div class="hint" id="conclState">No conclusion recorded.</div>
    </div>

    <div class="tile" style="margin-bottom:14px">
      <div class="printhead">

        <div class="secsub" id="printMeta"></div>
      </div>
      <div class="sechead">6 · Verification log</div>
      <div class="secsub">Every action is timestamped as you take it. This is the record that leaves the room with you.</div>
      <div style="overflow:auto;max-height:44vh"><table id="logTable"></table></div>
      <div class="row noprint" style="margin-top:13px">
        <div class="fld"><label>Name of person verifying</label><input type="text" id="logName" style="width:230px" placeholder="required"></div>
        <button class="primary" id="btnLogDone">Complete and sign the log</button>
        <button id="btnPrintLog">Print log</button>
      </div>
      <div class="hint noprint" id="logState"></div>
    </div>

    <div class="submit">
      <h3>Submission sheet</h3>
      <div class="sub">Builds a printable record of your instrument inspection, every test you took in the order you took it, your conclusion and the full verification log. Read it before you print it.</div>
      <div class="fld noprint" style="margin-bottom:12px"><label>Your name</label>
        <input type="text" id="learnerName" style="width:280px" autocomplete="off"></div>
      <button class="primary noprint" id="btnSubmit">Build submission sheet</button>
      <div class="result" id="gateResult"></div>
    </div>`;

  $("sysLine").textContent=SYSTEM;
  el.querySelectorAll(".lead").forEach(l=>l.onclick=()=>{
    const which=l.dataset.lead;
    S.zoom = S.zoom===which ? null : which;
    if(S.zoom) act("LEAD","Lead examined under magnification",which==="red"?"red lead":"black lead");
    renderMeter();
  });
  $("ckList").onclick=e=>{
    const t=e.target.closest("[data-ck]"); if(!t) return;
    const id=t.dataset.ck; S.insp[id]=!S.insp[id]; renderMeter();
  };
  $("btnPPE").onclick=()=>{
    S.ppe=!S.ppe;
    act(S.ppe?"PPE_ON":"PPE_OFF", S.ppe?"PPE donned per the panel label":"PPE removed","per arc flash label on DP-2");
    render();
  };
  $("btnHalt").onclick=()=>{
    if(S.halted) return;
    S.halted=true; act("HALT","Work halted — job stopped, instrument tagged out of service");
    render();
  };
  $("btnAccept").onclick=()=>{
    if(S.decided) return;
    S.decided="accept"; act("ACCEPT","Instrument accepted for use",V.inst+" · "+V.cat);
    render();
  };
  $("btnReject").onclick=()=>{
    if(S.decided) return;
    S.decided="reject"; act("REJECT","Instrument rejected and tagged out of service",V.inst+" · "+V.cat);
    render();
  };
  $("btnProve").onclick=()=>{
    if(S.decided==="reject"){ flash($("proveNote"),"Instrument is rejected and out of service. Obtain a replacement before any testing."); return; }
    const stage = isoTaken().length ? "second proof — after the isolated circuit" : "first proof — before the isolated circuit";
    const r=S.rd.live;
    S.lastLive=r;
    act("PROVE","Proof on known live source PU-1 ("+stage+")","PU-1 480 V three-phase",r);
    render();
  };
  $("combos").onclick=e=>{
    const b=e.target.closest("[data-c]"); if(!b) return;
    if(S.decided==="reject"){ flash($("logState"),"Instrument is rejected and out of service — no testing."); return; }
    const c=COMBOS.find(x=>x.id===b.dataset.c);
    const r=S.rd[c.id];
    S.lastIso={id:c.id,v:r};
    act("ISO_"+c.id,"Isolated circuit test "+c.label,"DP-2 lugs — "+c.desc,r);
    render();
  };
  $("btnConclude").onclick=()=>{
    const sel=document.querySelector('input[name="concl"]:checked');
    const reason=$("reason").value.trim();
    if(!sel){ flash($("conclState"),"Choose a conclusion first — verified or not verified."); return; }
    if(reason.length<20){ flash($("conclState"),"Write the reason out properly. A conclusion with no reason is not a record."); return; }
    S.concl=sel.value; S.reason=reason;
    act("CONCLUDE","Conclusion stated",(S.concl==="ver"?"Verified at zero energy":"NOT verified")+" — "+reason);
    render();
  };
  $("btnLogDone").onclick=()=>{
    const nm=$("logName").value.trim();
    if(!nm){ flash($("logState"),"The log needs a name. An unsigned verification record is not a record."); return; }
    S.learner=nm; S.logDone=true;
    act("LOG","Verification log completed and signed",nm);
    render();
  };
  $("btnPrintLog").onclick=()=>window.print();

}
function flash(el,msg){ if(!el) return; el.textContent=msg; el.style.color="#ff8f7d";
  setTimeout(()=>{ el.style.color=""; render(); },2600); }

function renderTiles(){
  const tested=testedSet().size, hi=highestReading();
  $("gTiles").innerHTML=
    tile("Combinations tested",tested+"/6","","three phase-to-phase, three phase-to-ground")+
    tile("Highest reading on DP-2",fmtV(hi),"V","highest value you have recorded so far")+
    tile("Actions logged",String(S.log.length),"","every action carries a site time")+
    tile("PPE",S.ppe?"On":"Off","","state recorded against every action");
}
function renderRail(){
  const proves=provesTaken(), tested=testedSet().size;
  const nodes=[
    {t:"instrument decision "+(S.decided?"recorded":"—"),cls:S.decided?"done":""},
    {t:"proofs on the known live source: "+proves.length,cls:proves.length?"done":""},
    {t:"isolated circuit "+tested+"/6",cls:tested===6?"done":""},
    {t:"conclusion "+(S.concl?"recorded":"—"),cls:S.concl?"done":""},
    {t:"log "+(S.logDone?"signed":"unsigned"),cls:S.logDone?"done":""}
  ];
  if(S.halted) nodes.push({t:"HALT recorded",cls:"done"});
  $("rail").innerHTML=nodes.map(n=>`<span class="rnode ${n.cls}">${n.t}</span>`).join("");
}
function renderPPE(){
  const bar=$("ppebar");
  bar.className="ppebar noprint";
  $("ppePill").className="pill "+(S.ppe?"ok":"");
  $("ppePill").textContent=S.ppe?"PPE donned":"PPE off";
  $("ppeTxt").textContent=S.ppe
    ? "Arc-rated clothing, face shield, voltage-rated gloves with leather protectors, per the arc flash label on DP-2."
    : "PPE is not donned. The log records the state of your PPE against every action you take.";
  $("btnPPE").textContent=S.ppe?"Remove PPE":"Don PPE";
  $("btnHalt").disabled=S.halted;
}
function renderMeter(){
  $("mModel").textContent=V.inst;
  $("mSerial").textContent=S.rd.serial||"—";
  $("mCat").textContent=V.cat;
  $("mCal").textContent=S.rd.cal+" — in date";
  $("mFuse").textContent="Not determinable by inspection";
  const z=$("leadZoom");
  if(S.zoom){ z.classList.remove("hidden");
    z.innerHTML="<b>"+(S.zoom==="red"?"Red lead":"Black lead")+" under magnification</b><br>"+
      (S.zoom==="red"?V.l1:V.l2);
  } else { z.classList.add("hidden"); z.innerHTML=""; }
  $("ckList").innerHTML=CHECKS.map(c=>
    `<div class="ck ${c.id==='spoken'?'spoken':''}" data-ck="${c.id}">
       <span class="tick ${S.insp[c.id]?'on':''}"></span><span>${c.text}</span></div>`).join("");
  $("btnAccept").disabled=!!S.decided;
  $("btnReject").disabled=!!S.decided;
  $("meterState").textContent = S.decided==="accept"
    ? "Instrument accepted and in use."
    : S.decided==="reject" ? "Instrument rejected and tagged out of service. No testing is possible with it."
    : "No inspection decision recorded yet. Accept or reject before you test anything.";
}
function renderLive(){
  const lcd=$("liveLcd");
  if(S.lastLive===null){ lcd.className="lcd idle"; lcd.innerHTML=`<small>Meter display — PU-1</small>--.-`; }
  else{
    lcd.className="lcd";
    lcd.innerHTML=`<small>Meter display — PU-1 known live source</small>${fmtV(S.lastLive)} V`;
  }
  const proves=provesTaken();
  $("proveNote").textContent = !proves.length ? "No proof taken yet."
    : proves.length===1 ? "One proof recorded at "+proves[0].t+". A second proof is required after the isolated circuit."
    : proves.length+" proofs recorded — latest at "+proves[proves.length-1].t+".";
}
function renderCombos(){
  const done=new Map();
  isoTaken().forEach((e,i)=>{ if(!done.has(e.code.slice(4))) done.set(e.code.slice(4),{n:i+1,v:e.raw,t:e.t}); });
  $("combos").innerHTML=COMBOS.map(c=>{
    const d=done.get(c.id);
    return `<div class="cbtn ${d?'done':''}" data-c="${c.id}">
      ${d?`<span class="seq">#${d.n}</span>`:""}${c.label}
      <span class="rdg">${d?fmtV(d.v)+" V · "+d.t:"not tested"}</span></div>`;
  }).join("");
  const lcd=$("isoLcd");
  if(!S.lastIso){ lcd.className="lcd idle"; lcd.innerHTML=`<small>Meter display — DP-2</small>--.-`; }
  else{
    lcd.className="lcd";
    lcd.innerHTML=`<small>Meter display — DP-2 ${COMBOS.find(c=>c.id===S.lastIso.id).label}</small>${fmtV(S.lastIso.v)} V`;
  }
}
function renderLog(){
  $("printMeta").textContent=LAB.lab+" · "+(S.learner||"unsigned")+" · "+SYSTEM;
  $("logTable").innerHTML=
    `<thead><tr><th style="cursor:default">#</th><th style="cursor:default">Site time</th>
      <th style="cursor:default">Action</th><th style="cursor:default">Point</th>
      <th style="cursor:default">Reading</th><th style="cursor:default">PPE</th></tr></thead><tbody>`+
    (S.log.length?S.log.map(e=>`<tr>
      <td class="mono">${e.n}</td><td class="mono">${e.t}</td>
      <td>${e.label}</td><td>${e.detail||"—"}</td>
      <td class="mono">${e.raw===null?"—":fmtV(e.raw)+" V"}</td>
      <td>${e.code.indexOf("PPE")===0?"—":(e.ppe?"yes":"no")}</td></tr>`).join("")
      :`<tr><td colspan="6" style="color:var(--faint)">No actions recorded yet.</td></tr>`)+
    `</tbody>`;
  $("logState").textContent = S.logDone
    ? "Log completed and signed by "+S.learner+"."
    : "Log not yet completed. Sign it before you submit.";
  $("conclState").textContent = S.concl
    ? "Conclusion recorded: "+(S.concl==="ver"?"Verified at zero energy":"NOT verified")+"."
    : "No conclusion recorded.";
}
function render(){
  $("clock").textContent=fmtClock(S.t);
  $("elapsed").textContent=fmtElapsed(S.t);
  renderTiles(); renderRail(); renderPPE(); renderMeter();
  renderLive(); renderCombos(); renderLog();
}

/* ---------- submission sheet ---------- */
function logRowsHTML(rows){
  return `<table><thead><tr><th style="cursor:default">#</th><th style="cursor:default">Site time</th>
      <th style="cursor:default">Action</th><th style="cursor:default">Point</th>
      <th style="cursor:default">Reading</th><th style="cursor:default">PPE</th></tr></thead><tbody>`+
    rows.map(e=>`<tr><td class="mono">${e.n}</td><td class="mono">${e.t}</td>
      <td>${e.label}</td><td>${e.detail||"—"}</td>
      <td class="mono">${e.raw===null?"—":fmtV(e.raw)+" V"}</td>
      <td>${e.code.indexOf("PPE")===0?"—":(e.ppe?"yes":"no")}</td></tr>`).join("")+`</tbody></table>`;
}
function submitGate(){
  S.submitted=true;
  const r=$("gateResult"), b=[];
  b.push(`<h3 style="font-size:15px">${LAB.lab} — ${LAB.title}</h3>
    <div class="sub" style="margin:2px 0 11px">Submission sheet</div>`);
  b.push(kvr("Name",esc(S.learner)||"—")+
         kvr("Completed",stamp())+kvr("Time on task",fmtElapsed(S.t))+
         kvr("Circuit","DP-2 feeder to RTU-4",true));

  b.push(`<h4>Instrument inspection</h4>`+
    kvr("Instrument",V.inst)+kvr("Serial",S.rd.serial||"—")+kvr("Category rating",V.cat)+
    kvr("Calibration due",S.rd.cal||"—")+
    CHECKS.map(c=>kvr(c.text.replace(/\s*\(.*\)\s*$/,""),S.insp[c.id]?"ticked":"not ticked",true)).join("")+
    kvr("Leads examined under magnification",
        S.log.filter(e=>e.code==="LEAD").length?S.log.filter(e=>e.code==="LEAD").map(e=>e.detail).join(", "):"none")+
    kvr("Decision recorded",S.decided?(S.decided==="accept"?"accepted for use":"rejected, out of service"):"none"));

  const tests=testsTaken();
  b.push(`<h4>Tests performed, in the order performed</h4>`+
    (tests.length?logRowsHTML(tests):`<div class="note">No tests recorded.</div>`));

  b.push(`<h4>Personal protective equipment</h4>`+
    kvr("State at the end of the run",S.ppe?"donned":"not donned")+
    kvr("Tests recorded with PPE donned",tests.filter(e=>e.ppe).length+" of "+tests.length));

  b.push(`<h4>Conclusion as stated</h4>`+
    kvr("Conclusion",S.concl?(S.concl==="ver"?"Verified at zero energy":"NOT verified"):"none recorded")+
    kvr("Reason as written",esc(S.reason)||"—",true)+
    kvr("Work halted and instrument tagged out of service",S.log.some(e=>e.code==="HALT")?"yes":"no"));

  b.push(`<h4>Verification log</h4>`+
    (S.log.length?logRowsHTML(S.log):`<div class="note">No actions recorded.</div>`)+
    kvr("Log signed by",S.logDone?esc(S.learner):"not signed"));

  const miss=[];
  if(!S.learner) miss.push("the name on the log");
  if(!S.decided) miss.push("the accept or reject decision on the instrument");
  if(!S.concl) miss.push("your conclusion");
  if(S.reason.trim().length<20) miss.push("the written reason for your conclusion");
  if(!S.logDone) miss.push("the signature that completes the log");
  if(miss.length) b.push(`<div class="todo"><b>Blank fields on this sheet:</b>
    <ul>${miss.map(m=>`<li>${m}</li>`).join("")}</ul></div>`);

  b.push(`<div class="refline">NFPA 70E 120.5(7): use an adequately rated portable test instrument to test each
    phase conductor or circuit part, phase to phase and phase to ground, to verify that they are de-energised;
    and before and after each test, determine that the test instrument is operating satisfactorily through
    verification on a known voltage source.</div>`);
  b.push(`<div class="close">Check every field before printing. Hand this sheet to your instructor with your
    worksheet.</div>
    <div class="row noprint" style="margin-top:11px">
      <button onclick="window.print()">Print submission sheet</button></div>`);

  r.className="result show";
  r.innerHTML=b.join("");
  $("statusBadge").textContent="Sheet built"; $("statusBadge").className="badge run";
  render();
}

/* ---------- run loop ---------- */
function tick(){
  S.t=Math.min(LAB.duration+60,S.t+1/60);
  render();
}
function startClock(){
  if(S.timer) clearInterval(S.timer);
  S.timer=setInterval(tick,1000);
}
function stopClock(){ if(S.timer) clearInterval(S.timer); S.timer=null; }
function startAttempt(){
  buildReadings();
  S.t=0; S.ppe=false; S.insp={}; S.zoom=null; S.decided=null;
  S.log=[]; S.concl=""; S.reason=""; S.logDone=false;
  S.halted=false; S.submitted=false; S.lastLive=null; S.lastIso=null;
  buildView();
  $("statusBadge").textContent="Running"; $("statusBadge").className="badge run";
  startClock(); render();
}

/* ---------- wiring ---------- */
$("btnReset").onclick=startAttempt;
window.addEventListener("resize",render);

/* ---------- boot ---------- */
$("setTag").textContent="Set "+"ABCDEFGH".charAt(SET);
startAttempt();

</script>

tion gate", "k": "text", "p": "Step 7. If the instrument does not read on the known source, stop there. Do not go to DP-2. Halt the work, tag the instrument out of service, and record the halt. Write below what you would put in the log at this point — the exact words, not a summary."}, {"s": "Part 1: The verification gate", "k": "text", "p": "Step 8. Test 2, DEAD. Test the isolated circuit at DP-2. Every conductor and every combination: A-B, B-C, A-C, A-G, B-G, C-G. Six readings, not three. Record every one of them below with its value."}, {"s": "Part 1: The verification gate", "k": "text", "p": "Step 9. Look at your six readings before you move on. If any one of them is not zero, you have not verified anything — you have found something. A single non-zero reading with the breaker open, locked and tagged means voltage is arriving from somewhere outside your lockout. Record whether all six read zero, and if not, which one did not and what you concluded from it."}, {"s": "Part 1: The verification gate", "k": "text", "p": "Step 10. Test 3, LIVE. Return to the PU-1 known live source and test again. It must still read. This is the test that catches an instrument which failed between test 1 and test 2, and nothing else catches it. Record the value and the time."}, {"s": "Part 1: The verification gate", "k": "text", "p": "Step 11. State your conclusion out loud to your instructor. Either “verified at zero energy” or “not verified”, and if not verified, why. Say it clearly and at volume — this is how real crews confirm state to each other, and a mumbled conclusion is not a conclusion. Write the exact words you said."}, {"s": "Part 1: The verification gate", "k": "text", "p": "Step 12. Complete the verification log: the system tested, all six readings, both proving readings with times, the instrument model and serial, your conclusion, and your name and signature. The log is the deliverable. Write your log entry out below."}, {"s": "Part 1: The verification gate", "k": "image", "p": "Step 13. Type your name into the submission panel, press Build submission sheet, print it, and capture the printed sheet and your log below."}, {"s": "Part 2: Reflection", "k": "text", "p": "What does a zero reading mean if you have not proved the instrument on a known source in the last two minutes? Answer directly and then say what that implies about the order of the three tests."}, {"s": "Part 2: Reflection", "k": "text", "p": "Why six combinations and not three? Answer in terms of the physical path the voltage takes to reach a conductor, and describe the specific fault that three phase-to-phase tests would never see."}, {"s": "Part 2: Reflection", "k": "text", "p": "Whatever actually happened at your bench, write the log entry you would have filed if your instrument had failed at test 1 and you had stopped there. Write the entry itself, not a description of it, and then say whether that entry represents a failed shift or a successful one."}, {"s": "Part 2: Reflection", "k": "text", "p": "You wore full PPE to test a circuit that was locked, tagged and believed dead. Justify that in one sentence that does not use the words “rule”, “policy” or “required”."}]};</script>
<!-- ===== UCI 2227 · Submission module v2.0 =====================================
     Collects every handout question and its response inside this lab tool and
     exports ONE print-to-PDF submission sheet for Canvas grading.
     Self-contained. No external libraries. Safe to re-inject (idempotent).

     v2.0 — WCAG 2.1 AA pass (label association, headings, alt text, contrast,
     status announcement, authored focus); image downscale before storage with a
     visible error if the quota still throws; Save-as-PDF filename set from the
     learner name; print pagination and running header; duplicate learner-name

     ========================================================================= -->

  /* authored focus — the simulators author none, so this is the only visible ring.

  /* ---- the assembled submission sheet ---- */

  #lqPrint{display:none}

  /* ---- print: only the sheet ---- */

<script id="lqScript">
(function(){
  if(window.__lqLoaded) return; window.__lqLoaded=true;

  var esc=function(s){return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};

  var KEY="uci2227:"+LQ.file;
  var store={}, storageBroken=false;
  try{ store=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ store={}; }

  /* ---------- cross-lab storage budget ----------
     Every lab in the module is served from one origin, so all 43 share a single
     ~5 MB localStorage budget. Seventeen image questions at ~325 KB apiece is 5.4 MB
     — a learner working through the whole module on one browser profile would run out
     near the end. Images belonging to OTHER labs are evicted when room is needed,
     oldest and already-exported first. Text answers are never evicted: they are tiny,
     and they are the part a learner cannot reproduce. An evicted image is already
     inside the submission PDF that lab produced. */
  function otherLabKeys(){
    var out=[];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf("uci2227:")===0&&k!==KEY) out.push(k);
      }
    }catch(e){}
    return out;
  }
  function usedBytes(){
    var n=0;
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf("uci2227:")===0) n+=(localStorage.getItem(k)||"").length;
      }
    }catch(e){}
    return n;
  }
  function evictOtherImages(target){
    /* returns bytes freed. Prefers labs whose PDF has already been built, then oldest. */
    var recs=[];
    otherLabKeys().forEach(function(k){
      var raw,obj;
      try{ raw=localStorage.getItem(k)||"{}"; obj=JSON.parse(raw); }catch(e){ return; }
      var imgBytes=0;
      for(var f in obj) if(/_img$/.test(f)) imgBytes+=String(obj[f]).length;
      if(imgBytes>0) recs.push({k:k,obj:obj,bytes:imgBytes,ts:obj._ts||0,done:obj._done?1:0});
    });
    recs.sort(function(a,b){ return (b.done-a.done)||(a.ts-b.ts); });
    var freed=0;
    for(var i=0;i<recs.length&&freed<target;i++){
      var r=recs[i];
      for(var f in r.obj) if(/_img$/.test(f)) delete r.obj[f];
      r.obj._evicted=true;
      try{ localStorage.setItem(r.k,JSON.stringify(r.obj)); freed+=r.bytes; }catch(e){}
    }
    return freed;
  }

  function save(){
    store._ts=Date.now();
    var payload;
    try{ payload=JSON.stringify(store); }catch(e){ return false; }
    try{
      localStorage.setItem(KEY,payload);
      if(storageBroken){ storageBroken=false; showStoreErr(null); }
      return true;
    }catch(e){
      /* make room from other labs, then try once more */
      if(evictOtherImages(payload.length+200000)>0){
        try{
          localStorage.setItem(KEY,payload);
          if(storageBroken){ storageBroken=false; showStoreErr(null); }
          return true;
        }catch(e2){}
      }
      storageBroken=true;
      showStoreErr(e);
      return false;
    }
  }
  function showStoreErr(e){
    var b=document.getElementById("lqStoreErr");
    if(!b) return;
    if(!e){ b.style.display="none"; return; }
    b.style.display="block";
    b.innerHTML='<b>Your work is no longer being saved in this browser.</b><br>'
      +'Storage is full or switched off — usually private browsing, or a great many images '
      +'attached across the labs on this machine. Everything on screen is intact and the '
      +'submission PDF will still build correctly — but <b>do not refresh or close this tab</b>. '
      +'Press <b>Build submission PDF</b> now and save the file. '
      +'Then press <b>Clear my responses</b> to free the space up for the next lab.';
    if(b.scrollIntoView) b.scrollIntoView({block:"nearest"});
  }

  function announce(msg){
    var s=document.getElementById("lqStatus");
    if(s){ s.textContent=""; setTimeout(function(){ s.textContent=msg; },30); }
  }

  /* ---------- detect the set letter the tool is running ---------- */
  function setLetter(){
    try{ if(typeof SETLETTER!=="undefined"&&SETLETTER) return SETLETTER; }catch(e){}
    var tag=document.getElementById("setTag");
    if(tag&&tag.textContent){
      var m=tag.textContent.match(/set\s+([A-H])/i); if(m) return m[1].toUpperCase();
    }
    var m2=(LQ.file||"").match(/524-\d-\d-([A-H])_/); if(m2) return m2[1];
    return LQ.set||"—";
  }

  /* ---------- downscale an image before it goes anywhere near storage ----------
     A phone photo is 2-5 MB and base64 inflates it by a third; localStorage is
     about 5 MB for the whole origin. Downscaling to 1600px JPEG brings a typical
     capture under 400 KB, which is still far more detail than the PDF can show. */
  var MAXPX=1600, JPEGQ=0.82;
  function downscale(file,cb){
    var rd=new FileReader();
    rd.onerror=function(){ cb(null,"The browser could not read that file."); };
    rd.onload=function(){
      var img=new Image();
      img.onerror=function(){ cb(null,"That file does not look like an image the browser can open."); };
      img.onload=function(){
        try{
          var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
          if(!w||!h){ cb(rd.result,null); return; }
          var sc=Math.min(1,MAXPX/Math.max(w,h));
          if(sc>=1&&rd.result.length<600000){ cb(rd.result,null); return; }
          var cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
          var c=document.createElement("canvas"); c.width=cw; c.height=ch;
          var x=c.getContext("2d");
          x.fillStyle="#fff"; x.fillRect(0,0,cw,ch);
          x.drawImage(img,0,0,cw,ch);
          cb(c.toDataURL("image/jpeg",JPEGQ),null);
        }catch(err){ cb(rd.result,null); }
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  }

  /* ---------- build the card ---------- */
  var host=document.querySelector("main .wrap")||document.querySelector("main")||document.body;
  var card=document.createElement("section");
  card.id="lqCard";
  card.setAttribute("aria-labelledby","lqCardTitle");

  var qs=LQ.items, secs=[], cur=null;
  qs.forEach(function(it,i){
    if(!cur||cur.name!==it.s){ cur={name:it.s,list:[]}; secs.push(cur); }
    cur.list.push({i:i,it:it});
  });

  var html=""
   +'<h2 id="lqCardTitle">Lab submission — questions and responses</h2>'
   +'<p class="lqsub">Every question from the <b>'+esc(LQ.handout)+'</b> handout is answered here, not on paper. '
   +'Your responses, together with the record this simulator builds, print to a <b>single PDF</b> that you upload to Canvas. '
   +'Your work is kept in this browser as you type, so a refresh will not lose it.</p>'
   +'<div id="lqStoreErr" role="alert"></div>'
   +'<p id="lqStatus" class="lqvh" role="status" aria-live="polite"></p>'
   +'<div class="lqid">'
   +'<div class="lqfld" style="flex:1 1 260px"><label for="lqName">Your name</label>'
     +'<input type="text" id="lqName" autocomplete="name" placeholder="First and last" value="'+esc(store.name||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 180px"><label for="lqCohort">Cohort / section</label>'
     +'<input type="text" id="lqCohort" placeholder="e.g. UCI 2227-01" value="'+esc(store.cohort||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 150px"><label for="lqDate">Date</label>'
     +'<input type="text" id="lqDate" value="'+esc(store.date||new Date().toLocaleDateString())+'"></div>'
   +'</div>';

  secs.forEach(function(sec,si){
    html+='<h3 class="lqsec" id="lqSec'+si+'">'+esc(sec.name||"Questions")+'</h3>';
    sec.list.forEach(function(o){
      var id="lqQ"+o.i, n=o.i+1;
      html+='<div class="lqq">';
      if(o.it.k==="image"){
        html+='<p class="lqp"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</p>'
             +'<div class="lqimgwrap">'
             +'<label class="lqfilelbl" for="'+id+'_f">Attach your image for question '+n+'</label>'
             +'<input type="file" accept="image/*" id="'+id+'_f">'
             +'<p class="lqnote" style="margin:5px 0 0">A photo or screenshot. It is resized and '
             +'embedded in the PDF you hand in.</p>'
             +'<img id="'+id+'_img" alt="Your attached image for question '+n+'" style="display:none">'
             +'<label class="lqfilelbl" for="'+id+'" style="margin-top:8px">Caption or note for question '+n+'</label>'
             +'<textarea id="'+id+'" rows="2" placeholder="Add any caption or note that goes with the image.">'
             +esc(store[id]||"")+'</textarea></div>';
      }else{
        html+='<label class="lqp" for="'+id+'"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</label>'
             +'<textarea id="'+id+'" rows="3" placeholder="Type your answer here.">'+esc(store[id]||"")+'</textarea>';
      }
      html+='</div>';
    });
  });

  html+='<div class="lqbtns">'
    +'<button type="button" class="lqprimary" id="lqBuild">Build submission PDF</button>'
    +'<button type="button" id="lqPreview">Preview without printing</button>'
    +'<button type="button" id="lqClear">Clear my responses</button>'
    +'<span class="lqnote">The PDF carries every question, your responses and the simulator record. One file, one upload.</span>'
    +'</div><div id="lqOut" role="region" aria-label="Submission sheet preview"></div>';

  card.innerHTML=html;
  host.appendChild(card);

  /* ---------- wiring ---------- */
  ["lqName","lqCohort","lqDate"].forEach(function(id){
    var el=document.getElementById(id);
    el.oninput=function(){ store[id.replace("lq","").toLowerCase()]=el.value; save(); };
  });
  qs.forEach(function(it,i){
    var id="lqQ"+i, ta=document.getElementById(id);
    if(ta) ta.oninput=function(){ store[id]=ta.value; save(); };
    var f=document.getElementById(id+"_f");
    if(f) f.onchange=function(){
      var file=f.files&&f.files[0]; if(!file) return;
      announce("Processing your image for question "+(i+1)+".");
      downscale(file,function(dataUrl,err){
        if(err){ announce(err); alert(err); return; }
        var img=document.getElementById(id+"_img");
        img.src=dataUrl; img.style.display="block";
        store[id+"_img"]=dataUrl;
        var okSave=save();
        announce("Image attached to question "+(i+1)+
          (okSave?"." : ", but it could not be saved in this browser. Build your PDF now."));
      });
    };
    if(store[id+"_img"]){
      var im0=document.getElementById(id+"_img");
      if(im0){ im0.src=store[id+"_img"]; im0.style.display="block"; }
    }
  });

  /* an image of this lab was evicted to make room for another lab on the shared
     origin, and this lab had not yet been exported — say so plainly */
  if(store._evicted&&!store._done){
    var eb=document.getElementById("lqStoreErr");
    eb.style.display="block";
    eb.innerHTML='<b>An image you attached is no longer stored.</b><br>'
      +'This browser ran out of room across all the labs on this machine and dropped it. '
      +'Your typed answers are all still here — only the image went. '
      +'Attach it again before you build your submission PDF.';
    delete store._evicted; save();
  }

  document.getElementById("lqClear").onclick=function(){
    if(!confirm("Clear every response you have typed in this lab? This cannot be undone.")) return;
    store={}; save();
    qs.forEach(function(it,i){
      var ta=document.getElementById("lqQ"+i); if(ta) ta.value="";
      var im=document.getElementById("lqQ"+i+"_img"); if(im){ im.removeAttribute("src"); im.style.display="none"; }
      var fi=document.getElementById("lqQ"+i+"_f"); if(fi) fi.value="";
    });
    document.getElementById("lqOut").innerHTML="";
    announce("All responses cleared.");
  };

  /* ---------- guard the simulator's Restart button ----------
     Restart wipes the simulator record but not the responses typed here, which
     would leave a submission whose prose describes a record that no longer exists.
     A capture-phase listener runs ahead of the tool's own onclick, so one confirm
     covers every variant of the handler. */
  (function(){
    var rb=document.getElementById("btnRestart")||document.getElementById("btnReset");
    if(!rb||card.contains(rb)) return;
    rb.addEventListener("click",function(ev){
      if(rb.dataset.lqOk==="1"){ rb.dataset.lqOk=""; return; }
      ev.preventDefault(); ev.stopImmediatePropagation();
      var ok=confirm(
        "Restart the scenario?\n\n"+
        "Everything you recorded in the simulator — readings, marks, logs, the "+
        "submission sheet it built — is wiped and the run starts again.\n\n"+
        "The answers you typed in the submission panel lower down are KEPT. If they "+
        "describe readings you are about to erase, build your submission PDF first.");
      if(ok){ rb.dataset.lqOk="1"; rb.click(); }
    },true);
  })();

  /* ---------- harvest the simulator's own record ---------- */
  var REC_SEL=".sheet, .result.show";
  function collect(){
    var raw=[];
    Array.prototype.forEach.call(document.querySelectorAll(REC_SEL),function(s){
      if(card.contains(s)) return;
      if(!s.textContent.replace(/\s/g,"")) return;
      raw.push(s);
    });
    return raw.filter(function(s){
      return !raw.some(function(o){ return o!==s && o.contains(s); });
    });
  }

  /* the module already prints the learner name in its own Learner block, and every
     simulator sheet prints it again — four of them twice. Strip it from the clone. */
  var NAMEKEY=/^(your\s+)?(name|learner(\s+name)?)\s*:?\s*$/i;
  function stripDuplicateName(root){
    Array.prototype.forEach.call(root.querySelectorAll(".learnerline"),function(n){
      if(n.parentNode) n.parentNode.removeChild(n);
    });
    var rows=root.querySelectorAll("div,tr,p");
    Array.prototype.forEach.call(rows,function(r){
      var first=r.firstElementChild;
      if(!first||r.children.length>3) return;
      if(NAMEKEY.test((first.textContent||"").trim())){
        if(r.parentNode) r.parentNode.removeChild(r);
      }
    });
  }

  function toolRecord(){
    var found=collect();
    if(!found.length){
      var btns=document.querySelectorAll("button");
      var hit=null;
      Array.prototype.forEach.call(btns,function(b){
        if(card.contains(b)||hit) return;
        var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
        if(/print/.test(t)) return;
        if(/^build submission sheet$/.test(t)) hit=b;
      });
      if(!hit){
        Array.prototype.forEach.call(btns,function(b){
          if(card.contains(b)||hit) return;
          var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
          if(/print/.test(t)) return;
          if(/build .*sheet|submission sheet|submit .*(map|answer|sheet|round|log)|^submit$/.test(t)) hit=b;
        });
      }
      if(hit){ try{ hit.click(); }catch(e){} }
      found=collect();
    }
    if(!found.length) return null;
    var wrap=document.createElement("div");
    found.forEach(function(s){
      var c=s.cloneNode(true);
      Array.prototype.forEach.call(c.querySelectorAll(".noprint, button"),function(n){
        if(n.parentNode) n.parentNode.removeChild(n);
      });
      stripDuplicateName(c);
      wrap.appendChild(c);
    });
    return wrap.innerHTML;
  }

  /* ---------- assemble the one sheet ---------- */
  function build(){
    var name=document.getElementById("lqName").value.trim();
    var coh=document.getElementById("lqCohort").value.trim();
    var dt=document.getElementById("lqDate").value.trim();
    var gaps=[];
    if(!name) gaps.push("Your name");
    if(!coh)  gaps.push("Cohort / section");

    var h=''
     +'<div class="lqsheet">'
     +'<h1>'+esc(LQ.lab)+' — '+esc(LQ.title)+'</h1>'
     +'<div class="lqmeta">UCI 2227 · Module 524 · '+esc(LQ.handout)
       +' · Set '+esc(setLetter())+' · submission sheet</div>'
     +'<h2>Learner</h2>'
     +'<div class="lqrow"><span class="k">Name</span><span class="v">'+(esc(name)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Cohort / section</span><span class="v">'+(esc(coh)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Date</span><span class="v">'+(esc(dt)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Scenario set</span><span class="v">'+esc(setLetter())+'</span></div>'
     +'<div class="lqrow"><span class="k">Built</span><span class="v">'
       +esc(new Date().toLocaleString())+'</span></div>';

    var rec=LQ.nosim?null:toolRecord();
    if(rec){ h+='<h2>Simulator record</h2>'+rec; }
    else if(!LQ.nosim){
      gaps.push("The simulator record — work through the lab tool above and press its own "
               +"“Build submission sheet” button before you build this PDF");
    }else{
      h+='<h2>Assessed on the floor</h2>'
        +'<div class="lqrow"><span class="k">Practical steps</span><span class="v">'
        +'Observed and signed off by the instructor against the handout. '
        +'The instructor signature below records that sign-off.</span></div>';
    }

    var curSec=null;
    qs.forEach(function(it,i){
      if(it.s!==curSec){ curSec=it.s; h+='<h2>'+esc(curSec||"Questions")+'</h2>'; }
      var ta=document.getElementById("lqQ"+i);
      var a=ta?ta.value.trim():"";
      var im=store["lqQ"+i+"_img"];
      if(!a&&!im) gaps.push("Q"+(i+1));
      h+='<div class="lqa"><div class="q"><span class="qn">Q'+(i+1)+'.</span>'+esc(it.p)+'</div>';
      if(im) h+='<img src="'+im+'" alt="Attachment for question '+(i+1)+'">';
      h+='<div class="a'+((!a&&!im)?" blank":"")+'">'+(a?esc(a):"— not answered —")+'</div></div>';
    });

    if(gaps.length){
      h+='<div class="lqgap"><b>Not yet filled in ('+gaps.length+'):</b> '+esc(gaps.join(", "))
        +'.<br>This is a completeness check, not a grade. Fill them in and build again, '
        +'or hand the sheet in as it stands and explain the gaps to your instructor.</div>';
    }else{
      h+='<div class="lqgap ok">'
        +'<b>Complete.</b> Every question on this sheet carries a response and the simulator record is attached.</div>';
    }

    h+='<div class="lqsign">Learner signature: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'Instructor verification: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'<span style="font-size:11px">Save this as a PDF and upload the single file to the '
      +esc(LQ.lab)+' assignment in Canvas.</span></div></div>';

    document.getElementById("lqOut").innerHTML=h;
    announce(gaps.length
      ? ("Submission sheet built. "+gaps.length+" item"+(gaps.length===1?"":"s")+" still blank: "+gaps.join(", ")+".")
      : "Submission sheet built. Every question carries a response.");
    return h;
  }

  document.getElementById("lqPreview").onclick=function(){
    build();
    var o=document.getElementById("lqOut");
    if(o&&o.scrollIntoView) o.scrollIntoView({behavior:"smooth",block:"start"});
  };

  /* ---------- the one PDF ---------- */
  function safeName(s){
    return String(s||"").normalize?String(s||"").normalize("NFKD").replace(/[^\w\s-]/g,"").trim()
      :String(s||"").replace(/[^\w\s-]/g,"").trim();
  }
  function fileTitle(){
    var n=safeName(document.getElementById("lqName").value).split(/\s+/).filter(Boolean);
    var last=n.length>1?n[n.length-1]:(n[0]||"Learner");
    var first=n.length>1?n.slice(0,-1).join("_"):"";
    var who=first?(last+"_"+first):last;
    return who+"_"+String(LQ.lab||"").replace(/[^\d.]/g,"");
  }

  document.getElementById("lqBuild").onclick=function(){
    var h=build();
    /* this lab's images are now inside a PDF the learner holds, so they become the
       first thing evicted when another lab needs room on the shared origin */
    store._done=true; save();

    var old=document.getElementById("lqPrint"); if(old) old.parentNode.removeChild(old);

    /* The sheet goes inside a one-cell table whose thead repeats on every printed
       page, so pages 2+ still carry the learner name, the lab and the set. */
    var runHead='<span class="r">'+esc(LQ.lab)+' · Set '+esc(setLetter())+'</span>'
      +esc(document.getElementById("lqName").value.trim()||"Name not entered")
      +' · '+esc(LQ.title);
    var pr=document.createElement("div"); pr.id="lqPrint";
    pr.innerHTML='<table class="lqpage"><thead class="lqrhead"><tr><td class="lqrh">'
      +runHead+'</td></tr></thead><tbody><tr><td class="lqbody">'+h+'</td></tr></tbody></table>';
    document.body.appendChild(pr);

    /* the browser suggests document.title as the Save-as-PDF filename */
    var prevTitle=document.title;
    document.title=fileTitle();
    document.body.classList.add("lq-print");

    var restored=false;
    var done=function(){
      if(restored) return; restored=true;
      document.body.classList.remove("lq-print");
      document.title=prevTitle;
      var a=document.getElementById("lqPrint"); if(a&&a.parentNode) a.parentNode.removeChild(a);
      window.removeEventListener("afterprint",done);
      if(mq&&mq.removeListener) mq.removeListener(mqHandler);
    };
    var mq=window.matchMedia?window.matchMedia("print"):null;
    var mqHandler=function(m){ if(!m.matches) done(); };
    if(mq&&mq.addListener) mq.addListener(mqHandler);
    window.addEventListener("afterprint",done);

    setTimeout(function(){
      window.print();
      /* generous fallback: mobile print sheets are asynchronous, and tearing the
         container out too early yields a blank PDF */
      setTimeout(done,60000);
    },80);
  };
})();
</script>
<!-- ===== end submission module ============================================= -->

</body>
