<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLAB 524.3.3 — Chiller Loop Fault Diagnosis — UCI 2227 (Training Simulator)</title>
<style>
  :root{
    --bg:#0b1620; --panel:#132433; --panel2:#0f1d29; --line:#4a7291;
    --ink:#dfeaf3; --dim:#8ba6bd; --faint:#7e9bb2;
    --blue:#33a6e8; --navy:#0079C0; --ice:#CFEBFC;
    --ok:#37c07a; --warn:#e8a33d; --stop:#e8604c;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
  button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:5px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:7px 13px}
  button:hover{background:#1b3044;border-color:#2d4d68}
  button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  button.primary:hover{background:#0a8bd8}
  button.danger{background:#4a1f1a;border-color:#6d3129;color:#ffb9ae}
  button:disabled{opacity:.4;cursor:not-allowed}
  select,input[type=text],input[type=number],textarea{
    font-family:inherit;font-size:13px;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:5px;padding:7px 9px}
  textarea{width:100%;resize:vertical;font-size:13px;line-height:1.45}
  h1,h2,h3{margin:0;font-weight:700}
  .mono{font-family:var(--mono)}

  /* ---------- shell ---------- */
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{font-weight:700;letter-spacing:.4px;font-size:14px}
  .brand span{color:var(--blue)}
  .sysname{color:var(--dim);font-size:12px;border-left:1px solid var(--line);padding-left:16px}
  .spacer{flex:1}
  .clock{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:1px}
  .clocklbl{color:var(--faint);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;text-align:right}
  .badge{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700;
    padding:4px 10px;border-radius:20px;background:#16324a;color:var(--blue);border:1px solid #23485f}
  .badge.run{background:#123a2a;color:var(--ok);border-color:#1d5b41}
  .badge.hold{background:#3d3220;color:var(--warn);border-color:#5c4c2e}

  main{flex:1;overflow:auto;padding:18px}
  .wrap{max-width:1500px;margin:0 auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin-bottom:14px}
  .card h3{font-size:15px;margin-bottom:4px}
  .card p{color:var(--dim);margin:0 0 14px;line-height:1.5;font-size:13px}
  .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);font-weight:700}
  .hint{font-size:12px;color:var(--faint);line-height:1.5;margin-top:10px}

  /* ---------- console ---------- */
  .toolbar{display:flex;gap:9px;align-items:center;padding:9px 18px;background:var(--panel2);
    border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1fr 1fr}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px}
  .tile .name{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:700}
  .tile .val{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1.15;margin-top:5px}
  .tile .unit{font-size:14px;color:var(--dim);font-weight:400;margin-left:3px}
  .tile .band{font-size:11px;color:var(--faint);margin-top:5px;font-family:var(--mono)}
  .tile.alarm{border-color:var(--stop);background:#2a1512}
  .tile.alarm .val{color:var(--stop)}
  .tile.caution{border-color:#5c4c2e}
  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .chartbox h3{font-size:13px;margin-bottom:2px}
  .chartbox .sub{font-size:11px;color:var(--faint);margin-bottom:8px}
  canvas{display:block;width:100%;height:auto}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .stepchip{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:4px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .stepchip.on{background:#16324a;border-color:var(--blue);color:var(--ice)}

  /* ---------- alarms ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);
    font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--blue)}
  td{padding:8px 10px;border-bottom:1px solid #182b3b;vertical-align:top}
  tr.ack{opacity:.42}
  .sev{font-size:10px;letter-spacing:.8px;font-weight:700;padding:3px 8px;border-radius:3px;white-space:nowrap}
  .sev.critical{background:#4a1f1a;color:#ff8f7d}
  .sev.high{background:#4a3418;color:#ffc069}
  .sev.medium{background:#1c3a4f;color:#7fc4ea}
  .sev.low{background:#22303a;color:#8ba6bd}
  .tick{display:inline-block;width:15px;height:15px;border:1px solid var(--line);border-radius:3px;
    background:var(--panel2);cursor:pointer;vertical-align:-3px}
  .tick.on{background:var(--blue);border-color:var(--blue)}
  .flt{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .flt .chip{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
    background:var(--panel2);color:var(--dim);cursor:pointer}
  .flt .chip.on{background:#16324a;border-color:var(--blue);color:var(--ice)}
  .counter{font-family:var(--mono);font-size:12px;color:var(--faint)}

  .note{font-size:12px;color:var(--dim);line-height:1.55}
  .hidden{display:none !important}

  /* ---------- submission ---------- */
  .submit{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-top:14px}
  .submit h3{font-size:14px;margin-bottom:3px}
  .submit .sub{font-size:12px;color:var(--faint);margin-bottom:13px}
  .fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
  .result{margin-top:12px;padding:13px;border-radius:7px;font-size:13px;line-height:1.55;display:none}
  .result.show{display:block;background:var(--panel2);border:1px solid var(--line)}
  .srow{display:flex;gap:14px;padding:6px 0;border-bottom:1px solid #182b3b;font-size:12.5px;align-items:flex-start}
  .srow .sk{color:var(--faint);min-width:230px;flex:0 0 auto}
  .srow .sv{flex:1;white-space:pre-wrap}
  .sheet h4{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue);margin:16px 0 6px}
  .sheet h4:first-child{margin-top:0}
  .learnerline{font-size:14px;margin:2px 0 8px}
  @media print{
    body{background:#fff;color:#000;overflow:visible}
    header,.toolbar,.noprint{display:none !important}
    main{overflow:visible}
  }

  .labtag{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;
    color:var(--blue);margin-bottom:8px}
  .lede{color:var(--dim);line-height:1.6;margin:0 0 26px;max-width:820px}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">CHILLED WATER DIAGNOSTIC CONSOLE</div>
    <div class="sysname">GLAB 524.3.3 &middot; UCI 2227 · objective 9 · <span id="setTag"></span> · TRAINING SIMULATOR — not connected to any live plant</div>
    <div class="spacer"></div>
    <div id="statusBadge" class="badge">Ready</div>
    <div>
      <div class="clocklbl">Site time</div>
      <div class="clock mono" id="clock">--:--:--</div>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <button id="btnStart" class="primary">Start run</button>
    <button id="btnPause">Pause</button>
    <button id="btnStep">Step +1 min</button>
    <span style="width:10px"></span>
    <div class="fld"><label>Speed</label>
      <select id="speed">
        <option value="1">Real time (1x)</option>
        <option value="4">4x</option>
        <option value="12" selected>12x</option>
        <option value="30">30x</option>
        <option value="60">60x</option>
      </select>
    </div>
    <button id="btnLog">Log readings</button>
    <span class="spacer"></span>
    <span class="counter" id="logCount">0 logged</span>
    <span class="counter" id="elapsed">T+00:00</span>
    <button id="btnRestart">Restart</button>
  </div>

  <main>
    <div class="wrap">
      <section id="chwView"></section>
    </div>
  </main>
</div>


<script>
"use strict";
const SET = 0;   /* fixed for this file */
/* ============================================================
   UCI 2227 — GLAB 524.3.3 · Chiller Loop Fault Diagnosis
   Standalone training console. Offline, no libraries, no network.
   Telemetry model and chart code are identical to the other lab tools.
   ============================================================ */

/* ---------- fixed scenario ---------- */
const SETLETTER="ABCDEFGH".charAt(SET);
const RUNKEY=(0x9E3779B1 ^ Math.imul(SET+1,2654435761))>>>0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry32(1);
function noise(amp){return (rnd()*2-1)*amp;}
function fmtClock(mins){
  const base=3*60+14; // scenarios run from 03:14 site time
  const total=base+mins;
  const h=Math.floor(total/60)%24, m=Math.floor(total%60), s=Math.floor((mins%1)*60);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtElapsed(mins){
  return "T+"+String(Math.floor(mins)).padStart(2,"0")+":"+String(Math.floor((mins%1)*60)).padStart(2,"0");
}
function drawChart(cv,cfg){
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cfg.height||150;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  const x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,W,H);
  const pad={l:46,r:10,t:10,b:20};
  const pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  const {min,max}=cfg;
  const sy=v=>pad.t+ph-((v-min)/(max-min))*ph;
  const sx=i=>pad.l+(i/Math.max(1,cfg.xmax))*pw;

  // alarm band shading
  if(cfg.band){
    x.fillStyle="rgba(232,96,76,.10)";
    if(cfg.band.hi<max) x.fillRect(pad.l,pad.t,pw,sy(cfg.band.hi)-pad.t);
    if(cfg.band.lo>min) x.fillRect(pad.l,sy(cfg.band.lo),pw,pad.t+ph-sy(cfg.band.lo));
  }
  // grid + y labels
  x.strokeStyle="#1d3346"; x.lineWidth=1; x.font="10px "+getComputedStyle(document.body).fontFamily;
  x.fillStyle="#5c7a92"; x.textAlign="right"; x.textBaseline="middle";
  for(let i=0;i<=4;i++){
    const v=min+(max-min)*i/4, yy=sy(v);
    x.beginPath(); x.moveTo(pad.l,yy); x.lineTo(W-pad.r,yy); x.stroke();
    x.fillText(cfg.fmt?cfg.fmt(v):v.toFixed(1),pad.l-6,yy);
  }
  // step markers
  if(cfg.steps) cfg.steps.forEach(s=>{
    if(s>cfg.xmax) return;
    x.strokeStyle="#25415a"; x.setLineDash([3,3]);
    x.beginPath(); x.moveTo(sx(s),pad.t); x.lineTo(sx(s),pad.t+ph); x.stroke(); x.setLineDash([]);
  });
  // series
  (cfg.series||[]).forEach(se=>{
    if(!se.data.length) return;
    x.strokeStyle=se.color; x.lineWidth=se.width||2; x.beginPath();
    se.data.forEach((v,i)=>{ const px=sx(i*(cfg.xstep||1)), py=sy(clamp(v,min,max));
      i?x.lineTo(px,py):x.moveTo(px,py); });
    x.stroke();
    // last point dot
    const li=se.data.length-1;
    x.fillStyle=se.color; x.beginPath();
    x.arc(sx(li*(cfg.xstep||1)),sy(clamp(se.data[li],min,max)),2.6,0,7); x.fill();
  });
  // x label
  x.fillStyle="#5c7a92"; x.textAlign="center"; x.textBaseline="top";
  x.fillText(cfg.xlabel||"minutes",pad.l+pw/2,H-13);
}
function tile(name,val,unit,band,cls){
  return `<div class="tile ${cls||''}"><div class="name">${name}</div>
    <div class="val">${val}<span class="unit">${unit||''}</span></div>
    <div class="band">${band||''}</div></div>`;
}

/* ---------- this lab ---------- */
const LAB={lab:"GLAB 524.3.3",obj:"objective 9",title:"Chiller Loop Fault Diagnosis",duration:40};

const SCENARIOS=[{id:"B1"},{id:"B2"},{id:"B3"},{id:"B4"}];

const S={learner:"",t:0,running:false,timer:null,speed:12,
  series:{},last:null,base:null,logs:[]};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
let V=SCENARIOS[SET];

/* ---------- model ---------- */
function chwSample(t,v){
  const inj=14;
  let prog=0;
  if(t>inj){
    if(v==="B2")      prog=clamp((t-inj)/22,0,1);
    else if(v==="B4") prog=clamp((t-inj)/0.25,0,1);
    else              prog=clamp((t-inj)/1.6,0,1);
  }
  let flow,press,diff,amps;
  if(v==="B3"){
    flow =40-14*prog+noise(.35);
    press=52-14*prog+noise(.6);
    diff = 6-0.6*prog+noise(.25);
    amps =22-2.4*prog+noise(prog>0?1.5:.25);
  }else if(v==="B4"){
    flow =40-22*prog+noise(.35);
    press=52+29*prog+noise(.7);
    diff = 6+28*prog+noise(.4);
    amps =22-2.0*prog+noise(.25);
  }else if(v==="B2"){
    flow =40-16*prog+noise(.35);
    press=52+19*prog+noise(.6);
    diff = 6+18*prog+noise(.35);
    amps =22-1.6*prog+noise(.25);
  }else{
    flow =40-18*prog+noise(.35);
    press=52+24*prog+noise(.6);
    diff = 6+22*prog+noise(.35);
    amps =22-1.8*prog+noise(.25);
  }
  const supply=7.0+noise(.06);
  const ret=supply+6.0*(40/Math.max(12,flow))+noise(.09);
  return {flow,press,diff,amps,supply,ret,dt:ret-supply,prog};
}

const COMPONENTS=["Downstream restriction — blocked valve","Downstream restriction — fouled strainer",
  "Downstream restriction — failed actuator","Pump fault","Chiller CH-1 capacity fault","Flow transmitter fault"];
const EVIDENCE=[
  {id:"press-up",txt:"Pump discharge pressure ROSE while flow fell"},
  {id:"press-down",txt:"Pump discharge pressure FELL with flow"},
  {id:"amps-up",txt:"Motor current rose above FLA"},
  {id:"dt-wide",txt:"Delta T across the loop widened"}];
function logReading(){
  const d=S.last||chwSample(S.t,V.id);
  S.logs.push({t:S.t,clock:fmtClock(S.t),flow:d.flow,press:d.press,diff:d.diff,amps:d.amps,
               supply:d.supply,ret:d.ret,dt:d.dt});
  updateLogCount();
  const t=$("logTable"); if(t) t.innerHTML=logTableHTML();
}
function updateLogCount(){ const c=$("logCount"); if(c) c.textContent=S.logs.length+" logged"; }
function readingCells(d){
  return d.flow.toFixed(1)+" gpm &middot; "+d.press.toFixed(1)+" psi &middot; "+d.diff.toFixed(1)+" psi &middot; "+
         d.amps.toFixed(1)+" A &middot; "+d.supply.toFixed(1)+" / "+d.ret.toFixed(1)+" \u00b0C &middot; \u0394T "+d.dt.toFixed(1)+" K";
}
function logTableHTML(){
  if(!S.logs.length) return '<div class="counter">No readings logged yet. Use <b>Log readings</b> in the toolbar to timestamp what is on the screen.</div>';
  return '<table><thead><tr><th style="cursor:default">Site time</th><th style="cursor:default">Elapsed</th>'+
    '<th style="cursor:default">Flow</th><th style="cursor:default">Pump discharge</th><th style="cursor:default">Differential</th>'+
    '<th style="cursor:default">Motor current</th><th style="cursor:default">Supply / return</th><th style="cursor:default">Delta T</th></tr></thead><tbody>'+
    S.logs.map(l=>'<tr><td class="mono">'+l.clock+'</td><td class="mono">'+fmtElapsed(l.t)+'</td>'+
      '<td class="mono">'+l.flow.toFixed(1)+' gpm</td><td class="mono">'+l.press.toFixed(1)+' psi</td>'+
      '<td class="mono">'+l.diff.toFixed(1)+' psi</td><td class="mono">'+l.amps.toFixed(1)+' A</td>'+
      '<td class="mono">'+l.supply.toFixed(1)+' / '+l.ret.toFixed(1)+' \u00b0C</td><td class="mono">'+l.dt.toFixed(1)+' K</td></tr>').join("")+
    '</tbody></table>';
}
function srow(k,v){ return '<div class="srow"><div class="sk">'+k+'</div><div class="sv">'+v+'</div></div>'; }
function buildSheet(){
  const _n=$("learnerName"); if(_n) S.learner=_n.value.trim();
  const comp=$("ansComp").value;
  const evSel=$("ansEvid"), ev=evSel.value;
  const evTxt=ev?EVIDENCE.filter(e=>e.id===ev)[0].txt:"";
  const ticket=$("ansText").value.trim();
  const missing=[];
  if(!S.logs.length) missing.push("no readings logged from the run");
  if(!comp) missing.push("component at fault");
  if(!ev) missing.push("evidence chain");
  if(!ticket) missing.push("fix ticket");
  if(!S.learner) missing.push("your name");
  let h='<div class="sheet"><h4>'+LAB.lab+" \u2014 "+LAB.title+" \u00b7 Set "+SETLETTER+'</h4>';
  h+='<div class="learnerline"><b>Name:</b> '+(esc(S.learner)||"\u2014")+'</div>';
  h+=srow("Learner",esc(S.learner)||"&mdash;");
  h+=srow("Set",SETLETTER);
  h+=srow("Completed",stamp());
  h+=srow("Elapsed on the console",fmtElapsed(S.t)+" simulated");
  h+='<h4>Baseline readings</h4>';
  h+=srow("At "+(S.base?fmtClock(0):"&mdash;")+" (T+00:00)",S.base?readingCells(S.base):"not captured");
  h+='<h4>Readings logged during the run</h4>';
  h+=S.logs.length
     ? S.logs.map(l=>srow(l.clock+" \u00b7 "+fmtElapsed(l.t),readingCells(l))).join("")
     : srow("Logged readings","none recorded");
  h+='<h4>Your call</h4>';
  h+=srow("Component named",esc(comp)||"not recorded");
  h+=srow("Evidence chain",esc(evTxt)||"not recorded");
  h+='<h4>Fix ticket as drafted</h4>';
  h+=srow("Ticket",esc(ticket)||"not recorded");
  if(missing.length)
    h+='<div class="note" style="margin-top:12px"><b>Not yet filled in:</b> '+missing.join("; ")+
       ". This is a completeness check only \u2014 it says nothing about what you have written.</div>";
  h+='<div class="note" style="margin-top:12px">Check every field before printing. Hand this sheet to your instructor with your worksheet.</div>';
  h+='<div class="row noprint" style="margin-top:12px"><button id="btnPrintSheet">Print submission sheet</button></div>';
  h+='</div>';
  const r=$("chwResult");
  r.className="result show";
  r.innerHTML=h;
  $("btnPrintSheet").onclick=()=>window.print();
}

/* ---------- view ---------- */
function renderChw(){
  const v=V.id, d=S.last||chwSample(S.t,v);
  const el=$("chwView");
  if(!el.dataset.built){
    el.innerHTML=`
      <div class="grid g3" id="chwTiles" style="margin-bottom:14px"></div>
      <div class="grid g2" id="chwCharts"></div>
      <div class="planbox" style="margin-bottom:14px">
        <h3>Logged readings</h3>
        <div class="sub">Use <b>Log readings</b> in the toolbar to timestamp whatever is on the screen at that moment. Log as often as you think the record needs.</div>
        <div id="logTable"></div>
      </div>
      <div class="submit">
        <h3>Your call</h3>
        <div class="sub">Name the component you would send someone to, and the one measurement that rules the other candidate out.</div>
        <div class="fld" style="margin-bottom:12px"><label>Your name</label><input type="text" id="learnerName" placeholder="First and last" style="max-width:340px" value="${esc(S.learner)}"></div>
        <div class="fgrid">
          <div class="fld"><label>Component at fault</label>
            <select id="ansComp"></select></div>
          <div class="fld"><label>The measurement your call rests on</label>
            <select id="ansEvid"></select></div>
        </div>
        <div class="fld" style="margin-bottom:12px">
          <label>Fix ticket — draft it as you would hand it over</label>
          <textarea id="ansText" rows="5" placeholder="Branch / equipment:
What was observed (what moved, which direction, how fast):
Recommended action:
Access, isolation or permit needed:
Priority and why:"></textarea>

/* ---------- run loop ---------- */
function pushSeries(){
  const dd=chwSample(S.t,V.id);
    S.last=dd;
    (S.series.flow=S.series.flow||[]).push(dd.flow);
    (S.series.press=S.series.press||[]).push(dd.press);
    (S.series.diff=S.series.diff||[]).push(dd.diff);
    (S.series.supply=S.series.supply||[]).push(dd.supply);
    (S.series.ret=S.series.ret||[]).push(dd.ret);
}
function render(){
  $("clock").textContent=fmtClock(S.t);
  $("elapsed").textContent=fmtElapsed(S.t);
  renderChw();
}
function tick(){
  if(S.t>=LAB.duration){stopRun(true);return;}
  S.t=Math.min(LAB.duration,S.t+0.25);
  pushSeries(); render();
}
function startRun(){
  if(S.running)return;
  S.running=true;
  $("statusBadge").textContent="Running"; $("statusBadge").className="badge run";
  clearInterval(S.timer);
  S.timer=setInterval(tick,Math.max(60,1000*15/S.speed));
}
function stopRun(done){
  S.running=false; clearInterval(S.timer); S.timer=null;
  $("statusBadge").textContent=done?"Run complete":"Held";
  $("statusBadge").className="badge "+(done?"":"hold");
}
function resetRun(){
  stopRun(false);
  rnd=mulberry32(RUNKEY);
  S.t=0; S.series={}; S.last=null; S.base=null; S.logs=[];
  const vw=$("chwView"); vw.dataset.built=""; vw.innerHTML="";
  pushSeries(); S.base=S.last; updateLogCount(); render();
  $("statusBadge").textContent="Ready"; $("statusBadge").className="badge";
}

/* ---------- wiring ---------- */
$("btnStart").onclick=startRun;
$("btnPause").onclick=()=>stopRun(false);
$("btnStep").onclick=()=>{if(S.running)stopRun(false);for(let i=0;i<4;i++)tick();};
$("btnLog").onclick=logReading;
$("btnRestart").onclick=resetRun;
$("speed").onchange=()=>{S.speed=+$("speed").value;if(S.running){stopRun(false);startRun();}};
window.addEventListener("resize",render);
document.addEventListener("keydown",e=>{
  if(e.key===" "&&e.target.tagName!=="TEXTAREA"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="SELECT"){
    e.preventDefault(); S.running?stopRun(false):startRun();
  }
});

/* ---------- boot ---------- */
$("setTag").textContent="Set "+SETLETTER;
resetRun();

</script>

p": "Step 7. Bound the fault in space. Compare branch 3 against its neighbours on the same loop and against the plant-wide readings. Is this one unit, one branch, or the whole loop? Write the comparison down as a statement with numbers in it, not as an impression. If the neighbours are unaffected, you have bounded the fault to branch 3 and everything upstream of the branch is now much less likely."}, {"s": "Part 1: Diagnosing the loop", "k": "text", "p": "Step 8. Bound the fault in time. Classify the onset as sudden or gradual and say what that eliminates. Things that fail suddenly are things that move or switch: valves, actuators, contactors, a pump seizing. Things that fail gradually are things that accumulate: fouling, scaling, strainer loading, slow leaks, bearing wear. Ninety seconds is not fouling. Twenty-two minutes is not something that moved. Write the duration you measured in step 5 and the conclusion it forces."}, {"s": "Part 1: Diagnosing the loop", "k": "text", "p": "Step 9. Split the loop at a reading. Put pump discharge pressure alongside flow and apply the discriminator. If there is a downstream restriction — a blocked or closed valve — flow falls and pump discharge pressure RISES, because the pump rides up its curve against the restriction. If the pump itself is the problem — worn impeller, cavitation, failure — flow falls and pump discharge pressure FALLS, because the pump can no longer develop head. Flow alone cannot tell these apart, and flow is the reading everyone looks at first. Record which way your pressure moved."}, {"s": "Part 1: Diagnosing the loop", "k": "text", "p": "Step 10. Confirm with the differential across the suspect valve. Baseline is 6.0 psi. If pressure is being dropped at a specific restriction, the differential across that point rises sharply — that is the pressure appearing exactly where it is being lost. On a pump fault the differential across the valve is roughly unchanged. Record the differential before and after and state what it confirms."}, {"s": "Part 1: Diagnosing the loop", "k": "text", "p": "Step 11. Check pump motor current against the 26.0 A full load figure. On a downstream restriction the current often falls slightly, because the pump is moving less water. On a failing pump it falls, or becomes erratic if the pump is cavitating. This reading supports the conclusion; it does not carry it on its own. Note it and say which of the two patterns it matches."}, {"s": "Part 1: Diagnosing the loop", "k": "text", "p": "Step 12. Quantify the changes as percentages so the ticket carries magnitude rather than adjectives. Percentage change = (final minus baseline) divided by baseline, times 100. Worked example of the arithmetic: a flow reading moving from 40.0 to 22.0 gpm is (22.0 minus 40.0) divided by 40.0 times 100 = -45.0 per cent. Apply the same calculation to your own recorded values for pump discharge pressure and for the differential across V-3, and give the direction as well as the size. Then calculate the loop delta T at the end of the event and compare it with the 6.0 K baseline from step 3. Note whether it widened or narrowed and be ready to explain why."}, {"s": "Part 1: Diagnosing the loop", "k": "text", "p": "Step 13. Name one component. Not a system, not a subsystem — one component, with the identifier the BMS uses for it. Then write the evidence chain: each reading, what it shows, and what it rules out. If you cannot name the evidence, you are still guessing, and a component named without an evidence chain is a guess wearing a lab coat."}, {"s": "Part 1: Diagnosing the loop", "k": "text", "p": "Step 14. Draft the fix ticket on the template. It must contain: the precise symptom with times and values; the timeline of the event; the readings that matter, with units; the component you suspect; the reasoning, including what you ruled out and why; and the recommended action. The shape, from the instruction block: “CHW flow to branch 3 fell from [value] to [value] gpm between [time] and [time] while pump discharge pressure moved from [value] to [value] psi and the differential across the branch valve moved from [value] to [value] psi. Onset [sudden or gradual]. Indicates [the conclusion your readings force]. Recommend [the action that follows from it].”"}, {"s": "Part 1: Diagnosing the loop", "k": "image", "p": "Step 16. Hand the ticket to your instructor for review, then type your name into the submission panel, press Build submission sheet and print it for your evidence pack."}, {"s": "Part 2: Reflection", "k": "text", "p": "Write out your full evidence chain as a numbered list. Each link must be one reading, what it shows, and what it eliminates. Do not write the conclusion — write the chain that forces it. Anyone can guess correctly between two options, so the chain is what proves you reasoned. Include at least one link that rules something out."}, {"s": "Part 2: Reflection", "k": "text", "p": "Suppose pump discharge pressure had moved in the opposite direction to the one you recorded, with flow falling by the same amount. State what your conclusion would have been, which single line of your ticket would have changed, and what the differential across the valve would have been doing."}, {"s": "Part 2: Reflection", "k": "text", "p": "In GLAB 524.3.1 you learned that low delta T is a warning sign. If the loop delta T widened during the fault rather than narrowing, explain how both statements can be true, in terms of what happens to the water that is still flowing."}, {"s": "Part 2: Reflection", "k": "text", "p": "If the same three readings had moved in the same directions but over twenty-two minutes rather than ninety seconds, what would you have concluded and what would you have recommended instead? Name the physical difference between the two causes."}]};</script>

  /* ---------- cross-lab storage budget ----------
     Every lab in the module is served from one origin, so all 43 share a single
     ~5 MB localStorage budget. Seventeen image questions at ~325 KB apiece is 5.4 MB
     — a learner working through the whole module on one browser profile would run out
     near the end. Images belonging to OTHER labs are evicted when room is needed,

  function otherLabKeys(){
    var out=[];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf("uci2227:")===0&&k!==KEY) out.push(k);
      }

    return out;

    }catch(e){}
    return n;

  function evictOtherImages(target){
    /* returns bytes freed. Prefers labs whose PDF has already been built, then oldest. */

    try{
      localStorage.setItem(KEY,payload);
      if(storageBroken){ storageBroken=false; showStoreErr(null); }
      return true;
    }catch(e){
      /* make room from other labs, then try once more */
      if(evictOtherImages(payload.length+200000)>0){
        try{
          localStorage.setItem(KEY,payload);
          if(storageBroken){ storageBroken=false; showStoreErr(null); }
          return true;
        }catch(e2){}
      }
      storageBroken=true;
      showStoreErr(e);
      return false;
    }
  }
  function showStoreErr(e){
    var b=document.getElementById("lqStoreErr");
    if(!b) return;
    if(!e){ b.style.display="none"; return; }
    b.style.display="block";
    b.innerHTML='<b>Your work is no longer being saved in this browser.</b><br>'
      +'Storage is full or switched off — usually private browsing, or a great many images '
      +'attached across the labs on this machine. Everything on screen is intact and the '
      +'submission PDF will still build correctly — but <b>do not refresh or close this tab</b>. '
      +'Press <b>Build submission PDF</b> now and save the file. '
      +'Then press <b>Clear my responses</b> to free the space up for the next lab.';
    if(b.scrollIntoView) b.scrollIntoView({block:"nearest"});
  }

  function announce(msg){
    var s=document.getElementById("lqStatus");
    if(s){ s.textContent=""; setTimeout(function(){ s.textContent=msg; },30); }
  }

  /* ---------- detect the set letter the tool is running ---------- */
  function setLetter(){
    try{ if(typeof SETLETTER!=="undefined"&&SETLETTER) return SETLETTER; }catch(e){}
    var tag=document.getElementById("setTag");
    if(tag&&tag.textContent){
      var m=tag.textContent.match(/set\s+([A-H])/i); if(m) return m[1].toUpperCase();
    }
    var m2=(LQ.file||"").match(/524-\d-\d-([A-H])_/); if(m2) return m2[1];
    return LQ.set||"—";
  }

  /* ---------- downscale an image before it goes anywhere near storage ----------
     A phone photo is 2-5 MB and base64 inflates it by a third; localStorage is
     about 5 MB for the whole origin. Downscaling to 1600px JPEG brings a typical
     capture under 400 KB, which is still far more detail than the PDF can show. */
  var MAXPX=1600, JPEGQ=0.82;
  function downscale(file,cb){
    var rd=new FileReader();
    rd.onerror=function(){ cb(null,"The browser could not read that file."); };
    rd.onload=function(){
      var img=new Image();
      img.onerror=function(){ cb(null,"That file does not look like an image the browser can open."); };
      img.onload=function(){
        try{
          var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
          if(!w||!h){ cb(rd.result,null); return; }
          var sc=Math.min(1,MAXPX/Math.max(w,h));
          if(sc>=1&&rd.result.length<600000){ cb(rd.result,null); return; }
          var cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
          var c=document.createElement("canvas"); c.width=cw; c.height=ch;
          var x=c.getContext("2d");
          x.fillStyle="#fff"; x.fillRect(0,0,cw,ch);
          x.drawImage(img,0,0,cw,ch);
          cb(c.toDataURL("image/jpeg",JPEGQ),null);
        }catch(err){ cb(rd.result,null); }
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  }

  /* ---------- build the card ---------- */
  var host=document.querySelector("main .wrap")||document.querySelector("main")||document.body;
  var card=document.createElement("section");
  card.id="lqCard";
  card.setAttribute("aria-labelledby","lqCardTitle");

  var qs=LQ.items, secs=[], cur=null;
  qs.forEach(function(it,i){
    if(!cur||cur.name!==it.s){ cur={name:it.s,list:[]}; secs.push(cur); }
    cur.list.push({i:i,it:it});
  });

  var html=""
   +'<h2 id="lqCardTitle">Lab submission — questions and responses</h2>'
   +'<p class="lqsub">Every question from the <b>'+esc(LQ.handout)+'</b> handout is answered here, not on paper. '
   +'Your responses, together with the record this simulator builds, print to a <b>single PDF</b> that you upload to Canvas. '
   +'Your work is kept in this browser as you type, so a refresh will not lose it.</p>'
   +'<div id="lqStoreErr" role="alert"></div>'
   +'<p id="lqStatus" class="lqvh" role="status" aria-live="polite"></p>'
   +'<div class="lqid">'
   +'<div class="lqfld" style="flex:1 1 260px"><label for="lqName">Your name</label>'
     +'<input type="text" id="lqName" autocomplete="name" placeholder="First and last" value="'+esc(store.name||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 180px"><label for="lqCohort">Cohort / section</label>'
     +'<input type="text" id="lqCohort" placeholder="e.g. UCI 2227-01" value="'+esc(store.cohort||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 150px"><label for="lqDate">Date</label>'
     +'<input type="text" id="lqDate" value="'+esc(store.date||new Date().toLocaleDateString())+'"></div>'
   +'</div>';

  secs.forEach(function(sec,si){
    html+='<h3 class="lqsec" id="lqSec'+si+'">'+esc(sec.name||"Questions")+'</h3>';
    sec.list.forEach(function(o){
      var id="lqQ"+o.i, n=o.i+1;
      html+='<div class="lqq">';
      if(o.it.k==="image"){
        html+='<p class="lqp"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</p>'
             +'<div class="lqimgwrap">'
             +'<label class="lqfilelbl" for="'+id+'_f">Attach your image for question '+n+'</label>'
             +'<input type="file" accept="image/*" id="'+id+'_f">'
             +'<p class="lqnote" style="margin:5px 0 0">A photo or screenshot. It is resized and '
             +'embedded in the PDF you hand in.</p>'
             +'<img id="'+id+'_img" alt="Your attached image for question '+n+'" style="display:none">'
             +'<label class="lqfilelbl" for="'+id+'" style="margin-top:8px">Caption or note for question '+n+'</label>'
             +'<textarea id="'+id+'" rows="2" placeholder="Add any caption or note that goes with the image.">'
             +esc(store[id]||"")+'</textarea></div>';
      }else{
        html+='<label class="lqp" for="'+id+'"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</label>'
             +'<textarea id="'+id+'" rows="3" placeholder="Type your answer here.">'+esc(store[id]||"")+'</textarea>';
      }
      html+='</div>';
    });
  });

  html+='<div class="lqbtns">'
    +'<button type="button" class="lqprimary" id="lqBuild">Build submission PDF</button>'
    +'<button type="button" id="lqPreview">Preview without printing</button>'
    +'<button type="button" id="lqClear">Clear my responses</button>'
    +'<span class="lqnote">The PDF carries every question, your responses and the simulator record. One file, one upload.</span>'
    +'</div><div id="lqOut" role="region" aria-label="Submission sheet preview"></div>';

  card.innerHTML=html;
  host.appendChild(card);

  /* ---------- wiring ---------- */
  ["lqName","lqCohort","lqDate"].forEach(function(id){
    var el=document.getElementById(id);
    el.oninput=function(){ store[id.replace("lq","").toLowerCase()]=el.value; save(); };
  });
  qs.forEach(function(it,i){
    var id="lqQ"+i, ta=document.getElementById(id);
    if(ta) ta.oninput=function(){ store[id]=ta.value; save(); };
    var f=document.getElementById(id+"_f");
    if(f) f.onchange=function(){
      var file=f.files&&f.files[0]; if(!file) return;
      announce("Processing your image for question "+(i+1)+".");
      downscale(file,function(dataUrl,err){
        if(err){ announce(err); alert(err); return; }
        var img=document.getElementById(id+"_img");
        img.src=dataUrl; img.style.display="block";
        store[id+"_img"]=dataUrl;
        var okSave=save();
        announce("Image attached to question "+(i+1)+
          (okSave?"." : ", but it could not be saved in this browser. Build your PDF now."));
      });
    };
    if(store[id+"_img"]){
      var im0=document.getElementById(id+"_img");
      if(im0){ im0.src=store[id+"_img"]; im0.style.display="block"; }
    }
  });

  /* an image of this lab was evicted to make room for another lab on the shared
     origin, and this lab had not yet been exported — say so plainly */
  if(store._evicted&&!store._done){
    var eb=document.getElementById("lqStoreErr");
    eb.style.display="block";
    eb.innerHTML='<b>An image you attached is no longer stored.</b><br>'
      +'This browser ran out of room across all the labs on this machine and dropped it. '
      +'Your typed answers are all still here — only the image went. '
      +'Attach it again before you build your submission PDF.';
    delete store._evicted; save();
  }

  document.getElementById("lqClear").onclick=function(){
    if(!confirm("Clear every response you have typed in this lab? This cannot be undone.")) return;
    store={}; save();
    qs.forEach(function(it,i){
      var ta=document.getElementById("lqQ"+i); if(ta) ta.value="";
      var im=document.getElementById("lqQ"+i+"_img"); if(im){ im.removeAttribute("src"); im.style.display="none"; }
      var fi=document.getElementById("lqQ"+i+"_f"); if(fi) fi.value="";
    });
    document.getElementById("lqOut").innerHTML="";
    announce("All responses cleared.");
  };

  /* ---------- guard the simulator's Restart button ----------
     Restart wipes the simulator record but not the responses typed here, which
     would leave a submission whose prose describes a record that no longer exists.
     A capture-phase listener runs ahead of the tool's own onclick, so one confirm
     covers every variant of the handler. */
  (function(){
    var rb=document.getElementById("btnRestart")||document.getElementById("btnReset");
    if(!rb||card.contains(rb)) return;
    rb.addEventListener("click",function(ev){
      if(rb.dataset.lqOk==="1"){ rb.dataset.lqOk=""; return; }
      ev.preventDefault(); ev.stopImmediatePropagation();
      var ok=confirm(
        "Restart the scenario?\n\n"+
        "Everything you recorded in the simulator — readings, marks, logs, the "+
        "submission sheet it built — is wiped and the run starts again.\n\n"+
        "The answers you typed in the submission panel lower down are KEPT. If they "+
        "describe readings you are about to erase, build your submission PDF first.");
      if(ok){ rb.dataset.lqOk="1"; rb.click(); }
    },true);
  })();

  /* ---------- harvest the simulator's own record ---------- */
  var REC_SEL=".sheet, .result.show";
  function collect(){
    var raw=[];
    Array.prototype.forEach.call(document.querySelectorAll(REC_SEL),function(s){
      if(card.contains(s)) return;
      if(!s.textContent.replace(/\s/g,"")) return;
      raw.push(s);
    });
    return raw.filter(function(s){
      return !raw.some(function(o){ return o!==s && o.contains(s); });
    });
  }

  /* the module already prints the learner name in its own Learner block, and every
     simulator sheet prints it again — four of them twice. Strip it from the clone. */
  var NAMEKEY=/^(your\s+)?(name|learner(\s+name)?)\s*:?\s*$/i;
  function stripDuplicateName(root){
    Array.prototype.forEach.call(root.querySelectorAll(".learnerline"),function(n){
      if(n.parentNode) n.parentNode.removeChild(n);
    });
    var rows=root.querySelectorAll("div,tr,p");
    Array.prototype.forEach.call(rows,function(r){
      var first=r.firstElementChild;
      if(!first||r.children.length>3) return;
      if(NAMEKEY.test((first.textContent||"").trim())){
        if(r.parentNode) r.parentNode.removeChild(r);
      }
    });
  }

  function toolRecord(){
    var found=collect();
    if(!found.length){
      var btns=document.querySelectorAll("button");
      var hit=null;
      Array.prototype.forEach.call(btns,function(b){
        if(card.contains(b)||hit) return;
        var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
        if(/print/.test(t)) return;
        if(/^build submission sheet$/.test(t)) hit=b;
      });
      if(!hit){
        Array.prototype.forEach.call(btns,function(b){
          if(card.contains(b)||hit) return;
          var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
          if(/print/.test(t)) return;
          if(/build .*sheet|submission sheet|submit .*(map|answer|sheet|round|log)|^submit$/.test(t)) hit=b;
        });
      }
      if(hit){ try{ hit.click(); }catch(e){} }
      found=collect();
    }
    if(!found.length) return null;
    var wrap=document.createElement("div");
    found.forEach(function(s){
      var c=s.cloneNode(true);
      Array.prototype.forEach.call(c.querySelectorAll(".noprint, button"),function(n){
        if(n.parentNode) n.parentNode.removeChild(n);
      });
      stripDuplicateName(c);
      wrap.appendChild(c);
    });
    return wrap.innerHTML;
  }

  /* ---------- assemble the one sheet ---------- */
  function build(){
    var name=document.getElementById("lqName").value.trim();
    var coh=document.getElementById("lqCohort").value.trim();
    var dt=document.getElementById("lqDate").value.trim();
    var gaps=[];
    if(!name) gaps.push("Your name");
    if(!coh)  gaps.push("Cohort / section");

    var h=''
     +'<div class="lqsheet">'
     +'<h1>'+esc(LQ.lab)+' — '+esc(LQ.title)+'</h1>'
     +'<div class="lqmeta">UCI 2227 · Module 524 · '+esc(LQ.handout)
       +' · Set '+esc(setLetter())+' · submission sheet</div>'
     +'<h2>Learner</h2>'
     +'<div class="lqrow"><span class="k">Name</span><span class="v">'+(esc(name)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Cohort / section</span><span class="v">'+(esc(coh)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Date</span><span class="v">'+(esc(dt)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Scenario set</span><span class="v">'+esc(setLetter())+'</span></div>'
     +'<div class="lqrow"><span class="k">Built</span><span class="v">'
       +esc(new Date().toLocaleString())+'</span></div>';

    var rec=LQ.nosim?null:toolRecord();
    if(rec){ h+='<h2>Simulator record</h2>'+rec; }
    else if(!LQ.nosim){
      gaps.push("The simulator record — work through the lab tool above and press its own "
               +"“Build submission sheet” button before you build this PDF");
    }else{
      h+='<h2>Assessed on the floor</h2>'
        +'<div class="lqrow"><span class="k">Practical steps</span><span class="v">'
        +'Observed and signed off by the instructor against the handout. '
        +'The instructor signature below records that sign-off.</span></div>';
    }

    var curSec=null;
    qs.forEach(function(it,i){
      if(it.s!==curSec){ curSec=it.s; h+='<h2>'+esc(curSec||"Questions")+'</h2>'; }
      var ta=document.getElementById("lqQ"+i);
      var a=ta?ta.value.trim():"";
      var im=store["lqQ"+i+"_img"];
      if(!a&&!im) gaps.push("Q"+(i+1));
      h+='<div class="lqa"><div class="q"><span class="qn">Q'+(i+1)+'.</span>'+esc(it.p)+'</div>';
      if(im) h+='<img src="'+im+'" alt="Attachment for question '+(i+1)+'">';
      h+='<div class="a'+((!a&&!im)?" blank":"")+'">'+(a?esc(a):"— not answered —")+'</div></div>';
    });

    if(gaps.length){
      h+='<div class="lqgap"><b>Not yet filled in ('+gaps.length+'):</b> '+esc(gaps.join(", "))
        +'.<br>This is a completeness check, not a grade. Fill them in and build again, '
        +'or hand the sheet in as it stands and explain the gaps to your instructor.</div>';
    }else{
      h+='<div class="lqgap ok">'
        +'<b>Complete.</b> Every question on this sheet carries a response and the simulator record is attached.</div>';
    }

    h+='<div class="lqsign">Learner signature: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'Instructor verification: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'<span style="font-size:11px">Save this as a PDF and upload the single file to the '
      +esc(LQ.lab)+' assignment in Canvas.</span></div></div>';

    document.getElementById("lqOut").innerHTML=h;
    announce(gaps.length
      ? ("Submission sheet built. "+gaps.length+" item"+(gaps.length===1?"":"s")+" still blank: "+gaps.join(", ")+".")
      : "Submission sheet built. Every question carries a response.");
    return h;
  }

  document.getElementById("lqPreview").onclick=function(){
    build();
    var o=document.getElementById("lqOut");
    if(o&&o.scrollIntoView) o.scrollIntoView({behavior:"smooth",block:"start"});
  };

  /* ---------- the one PDF ---------- */
  function safeName(s){
    return String(s||"").normalize?String(s||"").normalize("NFKD").replace(/[^\w\s-]/g,"").trim()
      :String(s||"").replace(/[^\w\s-]/g,"").trim();
  }
  function fileTitle(){
    var n=safeName(document.getElementById("lqName").value).split(/\s+/).filter(Boolean);
    var last=n.length>1?n[n.length-1]:(n[0]||"Learner");
    var first=n.length>1?n.slice(0,-1).join("_"):"";
    var who=first?(last+"_"+first):last;
    return who+"_"+String(LQ.lab||"").replace(/[^\d.]/g,"");
  }

  document.getElementById("lqBuild").onclick=function(){
    var h=build();
    /* this lab's images are now inside a PDF the learner holds, so they become the
       first thing evicted when another lab needs room on the shared origin */
    store._done=true; save();

    var old=document.getElementById("lqPrint"); if(old) old.parentNode.removeChild(old);

    /* The sheet goes inside a one-cell table whose thead repeats on every printed
       page, so pages 2+ still carry the learner name, the lab and the set. */
    var runHead='<span class="r">'+esc(LQ.lab)+' · Set '+esc(setLetter())+'</span>'
      +esc(document.getElementById("lqName").value.trim()||"Name not entered")
      +' · '+esc(LQ.title);
    var pr=document.createElement("div"); pr.id="lqPrint";
    pr.innerHTML='<table class="lqpage"><thead class="lqrhead"><tr><td class="lqrh">'
      +runHead+'</td></tr></thead><tbody><tr><td class="lqbody">'+h+'</td></tr></tbody></table>';
    document.body.appendChild(pr);

    /* the browser suggests document.title as the Save-as-PDF filename */
    var prevTitle=document.title;
    document.title=fileTitle();
    document.body.classList.add("lq-print");

    var restored=false;
    var done=function(){
      if(restored) return; restored=true;
      document.body.classList.remove("lq-print");
      document.title=prevTitle;
      var a=document.getElementById("lqPrint"); if(a&&a.parentNode) a.parentNode.removeChild(a);
      window.removeEventListener("afterprint",done);
      if(mq&&mq.removeListener) mq.removeListener(mqHandler);
    };
    var mq=window.matchMedia?window.matchMedia("print"):null;
    var mqHandler=function(m){ if(!m.matches) done(); };
    if(mq&&mq.addListener) mq.addListener(mqHandler);
    window.addEventListener("afterprint",done);

    setTimeout(function(){
      window.print();
      /* generous fallback: mobile print sheets are asynchronous, and tearing the
         container out too early yields a blank PDF */
      setTimeout(done,60000);
    },80);
  };
})();
</script>
<!-- ===== end submission module ============================================= -->

</body>
