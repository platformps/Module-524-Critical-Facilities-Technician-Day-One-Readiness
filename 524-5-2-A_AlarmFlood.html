<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLAB 524.5.2 — Twenty Alarms at Once — UCI 2227 (Training Simulator)</title>
<style>
  :root{
    --bg:#0b1620; --panel:#132433; --panel2:#0f1d29; --line:#4a7291;
    --ink:#dfeaf3; --dim:#8ba6bd; --faint:#7e9bb2;
    --blue:#33a6e8; --navy:#0079C0; --ice:#CFEBFC;
    --ok:#37c07a; --warn:#e8a33d; --stop:#e8604c;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
  button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:5px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:7px 13px}
  button:hover{background:#1b3044;border-color:#2d4d68}
  button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  button.primary:hover{background:#0a8bd8}
  button:disabled{opacity:.4;cursor:not-allowed}
  select,input[type=text],input[type=number],textarea{
    font-family:inherit;font-size:13px;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:5px;padding:7px 9px}
  textarea{width:100%;resize:vertical;font-size:13px;line-height:1.45}
  h1,h2,h3{margin:0;font-weight:700}
  .mono{font-family:var(--mono)}

  /* ---------- shell ---------- */
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{font-weight:700;letter-spacing:.4px;font-size:14px}
  .brand span{color:var(--blue)}
  .sysname{color:var(--dim);font-size:12px;border-left:1px solid var(--line);padding-left:16px}
  .spacer{flex:1}
  .clock{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:1px}
  .clocklbl{color:var(--faint);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;text-align:right}
  .badge{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700;
    padding:4px 10px;border-radius:20px;background:#16324a;color:var(--blue);border:1px solid #23485f}
  .badge.run{background:#123a2a;color:var(--ok);border-color:#1d5b41}
  .badge.hold{background:#3d3220;color:var(--warn);border-color:#5c4c2e}

  main{flex:1;overflow:auto;padding:18px}
  .wrap{max-width:1500px;margin:0 auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin-bottom:14px}
  .card h3{font-size:15px;margin-bottom:4px}
  .card p{color:var(--dim);margin:0 0 14px;line-height:1.5;font-size:13px}
  .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);font-weight:700}
  .hint{font-size:12px;color:var(--faint);line-height:1.5;margin-top:10px}
  .bul{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--dim)}
  .bul li{margin-bottom:3px}

  /* ---------- console ---------- */
  .toolbar{display:flex;gap:9px;align-items:center;padding:9px 18px;background:var(--panel2);
    border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  .toolbar button.on{background:#16324a;border-color:var(--blue);color:var(--ice)}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px}

  /* ---------- alarms ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);
    font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--blue)}
  td{padding:8px 10px;border-bottom:1px solid #182b3b;vertical-align:top}
  tr.ack{opacity:.42}
  .sev{font-size:10px;letter-spacing:.8px;font-weight:700;padding:3px 8px;border-radius:3px;white-space:nowrap}
  .sev.critical{background:#4a1f1a;color:#ff8f7d}
  .sev.high{background:#4a3418;color:#ffc069}
  .sev.medium{background:#1c3a4f;color:#7fc4ea}
  .sev.low{background:#22303a;color:#8ba6bd}
  .tick{display:inline-block;width:15px;height:15px;border:1px solid var(--line);border-radius:3px;
    background:var(--panel2);cursor:pointer;vertical-align:-3px}
  .tick.on{background:var(--blue);border-color:var(--blue)}
  .flt{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .flt .chip{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);
    background:var(--panel2);color:var(--dim);cursor:pointer}
  .flt .chip.on{background:#16324a;border-color:var(--blue);color:var(--ice)}
  .counter{font-family:var(--mono);font-size:12px;color:var(--faint)}
  .note{font-size:12px;color:var(--dim);line-height:1.55}
  .hidden{display:none !important}
  .tick:focus-visible,.chip:focus-visible,th[data-k]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .tick.second{background:var(--warn);border-color:var(--warn)}
  .kf td{font-size:12.5px;line-height:1.5}
  .kf .ref{font-family:var(--mono);white-space:nowrap;color:var(--blue)}
  .empty td{color:var(--faint);font-size:13px;padding:22px 10px;text-align:center}

  /* ---------- packet (paper inside the console) ---------- */
  .packet{background:#fff;color:#12232e;border-radius:6px;padding:26px 30px;max-width:1180px;margin:0 auto 14px;
    font-size:13px;line-height:1.5;border:1px solid #c3ced7}
  .packet h1{font-size:21px;color:#1a3a5c;margin:0 0 4px}
  .packet h2{font-size:15px;color:#1a3a5c;margin:22px 0 8px;border-bottom:1px solid #c3ced7;padding-bottom:4px}
  .packet .eyebrow{font:600 10px/1 Arial;letter-spacing:.10em;text-transform:uppercase;color:#0b6ea8;margin:0 0 8px}
  .packet .lede{color:#5a6b78;margin:0 0 14px;max-width:86ch}
  .packet table{border-collapse:collapse;width:100%;margin:8px 0 4px;font-size:12.5px}
  .packet th,.packet td{border:1px solid #c3ced7;padding:6px 8px;text-align:left;vertical-align:top;color:#12232e}
  .packet th{background:#1a3a5c;color:#fff;font-size:11px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;cursor:default}
  .packet th:hover{color:#fff}
  .packet .cover td:first-child{width:190px;background:#f2f6f9;font-weight:600}
  .packet .note{background:#f2f6f9;border-left:3px solid #0b6ea8;padding:10px 14px;margin:14px 0;color:#12232e}
  .packet .note.bad{border-left-color:#c8501e}
  .packet .foot{color:#5a6b78;font-size:11px;margin-top:18px;border-top:1px solid #c3ced7;padding-top:8px}
  .packet label{display:block;font:600 11px Arial;letter-spacing:.04em;text-transform:uppercase;color:#1a3a5c;margin:10px 0 4px}
  .packet input[type=text],.packet textarea,.packet select{width:100%;background:#fff;color:#12232e;border:1px solid #9fb0bf;border-radius:3px;font-size:13px}
  .packet .wsrow{display:grid;grid-template-columns:2.2fr 1fr 2.6fr;gap:10px;align-items:start;margin-bottom:6px}
  .packet .wsrow .q{font-size:13px;color:#12232e;padding-top:26px}
  .pkbar{display:flex;gap:12px;align-items:center;max-width:1180px;margin:0 auto 12px;color:var(--dim);font-size:12px}
  body.pk-print{overflow:visible;background:#fff}
  body.pk-print > *:not(#pkPrint){display:none !important}
  #pkPrint .packet{border:0;max-width:none;padding:0;margin:0}
  #pkPrint .pkval{display:inline-block;min-height:1.3em;border-bottom:1px solid #9fb0bf;padding:1px 4px;white-space:pre-wrap}

  /* ---------- submission ---------- */
  .submit{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-top:14px}
  .submit h3{font-size:14px;margin-bottom:3px}
  .submit .sub{font-size:12px;color:var(--faint);margin-bottom:13px}
  .fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
  .result{margin-top:12px;padding:13px;border-radius:7px;font-size:13px;line-height:1.55;display:none;
    background:var(--panel2);border:1px solid var(--line)}
  .result.show{display:block}
  .sheet h3{font-size:15px;margin-bottom:2px}
  .sheet .shsub{font-size:12px;color:var(--faint);margin-bottom:12px}
  .sheet h4{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue);
    font-weight:700;margin:16px 0 7px}
  .srow{display:flex;justify-content:space-between;gap:16px;padding:5px 0;border-bottom:1px solid #182b3b;font-size:12.5px}
  .srow span:first-child{color:var(--faint);flex:0 0 220px}
  .srow span:last-child{flex:1;text-align:right;white-space:pre-wrap}
  .sheet table td{font-size:12.5px}
  .missing{margin-top:14px;padding:11px 13px;border-radius:7px;background:#2b2310;border:1px solid #5c4c2e;
    font-size:12.5px;line-height:1.55}
  .closing{margin-top:14px;padding-top:11px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim)}
  @media print{
    body{background:#fff;color:#000;overflow:visible}
    header,.toolbar,.noprint{display:none !important}
    main{overflow:visible}
    .result{background:#fff;border:1px solid #999}
    .sheet h4{color:#000}
    .srow span:first-child{color:#444}
    .missing{background:#fff;border:1px solid #999}
  }

  .labtag{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;
    color:var(--blue);margin-bottom:8px}
  .lede{color:var(--dim);line-height:1.6;margin:0 0 26px;max-width:820px}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">FACILITY ALARM CONSOLE</div>
    <div class="sysname">GLAB 524.5.2 &middot; UCI 2227 · objective M5.2 · Set A · TRAINING SIMULATOR — not connected to any live plant</div>
    <div class="spacer"></div>
    <div id="statusBadge" class="badge">Ready</div>
    <div>
      <div class="clocklbl">Site time</div>
      <div class="clock mono" id="clock">--:--:--</div>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <button id="btnStart" class="primary">Start run</button>
    <button id="btnPause">Pause</button>
    <button id="btnStep">Step +1 min</button>
    <span style="width:10px"></span>
    <div class="fld"><label>Speed</label>
      <select id="speed">
        <option value="1">Real time (1x)</option>
        <option value="4">4x</option>
        <option value="12" selected>12x</option>
        <option value="30">30x</option>
        <option value="60">60x</option>
      </select>
    </div>
    <span class="spacer"></span>
    <span class="counter" id="elapsed">T+00:00</span>
    <button id="btnPacket" aria-pressed="false" title="Shift-start packet: the known-fault log and the four-question triage worksheet. Printable.">Packet</button>
    <button id="btnRestart">Restart</button>
  </div>

  <main>
    <div class="wrap">
      <section id="almView"></section>
      <section id="packetPane" class="hidden noprint" aria-label="Shift-start packet"></section>
    </div>
  </main>
</div>

<script>
"use strict";
const SET = 0;   /* fixed for this file */
/* ============================================================
   UCI 2227 — GLAB 524.5.2 · Twenty Alarms at Once
   Standalone training console. Offline, no libraries, no network.
   ============================================================ */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry32(1);
function fmtClock(mins){
  const base=3*60+14; // the console picks up at 03:14 site time
  const total=base+mins;
  const h=Math.floor(total/60)%24, m=Math.floor(total%60), s=Math.floor((mins%1)*60);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtElapsed(mins){
  return "T+"+String(Math.floor(mins)).padStart(2,"0")+":"+String(Math.floor((mins%1)*60)).padStart(2,"0");
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ---------- this lab ---------- */
const LAB={lab:"GLAB 524.5.2",obj:"M5.2",title:"Twenty Alarms at Once",duration:6};

const CONFIGS=[{id:"C1"},{id:"C2"}];

/* Known-fault log at shift start — what the desk already knows before the flood.
   Per set. Nothing here explains the originating event or the second genuine event;
   several entries explain alarms that are noise. Read before Start run. */
const KNOWN={
  C1:[
    {ref:"WO-8811",raised:"Tue 22:40",pt:"BMS-P4 controller — Hall B east plant network",
     what:"Controller drops comms for 30 to 90 s and re-establishes on its own. Three retry/restore pairs a night since the network switch firmware change.",
     status:"Controls vendor attending Thursday 09:00. Engineering aware.",
     act:"Acknowledge the retry and the matching restore. Escalate only if the restore does not follow within five minutes."},
    {ref:"PM-0450",raised:"Scheduled",pt:"UPS-B — weekly battery self-test",
     what:"Runs Wednesday night 03:15 to 03:35. The console posts a reminder before the test and a result after it.",
     status:"Planned maintenance. Electrical supervisor owns it.",
     act:"Acknowledge the reminder. Escalate a FAILED result only."},
    {ref:"WO-8790",raised:"Sun 14:10",pt:"Door 3 — loading dock",
     what:"Door closer weak. Door-held-open alarm every time the 03:00 security patrol passes through; clears within a minute.",
     status:"Awaiting parts (closer on order). Facilities.",
     act:"Acknowledge if it clears within a minute. Escalate a held-open that does not clear."},
    {ref:"SCH-07",raised:"Standing",pt:"Sched — nightly trend report",
     what:"Generated at about 03:16 every night and posted to the console as a low alarm because of a rule error.",
     status:"Controls to re-class in the next release.",
     act:"Acknowledge. It carries no plant information."},
    {ref:"WO-8802",raised:"Mon 09:30",pt:"RH-A3 humidity sensor — Hall A",
     what:"Reads about 4% RH high against the reference instrument. Awaiting calibration kit.",
     status:"Awaiting parts. Mechanical.",
     act:"Read Hall A humidity with the offset in mind. Hall B sensors are not on this list."},
    {ref:"Round note",raised:"23:58",pt:"CT-2 cooling tower basin make-up valve",
     what:"Cycled three times during the night round. Basin level 318 mm and steady while watched.",
     status:"Engineering informed, watching. Not alarmed on this console.",
     act:"Log the level if you pass it. Nothing to acknowledge here."}
  ],
  C2:[
    {ref:"WO-8815",raised:"Mon 21:05",pt:"BMS-P2 controller — plant room network",
     what:"Controller drops comms for 30 to 90 s and re-establishes on its own. Two or three retry/restore pairs a night since the network switch firmware change.",
     status:"Controls vendor attending Thursday 09:00. Engineering aware.",
     act:"Acknowledge the retry and the matching restore. Escalate only if the restore does not follow within five minutes."},
    {ref:"WO-8790",raised:"Sun 14:10",pt:"Door 1 — main entrance lobby",
     what:"Door closer weak. Door-held-open alarm every time the 03:00 security patrol passes through; clears within a minute.",
     status:"Awaiting parts (closer on order). Facilities.",
     act:"Acknowledge if it clears within a minute. Escalate a held-open that does not clear."},
    {ref:"SCH-07",raised:"Standing",pt:"Sched — nightly trend report",
     what:"Generated at about 03:15 every night and posted to the console as a low alarm because of a rule error.",
     status:"Controls to re-class in the next release.",
     act:"Acknowledge. It carries no plant information."},
    {ref:"CR-0219",raised:"Fri 16:20",pt:"GEN-1 controller — running-hours counter",
     what:"Since the controller firmware update the hours-counter increment is posted to the console as a low alarm whenever the set runs. Informational only.",
     status:"Change request open to re-class. Controls.",
     act:"Acknowledge. It says nothing about the run itself — read the run alarms, not the counter."},
    {ref:"WO-8806",raised:"Sat 10:15",pt:"CRAH-06 filter differential pressure switch",
     what:"Switch sticks and posts FILTER DIRTY with clean filters. Replacement switch on order.",
     status:"Awaiting parts. Mechanical.",
     act:"Acknowledge FILTER DIRTY from CRAH-06 only. Every other CRAH alarm is live."}
  ]
};

const S={cfg:SET,learner:"",t:0,running:false,timer:null,speed:12,
  alarms:[],sortKey:"time",sortDir:1,sortArmed:false,filters:new Set(),acked:new Set(),marks:{},
  ansParent:"",ansSecond:"",ansText:"",packet:{}};
const $=id=>document.getElementById(id);
let V=CONFIGS[SET];

/* ---------- model ---------- */
function buildAlarms(v){
  if(v==="C1") return [
    {t:"03:14:02",sys:"Mechanical",pt:"CH-2",msg:"Compressor fault — unit offline",sev:"critical"},
    {t:"03:14:09",sys:"Mechanical",pt:"P-2B",msg:"CHW pump low flow",sev:"high"},
    {t:"03:14:11",sys:"Mechanical",pt:"CHW-S",msg:"Chilled water supply temperature rising",sev:"high"},
    {t:"03:14:26",sys:"Mechanical",pt:"CH-2",msg:"Condenser water pump P-4 stopped",sev:"medium"},
    {t:"03:14:40",sys:"Mechanical",pt:"CRAH-11",msg:"Discharge air temperature high",sev:"medium"},
    {t:"03:14:41",sys:"Mechanical",pt:"CRAH-12",msg:"Discharge air temperature high",sev:"medium"},

    {t:"03:16:00",sys:"Network",pt:"BMS-P4",msg:"Controller comms restored",sev:"low"},
    {t:"03:16:14",sys:"Environment",pt:"Rack 24",msg:"Inlet temperature above threshold",sev:"medium"},
    {t:"03:16:22",sys:"Mechanical",pt:"CRAH-13",msg:"Discharge air temperature high",sev:"medium"},
    {t:"03:16:35",sys:"Admin",pt:"Sched",msg:"Nightly trend report generated",sev:"low"},
    {t:"03:16:41",sys:"Mechanical",pt:"CHW-R",msg:"Return water temperature high",sev:"medium"},

    {t:"03:14:02",sys:"Electrical",pt:"Utility A",msg:"Loss of supply — feed A",sev:"critical"},
    {t:"03:14:03",sys:"Electrical",pt:"UPS-A",msg:"On battery — input failure",sev:"high"},

    {t:"03:14:13",sys:"Electrical",pt:"GEN-1",msg:"Running — voltage and frequency stabilizing",sev:"medium"},
    {t:"03:14:15",sys:"Electrical",pt:"ATS-1",msg:"Transfer to emergency source",sev:"high"},
    {t:"03:14:17",sys:"Electrical",pt:"UPS-A",msg:"Input restored — recharging",sev:"medium"},
    {t:"03:14:24",sys:"Electrical",pt:"SB-1",msg:"Bus energized from emergency source",sev:"medium"},
    {t:"03:14:38",sys:"Network",pt:"BMS-P2",msg:"Controller comms retry",sev:"low"},
    {t:"03:14:51",sys:"Mechanical",pt:"CRAH-04",msg:"Restart after supply interruption",sev:"low"},
    {t:"03:15:02",sys:"Mechanical",pt:"CRAH-05",msg:"Restart after supply interruption",sev:"low"},
    {t:"03:15:16",sys:"Electrical",pt:"GEN-1",msg:"Fuel day tank level normal",sev:"low"},
    {t:"03:15:29",sys:"Environment",pt:"Hall A",msg:"Cold aisle temperature transient — recovering",sev:"medium"},
    {t:"03:15:44",sys:"Admin",pt:"Sched",msg:"Nightly trend report generated",sev:"low"},
    {t:"03:16:12",sys:"Fire",pt:"FP-1",msg:"SUPERVISORY — sprinkler valve tamper, riser 2",sev:"critical"},
    {t:"03:16:20",sys:"Electrical",pt:"UPS-A",msg:"Battery charge 62%",sev:"low"},
    {t:"03:16:33",sys:"Network",pt:"BMS-P2",msg:"Controller comms restored",sev:"low"},
    {t:"03:16:48",sys:"Electrical",pt:"PDU-3",msg:"Branch load rebalanced after restart",sev:"low"},
    {t:"03:17:02",sys:"Security",pt:"Door 1",msg:"Door held open 22 s — closed",sev:"low"},
    {t:"03:17:25",sys:"Electrical",pt:"GEN-1",msg:"Running hours counter incremented",sev:"low"}
  ];
}

/* ---------- view ---------- */
function renderAlm(){
  const el=$("almView");
  if(!el.dataset.built){
    el.innerHTML=`
      <div class="tile noprint" style="margin-bottom:14px">
        <h3 style="font-size:14px;margin-bottom:3px">Known faults at shift start — read before you press Start run</h3>
        <div class="note" style="margin-bottom:10px">${KNOWN[V.id].length} entries on the desk log: work in progress, faults awaiting parts, sensors already reported faulty. Anything on this list that alarms later is an acknowledge, not an escalation. The full log with the triage worksheet is under <b>Packet</b> in the toolbar.</div>
        <table class="kf"><thead><tr><th style="cursor:default">Ref</th><th style="cursor:default">Raised</th><th style="cursor:default">Equipment / point</th><th style="cursor:default">What is known</th><th style="cursor:default">Status / owner</th><th style="cursor:default">If it alarms</th></tr></thead>
        <tbody>${KNOWN[V.id].map(k=>`<tr><td class="ref">${esc(k.ref)}</td><td class="mono">${esc(k.raised)}</td><td>${esc(k.pt)}</td><td>${esc(k.what)}</td><td>${esc(k.status)}</td><td>${esc(k.act)}</td></tr>`).join("")}</tbody></table>
      </div>
      <div class="tile noprint" style="margin-bottom:14px">
        <div class="flt" id="almFilters" role="group" aria-label="Filter alarms"></div>

    el.dataset.built="1";

      `<div class="chip ${f==='All'?'on':''}" data-f="${f}" role="button" tabindex="0" aria-pressed="${f==='All'?'true':'false'}">${f}</div>`).join("")+
      `<span style="width:12px"></span>`+
      ["Mechanical","Electrical","Environment","Leak det.","Fire","Network","Security","Admin"].map(f=>
      `<div class="chip" data-f="${f}" role="button" tabindex="0" aria-pressed="false">${f}</div>`).join("");
    $("almFilters").onkeydown=e=>{
      if((e.key==="Enter"||e.key===" ")&&e.target.closest(".chip")){e.preventDefault();e.target.closest(".chip").click();}
    };
    $("almFilters").onclick=e=>{
      const c=e.target.closest(".chip"); if(!c)return;
      const f=c.dataset.f;
      if(f==="All"){S.filters.clear();}
      else{ S.filters.has(f)?S.filters.delete(f):S.filters.add(f); }
      [...$("almFilters").children].forEach(ch=>{
        if(!ch.dataset)return;
        ch.classList.toggle("on", ch.dataset.f==="All" ? S.filters.size===0 : S.filters.has(ch.dataset.f));
        ch.setAttribute("aria-pressed",ch.classList.contains("on")?"true":"false");
      });
      renderAlmTable();
    };
    $("btnAckAll").onclick=()=>{S.alarms.forEach((a,i)=>{if(a.sev==="low")S.acked.add(i);});renderAlmTable();};
    $("btnClearMarks").onclick=()=>{S.marks={};renderAlmTable();};
    $("learnerName").value=S.learner;
    $("learnerName").oninput=e=>{S.learner=e.target.value;};
    $("ansText").value=S.ansText;
    $("ansText").oninput=e=>{S.ansText=e.target.value;};
    $("ansParent").onchange=e=>{
      S.ansParent=e.target.value;
      if(S.ansParent!=="") S.marks[+S.ansParent]="parent";
      renderAlmTable();
    };
    $("ansSecond").onchange=e=>{
      /* the alarm chosen as the second genuine event is marked “second event” in the table,
         so it is classified and appears on the sheet — an unmarked alarm is an undecided alarm */
      const prev=S.ansSecond; S.ansSecond=e.target.value;
      if(prev!==""&&S.marks[+prev]==="second") S.marks[+prev]=undefined;
      if(S.ansSecond!=="") S.marks[+S.ansSecond]="second";
      renderAlmTable();
    };
    $("btnSubmit").onclick=buildSheet;
  }
  renderAlmTable();
}
function revealed(){
  return S.alarms.map((a,i)=>({a,i}))
    .filter(({a})=>{
      const t=a.t.split(":"),m=(+t[0]*60+ +t[1]+ +t[2]/60)-(3*60+14);
      return m<=S.t+0.001;
    });
}
function visibleAlarms(){
  return revealed().filter(({a})=>{
    if(!S.filters.size) return true;
    const sev=a.sev[0].toUpperCase()+a.sev.slice(1);
    return S.filters.has(sev)||S.filters.has(a.sys);
  });
}
function renderAlmTable(){
  const rows=visibleAlarms();
  const dir=S.sortDir, k=S.sortKey;
  const sevRank={critical:0,high:1,medium:2,low:3};
  rows.sort((p,q)=>{
    let r=0;
    if(k==="time") r=p.a.t.localeCompare(q.a.t);
    else if(k==="sev") r=sevRank[p.a.sev]-sevRank[q.a.sev];
    else r=String(p.a[k]).localeCompare(String(q.a[k]));
    return r*dir;
  });
  const arrow=key=>S.sortKey===key?(S.sortDir>0?" ▲":" ▼"):"";
  const sortLbl=key=>S.sortKey===key?(S.sortDir>0?"ascending":"descending"):"none";
  /* remember keyboard focus across the repaint */
  const ae=document.activeElement, keep=ae&&$("almTable").contains(ae)?
    (ae.dataset.k?'th[data-k="'+ae.dataset.k+'"]':ae.dataset.ack!==undefined?'.tick[data-ack="'+ae.dataset.ack+'"]':
     ae.dataset.mark?'.tick[data-mark="'+ae.dataset.mark+'"][data-i="'+ae.dataset.i+'"]':null):null;
  const tickA=(cls,on,attrs,label)=>`<span class="tick ${cls}" ${attrs} role="checkbox" tabindex="0" aria-checked="${on?'true':'false'}" aria-label="${esc(label)}"></span>`;
  const nothingYet=!revealed().length;
  $("almTable").innerHTML=
   `<thead><tr>
      <th data-k="time" role="button" tabindex="0" aria-sort="${sortLbl("time")}" title="${S.sortKey==='time'&&S.sortDir>0?'Sorted by time, oldest first. Click again to reverse.':'Sort by time, oldest first'}">Time${arrow("time")}${S.sortKey==='time'&&S.sortDir>0?' <span style="font-weight:400;letter-spacing:0;text-transform:none">oldest first</span>':''}</th>
      <th data-k="sev" role="button" tabindex="0" aria-sort="${sortLbl("sev")}">Severity${arrow("sev")}</th>
      <th data-k="sys" role="button" tabindex="0" aria-sort="${sortLbl("sys")}">System${arrow("sys")}</th>
      <th data-k="pt" role="button" tabindex="0" aria-sort="${sortLbl("pt")}">Point${arrow("pt")}</th>
      <th data-k="msg" role="button" tabindex="0" aria-sort="${sortLbl("msg")}">Message${arrow("msg")}</th>
      <th style="cursor:default">Ack</th>
      <th style="cursor:default">Parent</th>
      <th style="cursor:default">Conseq.</th>
      <th style="cursor:default">Noise</th>
      <th style="cursor:default">2nd event</th>
    </tr></thead><tbody>`+
    (nothingYet?`<tr class="empty"><td colspan="10">No alarms yet — press Start run to begin. Read the known-fault log above first.</td></tr>`:
     rows.length?"":`<tr class="empty"><td colspan="10">No alarms match the filters you have set.</td></tr>`)+
    rows.map(({a,i})=>`<tr class="${S.acked.has(i)?'ack':''}">
      <td class="mono">${a.t}</td>
      <td><span class="sev ${a.sev}">${a.sev.toUpperCase()}</span></td>
      <td>${a.sys}</td><td class="mono">${a.pt}</td><td>${a.msg}</td>
      <td>${tickA(S.acked.has(i)?'on':'',S.acked.has(i),'data-ack="'+i+'"',"Acknowledge "+a.t+" "+a.pt+" "+a.msg)}</td>
      <td>${tickA(S.marks[i]==='parent'?'on':'',S.marks[i]==='parent','data-mark="parent" data-i="'+i+'"',"Mark as parent: "+a.t+" "+a.pt)}</td>
      <td>${tickA(S.marks[i]==='consequence'?'on':'',S.marks[i]==='consequence','data-mark="consequence" data-i="'+i+'"',"Mark as consequence: "+a.t+" "+a.pt)}</td>
      <td>${tickA(S.marks[i]==='noise'?'on':'',S.marks[i]==='noise','data-mark="noise" data-i="'+i+'"',"Mark as noise: "+a.t+" "+a.pt)}</td>
      <td>${tickA(S.marks[i]==='second'?'on second':'',S.marks[i]==='second','data-mark="second" data-i="'+i+'"',"Mark as second genuine event: "+a.t+" "+a.pt)}</td>
    </tr>`).join("")+`</tbody>`;
  $("almCount").textContent=`${rows.length} alarm${rows.length===1?"":"s"} shown · ${S.acked.size} acknowledged`;
  $("almTable").querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{
    const k2=th.dataset.k;
    /* The table boots sorted by time, oldest first. The first click on a column that is already
       the sort key confirms it (the handout says “click the Time header before you read”); only a
       second click on the same column reverses the direction. */
    if(S.sortKey===k2){ if(S.sortArmed) S.sortDir*=-1; else S.sortArmed=true; }
    else{S.sortKey=k2;S.sortDir=1;S.sortArmed=true;}
    renderAlmTable();
  });
  $("almTable").onkeydown=e=>{
    if(e.key!=="Enter"&&e.key!==" ")return;
    const t=e.target.closest(".tick,th[data-k]"); if(!t)return;
    e.preventDefault(); t.click();
  };
  $("almTable").onclick=e=>{
    const t=e.target.closest(".tick"); if(!t)return;
    if(t.dataset.ack!==undefined){
      const i=+t.dataset.ack; S.acked.has(i)?S.acked.delete(i):S.acked.add(i);
    }else{
      const i=+t.dataset.i, m=t.dataset.mark;
      S.marks[i]= S.marks[i]===m ? undefined : m;
      /* keep the pickers and the marks consistent */
      if(m==="second"){ const sel=$("ansSecond"); if(sel){ S.ansSecond=S.marks[i]==="second"?String(i):""; sel.value=S.ansSecond; } }
      if(m==="parent"&&S.marks[i]==="parent"){ const sel=$("ansParent"); if(sel){ S.ansParent=String(i); sel.value=S.ansParent; } }
    }
    renderAlmTable();
  };
  if(keep){ const k=$("almTable").querySelector(keep); if(k) k.focus(); }
  // the two pickers only offer alarms that have already come in
  const rv=revealed();
  const p=$("ansParent"), q=$("ansSecond");
  if(p&&q&&p.dataset.n!==String(rv.length)){
    const pv=p.value, qv=q.value;
    const opts=rv.map(({a,i})=>`<option value="${i}">${esc(a.t+" — "+a.pt+" · "+a.msg)}</option>`).join("");
    p.innerHTML=`<option value="">— choose —</option>`+opts;
    q.innerHTML=`<option value="">— none —</option>`+opts;
    p.value=pv||S.ansParent; q.value=qv||S.ansSecond;
    p.dataset.n=String(rv.length); q.dataset.n=String(rv.length);
  }
}

/* ---------- submission sheet ---------- */
function srow(label,value){
  return `<div class="srow"><span>${esc(label)}</span><span>${esc(value)}</span></div>`;
}
function almLabel(i){
  const a=S.alarms[i];
  return a? a.t+" — "+a.sys+" · "+a.pt+" · "+a.msg : "—";
}
function markWord(m){return m==="second"?"second genuine event":m;}
function packetRows(){
  const p=S.packet||{}, v=k=>String(p[k]||"").trim()||"—";
  const yn=k=>({yes:"Yes",no:"No",unsure:"Not sure"}[p[k]]||"—");
  const rows=[
    ["Life safety — is anyone in danger?",v("life")],
    ["Candidate parent (alarm and exact timestamp)",v("cand")],
    ["1. Is it the earliest alarm in the flood?",yn("q1")+(p.q1n?" — "+p.q1n:"")],
    ["2. Does it explain the others?",yn("q2")+(p.q2n?" — "+p.q2n:"")],
    ["3. Is it on the path to the load?",yn("q3")+(p.q3n?" — "+p.q3n:"")],
    ["4. Is it already known (checked against the known-fault log)?",yn("q4")+(p.q4n?" — "+p.q4n:"")],

}
function sheetHTML(){
  const pi=S.ansParent, si=S.ansSecond;
  const txt=String(S.ansText||"").trim();
  const marked=Object.keys(S.marks).map(Number).filter(i=>S.marks[i]).sort((a,b)=>a-b);
  const acked=[...S.acked].sort((a,b)=>a-b);
  const now=new Date();
  const missing=[];
  if(!S.learner) missing.push("Your name");
  if(pi==="") missing.push("Parent event");
  if(!txt) missing.push("Escalation sentence");
  if(!marked.length) missing.push("At least one alarm classified");
  const unmarked=revealed().filter(({i})=>!S.marks[i]).length;
  if(marked.length&&unmarked) missing.push(unmarked+" alarm"+(unmarked===1?"":"s")+" left unmarked");
  if(!String((S.packet||{}).cand||"").trim()) missing.push("Packet worksheet — candidate parent");

  let h=`<h3>${LAB.lab} — ${LAB.title}</h3>
    <div class="shsub">Submission sheet · UCI 2227 · objective ${LAB.obj}</div>
    <div class="srow"><span>Your name</span><span>${esc(S.learner||"not recorded")}</span></div>
    <h4>Run</h4>`;
  h+=srow("Completed",now.toLocaleDateString()+" "+now.toLocaleTimeString());
  h+=srow("Elapsed run time",fmtElapsed(S.t)+" of "+fmtElapsed(LAB.duration)+" simulated");
  h+=srow("Site time reached",fmtClock(S.t));

  h+=`<h4>Events recorded</h4>`;
  h+=srow("Parent event selected", pi===""?"not recorded":almLabel(+pi));
  h+=srow("Second unrelated event selected", si===""?"none recorded":almLabel(+si));

  h+=`<h4>Alarms classified (${marked.length})</h4>`;
  if(marked.length){
    h+=`<table><thead><tr><th style="cursor:default">Time</th><th style="cursor:default">System</th>
      <th style="cursor:default">Point</th><th style="cursor:default">Message</th>
      <th style="cursor:default">Marked as</th></tr></thead><tbody>`+
      marked.map(i=>{
        const a=S.alarms[i];
        return `<tr><td class="mono">${esc(a.t)}</td><td>${esc(a.sys)}</td><td class="mono">${esc(a.pt)}</td>
          <td>${esc(a.msg)}</td><td>${esc(markWord(S.marks[i]))}</td></tr>`;
      }).join("")+`</tbody></table>`;
  } else {
    h+=`<div class="note">No alarms classified.</div>`;
  }

  h+=`<h4>Alarms acknowledged (${acked.length})</h4>`;
  h+= acked.length
    ? acked.map(i=>`<div class="srow"><span>${esc(S.alarms[i].t)}</span><span>${esc(S.alarms[i].pt+" · "+S.alarms[i].msg)}</span></div>`).join("")
    : `<div class="note">No alarms acknowledged.</div>`;

  h+=`<h4>Escalation</h4>`;
  h+=`<div class="srow"><span>Your escalation sentence</span><span>${esc(txt||"not recorded")}</span></div>`;

  h+=`<h4>Packet — Shift-start packet (four-question triage worksheet)</h4>`;
  h+=packetRows();
  h+=`<h4>Known-fault log read at shift start (${KNOWN[V.id].length} entries)</h4>`;
  h+=KNOWN[V.id].map(k=>`<div class="srow"><span>${esc(k.ref)}</span><span>${esc(k.pt+" — "+k.status)}</span></div>`).join("");

  if(missing.length){
    h+=`<div class="missing"><b>Not yet filled in:</b> ${esc(missing.join(", "))}. Complete these before you print, or note on the sheet why you left them blank.</div>`;
  }
  h+=`<div class="closing">This record is embedded in your submission PDF.</div>`;
  return h;
}

/* ---------- packet: known-fault log + four-question worksheet ---------- */

function togglePacket(){

/* ---------- run loop ---------- */
function render(){
  $("clock").textContent=fmtClock(S.t);
  $("elapsed").textContent=fmtElapsed(S.t);
  renderAlm();
}
function tick(){
  if(S.t>=LAB.duration){stopRun(true);return;}
  S.t=Math.min(LAB.duration,S.t+0.25);
  render();
}
function startRun(){
  if(S.running)return;
  S.running=true;
  $("statusBadge").textContent="Running"; $("statusBadge").className="badge run";
  S.timer=setInterval(tick,Math.max(60,1000*15/S.speed));
}
function stopRun(done){
  S.running=false; clearInterval(S.timer); S.timer=null;
  $("statusBadge").textContent=done?"Run complete":"Held";
  $("statusBadge").className="badge "+(done?"":"hold");
}
function resetRun(){
  stopRun(false);
  rnd=mulberry32((1013904223 + SET*2654435761)>>>0);
  S.t=0; S.acked=new Set(); S.marks={}; S.filters=new Set(); S.sortKey="time"; S.sortDir=1; S.sortArmed=false;
  S.ansParent=""; S.ansSecond=""; S.ansText=""; S.packet={};
  S.alarms=buildAlarms(V.id);
  renderPacket();
  const vw=$("almView"); vw.dataset.built=""; vw.innerHTML="";
  render();
  $("statusBadge").textContent="Ready"; $("statusBadge").className="badge";
}

$("btnPause").onclick=()=>stopRun(false);

$("btnRestart").onclick=resetRun;
$("btnPacket").onclick=togglePacket;
$("speed").onchange=()=>{S.speed=+$("speed").value;if(S.running){stopRun(false);startRun();}};

<!-- ===== UCI 2227 · Submission module v2.1 =====================================
     Collects every handout question and its response inside this lab tool and
     exports ONE print-to-PDF submission sheet for Canvas grading.
     Self-contained. No external libraries. Safe to re-inject (idempotent).

     v2.0 — WCAG 2.1 AA pass (label association, headings, alt text, contrast,
     status announcement, authored focus); image downscale before storage with a
     visible error if the quota still throws; Save-as-PDF filename set from the
     learner name; print pagination and running header; duplicate learner-name
     rows stripped from the harvested simulator record.
     v2.1 — window.lqRecord() hook: a simulator can hand the module its record
     directly, so the harvest no longer depends on which pane is showing; loose
     `.sheet` tiles outside a `.result.show` are ignored; the learner name is

<script id="lqScript">
(function(){
  if(window.__lqLoaded) return; window.__lqLoaded=true;

  var esc=function(s){return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};

  var KEY="uci2227:"+LQ.file;
  var store={}, storageBroken=false;
  try{ store=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ store={}; }

  /* ---------- cross-lab storage budget ----------
     Every lab in the module is served from one origin, so all 43 share a single
     ~5 MB localStorage budget. Seventeen image questions at ~325 KB apiece is 5.4 MB
     — a learner working through the whole module on one browser profile would run out
     near the end. Images belonging to OTHER labs are evicted when room is needed,
     oldest and already-exported first. Text answers are never evicted: they are tiny,
     and they are the part a learner cannot reproduce. An evicted image is already
     inside the submission PDF that lab produced. */
  function otherLabKeys(){
    var out=[];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf("uci2227:")===0&&k!==KEY) out.push(k);
      }
    }catch(e){}
    return out;
  }
  function usedBytes(){
    var n=0;
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf("uci2227:")===0) n+=(localStorage.getItem(k)||"").length;
      }
    }catch(e){}
    return n;
  }
  function evictOtherImages(target){
    /* returns bytes freed. Prefers labs whose PDF has already been built, then oldest. */
    var recs=[];
    otherLabKeys().forEach(function(k){
      var raw,obj;
      try{ raw=localStorage.getItem(k)||"{}"; obj=JSON.parse(raw); }catch(e){ return; }
      var imgBytes=0;
      for(var f in obj) if(/_img$/.test(f)) imgBytes+=String(obj[f]).length;
      if(imgBytes>0) recs.push({k:k,obj:obj,bytes:imgBytes,ts:obj._ts||0,done:obj._done?1:0});
    });
    recs.sort(function(a,b){ return (b.done-a.done)||(a.ts-b.ts); });
    var freed=0;
    for(var i=0;i<recs.length&&freed<target;i++){
      var r=recs[i];
      for(var f in r.obj) if(/_img$/.test(f)) delete r.obj[f];
      r.obj._evicted=true;
      try{ localStorage.setItem(r.k,JSON.stringify(r.obj)); freed+=r.bytes; }catch(e){}
    }
    return freed;
  }

  function save(){
    store._ts=Date.now();
    var payload;
    try{ payload=JSON.stringify(store); }catch(e){ return false; }
    try{
      localStorage.setItem(KEY,payload);
      if(storageBroken){ storageBroken=false; showStoreErr(null); }
      return true;
    }catch(e){
      /* make room from other labs, then try once more */
      if(evictOtherImages(payload.length+200000)>0){
        try{
          localStorage.setItem(KEY,payload);
          if(storageBroken){ storageBroken=false; showStoreErr(null); }
          return true;
        }catch(e2){}
      }
      storageBroken=true;
      showStoreErr(e);
      return false;
    }
  }
  function showStoreErr(e){
    var b=document.getElementById("lqStoreErr");
    if(!b) return;
    if(!e){ b.style.display="none"; return; }
    b.style.display="block";
    b.innerHTML='<b>Your work is no longer being saved in this browser.</b><br>'
      +'Storage is full or switched off — usually private browsing, or a great many images '
      +'attached across the labs on this machine. Everything on screen is intact and the '
      +'submission PDF will still build correctly — but <b>do not refresh or close this tab</b>. '
      +'Press <b>Build submission PDF</b> now and save the file. '
      +'Then press <b>Clear my responses</b> to free the space up for the next lab.';
    if(b.scrollIntoView) b.scrollIntoView({block:"nearest"});
  }

  function announce(msg){
    var s=document.getElementById("lqStatus");
    if(s){ s.textContent=""; setTimeout(function(){ s.textContent=msg; },30); }
  }

  /* ---------- detect the set letter the tool is running ---------- */
  function setLetter(){
    try{ if(typeof SETLETTER!=="undefined"&&SETLETTER) return SETLETTER; }catch(e){}
    var tag=document.getElementById("setTag");
    if(tag&&tag.textContent){
      var m=tag.textContent.match(/set\s+([A-H])/i); if(m) return m[1].toUpperCase();
    }
    var m2=(LQ.file||"").match(/524-\d-\d-([A-H])_/); if(m2) return m2[1];
    return LQ.set||"—";
  }

  function hasSet(){ var l=setLetter(); return !!l&&l!=="—"; }

  /* ---------- downscale an image before it goes anywhere near storage ----------
     A phone photo is 2-5 MB and base64 inflates it by a third; localStorage is
     about 5 MB for the whole origin. Downscaling to 1600px JPEG brings a typical
     capture under 400 KB, which is still far more detail than the PDF can show. */
  var MAXPX=1600, JPEGQ=0.82;
  function downscale(file,cb){
    var rd=new FileReader();
    rd.onerror=function(){ cb(null,"The browser could not read that file."); };
    rd.onload=function(){
      var img=new Image();
      img.onerror=function(){ cb(null,"That file does not look like an image the browser can open."); };
      img.onload=function(){
        try{
          var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
          if(!w||!h){ cb(rd.result,null); return; }
          var sc=Math.min(1,MAXPX/Math.max(w,h));
          if(sc>=1&&rd.result.length<600000){ cb(rd.result,null); return; }
          var cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
          var c=document.createElement("canvas"); c.width=cw; c.height=ch;
          var x=c.getContext("2d");
          x.fillStyle="#fff"; x.fillRect(0,0,cw,ch);
          x.drawImage(img,0,0,cw,ch);
          cb(c.toDataURL("image/jpeg",JPEGQ),null);
        }catch(err){ cb(rd.result,null); }
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  }

  /* ---------- build the card ---------- */
  var host=document.querySelector("main .wrap")||document.querySelector("main")||document.body;
  var card=document.createElement("section");
  card.id="lqCard";
  card.setAttribute("aria-labelledby","lqCardTitle");

  var qs=LQ.items, secs=[], cur=null;
  qs.forEach(function(it,i){
    if(!cur||cur.name!==it.s){ cur={name:it.s,list:[]}; secs.push(cur); }
    cur.list.push({i:i,it:it});
  });

  var html=""
   +'<h2 id="lqCardTitle">Lab submission — questions and responses</h2>'
   +'<p class="lqsub">Every question from the <b>'+esc(LQ.handout)+'</b> handout is answered here, not on paper. '
   +'Your responses, together with the record this simulator builds, print to a <b>single PDF</b> that you upload to Canvas. '
   +'<b>What is saved:</b> everything you type in this panel is kept in this browser as you type, so a refresh will not lose your answers. '
   +(LQ.nosim?'':'<b>What is not:</b> the simulator above starts again on a refresh — if you refresh mid-lab, work the simulator again before you build the PDF.')+'</p>'
   +'<div id="lqStoreErr" role="alert"></div>'
   +'<p id="lqStatus" class="lqvh" role="status" aria-live="polite"></p>'
   +'<div class="lqid">'
   +'<div class="lqfld" style="flex:1 1 260px"><label for="lqName">Your name</label>'
     +'<input type="text" id="lqName" autocomplete="name" placeholder="First and last" value="'+esc(store.name||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 180px"><label for="lqCohort">Cohort / section</label>'
     +'<input type="text" id="lqCohort" placeholder="e.g. UCI 2227-01" value="'+esc(store.cohort||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 150px"><label for="lqDate">Date</label>'
     +'<input type="text" id="lqDate" value="'+esc(store.date||new Date().toLocaleDateString())+'"></div>'
   +'</div>';

  secs.forEach(function(sec,si){
    html+='<h3 class="lqsec" id="lqSec'+si+'">'+esc(sec.name||"Questions")+'</h3>';
    sec.list.forEach(function(o){
      var id="lqQ"+o.i, n=o.i+1;
      html+='<div class="lqq">';
      if(o.it.k==="image"){
        html+='<p class="lqp"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</p>'
             +'<div class="lqimgwrap">'
             +'<label class="lqfilelbl" for="'+id+'_f">Attach your image for question '+n+'</label>'
             +'<input type="file" accept="image/*" id="'+id+'_f">'
             +'<p class="lqnote" style="margin:5px 0 0">A photo or screenshot. It is resized and '
             +'embedded in the PDF you hand in.</p>'
             +'<img id="'+id+'_img" alt="Your attached image for question '+n+'" style="display:none">'
             +'<label class="lqfilelbl" for="'+id+'" style="margin-top:8px">Caption or note for question '+n+'</label>'
             +'<textarea id="'+id+'" rows="2" placeholder="Add any caption or note that goes with the image.">'
             +esc(store[id]||"")+'</textarea></div>';
      }else{
        html+='<label class="lqp" for="'+id+'"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</label>'
             +'<textarea id="'+id+'" rows="3" placeholder="Type your answer here.">'+esc(store[id]||"")+'</textarea>';
      }
      html+='</div>';
    });
  });

  html+='<div class="lqbtns">'
    +'<button type="button" class="lqprimary" id="lqBuild">Build submission PDF</button>'
    +'<button type="button" id="lqPreview">Preview without printing</button>'
    +'<button type="button" id="lqClear">Clear my responses</button>'
    +'<span class="lqnote">The PDF carries every question, your responses and the simulator record. One file, one upload.</span>'
    +'</div><div id="lqOut" role="region" aria-label="Submission sheet preview"></div>';

  card.innerHTML=html;
  host.appendChild(card);

  /* ---------- wiring ---------- */
  ["lqName","lqCohort","lqDate"].forEach(function(id){
    var el=document.getElementById(id);
    el.oninput=function(){ store[id.replace("lq","").toLowerCase()]=el.value; save(); };
  });
  qs.forEach(function(it,i){
    var id="lqQ"+i, ta=document.getElementById(id);
    if(ta) ta.oninput=function(){ store[id]=ta.value; save(); };
    var f=document.getElementById(id+"_f");
    if(f) f.onchange=function(){
      var file=f.files&&f.files[0]; if(!file) return;
      announce("Processing your image for question "+(i+1)+".");
      downscale(file,function(dataUrl,err){
        if(err){ announce(err); alert(err); return; }
        var img=document.getElementById(id+"_img");
        img.src=dataUrl; img.style.display="block";
        store[id+"_img"]=dataUrl;
        var okSave=save();
        announce("Image attached to question "+(i+1)+
          (okSave?"." : ", but it could not be saved in this browser. Build your PDF now."));
      });
    };
    if(store[id+"_img"]){
      var im0=document.getElementById(id+"_img");
      if(im0){ im0.src=store[id+"_img"]; im0.style.display="block"; }
    }
  });

  /* an image of this lab was evicted to make room for another lab on the shared
     origin, and this lab had not yet been exported — say so plainly */
  if(store._evicted&&!store._done){
    var eb=document.getElementById("lqStoreErr");
    eb.style.display="block";
    eb.innerHTML='<b>An image you attached is no longer stored.</b><br>'
      +'This browser ran out of room across all the labs on this machine and dropped it. '
      +'Your typed answers are all still here — only the image went. '
      +'Attach it again before you build your submission PDF.';
    delete store._evicted; save();
  }

  document.getElementById("lqClear").onclick=function(){
    if(!confirm("Clear every response you have typed in this lab? This cannot be undone.")) return;
    store={}; save();
    qs.forEach(function(it,i){
      var ta=document.getElementById("lqQ"+i); if(ta) ta.value="";
      var im=document.getElementById("lqQ"+i+"_img"); if(im){ im.removeAttribute("src"); im.style.display="none"; }
      var fi=document.getElementById("lqQ"+i+"_f"); if(fi) fi.value="";
    });
    document.getElementById("lqOut").innerHTML="";
    announce("All responses cleared.");
  };

  /* ---------- guard the simulator's Restart button ----------
     Restart wipes the simulator record but not the responses typed here, which
     would leave a submission whose prose describes a record that no longer exists.
     A capture-phase listener runs ahead of the tool's own onclick, so one confirm
     covers every variant of the handler. */
  (function(){
    var rb=document.getElementById("btnRestart")||document.getElementById("btnReset");
    if(!rb||card.contains(rb)) return;
    rb.addEventListener("click",function(ev){
      if(rb.dataset.lqOk==="1"){ rb.dataset.lqOk=""; return; }
      ev.preventDefault(); ev.stopImmediatePropagation();
      var ok=confirm(
        "Restart the scenario?\n\n"+
        "Everything you recorded in the simulator — readings, marks, logs, the "+
        "submission sheet it built — is wiped and the run starts again.\n\n"+
        "The answers you typed in the submission panel lower down are KEPT. If they "+
        "describe readings you are about to erase, build your submission PDF first.");
      if(ok){ rb.dataset.lqOk="1"; rb.click(); }
    },true);
  })();

  /* ---------- harvest the simulator's own record ---------- */
  var REC_SEL=".result.show, .result.show .sheet";
  function syncSimName(){
    /* the simulator keeps its own name field; the learner is told to fill the
       module's. Copy across so the harvested record never reports the name blank. */
    try{
      var n=document.getElementById("lqName"); if(!n||!n.value.trim()) return;
      var sim=document.getElementById("learnerName")||document.getElementById("learner")
            ||document.querySelector('input[name="learnerName"]');
      if(sim&&!card.contains(sim)&&!sim.value.trim()){
        sim.value=n.value.trim();
        sim.dispatchEvent(new Event("input",{bubbles:true}));
        sim.dispatchEvent(new Event("change",{bubbles:true}));
      }
    }catch(e){}
  }
  function collect(){
    var raw=[];
    Array.prototype.forEach.call(document.querySelectorAll(REC_SEL),function(s){
      if(card.contains(s)) return;
      if(!s.textContent.replace(/\s/g,"")) return;
      raw.push(s);
    });
    return raw.filter(function(s){
      return !raw.some(function(o){ return o!==s && o.contains(s); });
    });
  }

  /* the module already prints the learner name in its own Learner block, and every
     simulator sheet prints it again — four of them twice. Strip it from the clone. */
  var NAMEKEY=/^(your\s+)?(name|learner(\s+name)?)\s*:?\s*$/i;
  function stripDuplicateName(root){
    Array.prototype.forEach.call(root.querySelectorAll(".learnerline"),function(n){
      if(n.parentNode) n.parentNode.removeChild(n);
    });
    var rows=root.querySelectorAll("div,tr,p");
    Array.prototype.forEach.call(rows,function(r){
      var first=r.firstElementChild;
      if(!first||r.children.length>3) return;
      if(NAMEKEY.test((first.textContent||"").trim())){
        if(r.parentNode) r.parentNode.removeChild(r);
      }
    });
  }

  function cleanClone(s){
    var c=s.cloneNode(true);
    Array.prototype.forEach.call(c.querySelectorAll(".noprint, button"),function(n){
      if(n.parentNode) n.parentNode.removeChild(n);
    });
    stripDuplicateName(c);
    /* paper-era close line some simulators still print under their sheet */
    Array.prototype.forEach.call(c.querySelectorAll("p,div,span,small"),function(n){
      if(n.children.length===0&&/hand this sheet to your instructor/i.test(n.textContent||"")){
        if(n.parentNode) n.parentNode.removeChild(n);
      }
    });
    return c;
  }
  function toolRecord(){
    syncSimName();
    /* Preferred path: the simulator hands over its record itself. A simulator
       defines window.lqRecord() to (re)build its sheet from its current state and
       return the element or an HTML string — so the harvest no longer depends on
       which pane or tab happens to be showing when the learner presses the button. */
    if(typeof window.lqRecord==="function"){
      try{
        var r=window.lqRecord();
        if(typeof r==="string"&&r.replace(/\s/g,"")) return r;
        if(r&&r.nodeType===1&&r.textContent.replace(/\s/g,"")) return cleanClone(r).innerHTML;
      }catch(e){}
    }
    var found=collect();
    if(!found.length){
      var btns=document.querySelectorAll("button");
      var hit=null;
      Array.prototype.forEach.call(btns,function(b){
        if(card.contains(b)||hit) return;
        var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
        if(/print/.test(t)) return;
        if(/^build submission sheet$/.test(t)) hit=b;
      });
      if(!hit){
        Array.prototype.forEach.call(btns,function(b){
          if(card.contains(b)||hit) return;
          var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
          if(/print/.test(t)) return;
          if(/build .*sheet|submission sheet|submit .*(map|answer|sheet|round|log)|^submit$/.test(t)) hit=b;
        });
      }
      if(hit){ try{ hit.click(); }catch(e){} }
      found=collect();
    }
    if(!found.length) return null;
    var wrap=document.createElement("div");
    found.forEach(function(s){ wrap.appendChild(cleanClone(s)); });
    return wrap.innerHTML;
  }

  /* ---------- assemble the one sheet ---------- */
  function build(){
    var name=document.getElementById("lqName").value.trim();
    var coh=document.getElementById("lqCohort").value.trim();
    var dt=document.getElementById("lqDate").value.trim();
    var gaps=[];
    if(!name) gaps.push("Your name");
    if(!coh)  gaps.push("Cohort / section");

    var h=''
     +'<div class="lqsheet">'
     +'<h1>'+esc(LQ.lab)+' — '+esc(LQ.title)+'</h1>'
     +'<div class="lqmeta">UCI 2227 · Module 524 · '+esc(LQ.handout)
       +(hasSet()?' · Set '+esc(setLetter()):'')+' · submission sheet</div>'
     +'<h2>Learner</h2>'
     +'<div class="lqrow"><span class="k">Name</span><span class="v">'+(esc(name)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Cohort / section</span><span class="v">'+(esc(coh)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Date</span><span class="v">'+(esc(dt)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Scenario set</span><span class="v">'
       +(hasSet()?esc(setLetter()):'single set')+'</span></div>'
     +'<div class="lqrow"><span class="k">Built</span><span class="v">'
       +esc(new Date().toLocaleString())+'</span></div>';

    /* a response tool (nosim) can still carry an in-tool packet record via window.lqRecord() */
    var rec=(LQ.nosim&&typeof window.lqRecord!=="function")?null:toolRecord();
    if(rec){ h+='<h2>'+(LQ.nosim?'Packet record':'Simulator record')+'</h2>'+rec; }
    if(!rec&&!LQ.nosim){
      var why=(typeof window.lqRecordReason==="string"&&window.lqRecordReason)?" ("+window.lqRecordReason+")":"";
      gaps.push("The simulator record — the lab tool above has nothing to record yet"+why
               +". Work through the lab, then build this PDF again");
    }else if(LQ.nosim){
      h+='<h2>Assessed on the floor</h2>'
        +'<div class="lqrow"><span class="k">Practical steps</span><span class="v">'
        +'Observed and signed off by the instructor against the handout. '
        +'The instructor signature below records that sign-off.</span></div>';
    }

    var curSec=null;
    qs.forEach(function(it,i){
      if(it.s!==curSec){ curSec=it.s; h+='<h2>'+esc(curSec||"Questions")+'</h2>'; }
      var ta=document.getElementById("lqQ"+i);
      var a=ta?ta.value.trim():"";
      var im=store["lqQ"+i+"_img"];
      if(!a&&!im) gaps.push("Q"+(i+1));
      h+='<div class="lqa"><div class="q"><span class="qn">Q'+(i+1)+'.</span>'+esc(it.p)+'</div>';
      if(im) h+='<img src="'+im+'" alt="Attachment for question '+(i+1)+'">';
      h+='<div class="a'+((!a&&!im)?" blank":"")+'">'+(a?esc(a):"— not answered —")+'</div></div>';
    });

    if(gaps.length){
      h+='<div class="lqgap"><b>Not yet filled in ('+gaps.length+'):</b> '+esc(gaps.join(", "))
        +'.<br>This is a completeness check, not a grade. Fill them in and build again, '
        +'or hand the sheet in as it stands and explain the gaps to your instructor.</div>';
    }else{
      h+='<div class="lqgap ok">'
        +'<b>Complete.</b> Every question on this sheet carries a response'
        +(LQ.nosim?'.':' and the simulator record is attached.')+'</div>';
    }

    h+='<div class="lqsign">Learner signature: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'Instructor verification: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'<span style="font-size:11px">Save this as a PDF and upload the single file to the '
      +esc(LQ.lab)+' assignment in Canvas.</span></div></div>';

    document.getElementById("lqOut").innerHTML=h;
    announce(gaps.length
      ? ("Submission sheet built. "+gaps.length+" item"+(gaps.length===1?"":"s")+" still blank: "+gaps.join(", ")+".")
      : "Submission sheet built. Every question carries a response.");
    return h;
  }

  document.getElementById("lqPreview").onclick=function(){
    build();
    var o=document.getElementById("lqOut");
    if(o&&o.scrollIntoView) o.scrollIntoView({behavior:"smooth",block:"start"});
  };

  /* ---------- the one PDF ---------- */
  function safeName(s){
    return String(s||"").normalize?String(s||"").normalize("NFKD").replace(/[^\w\s-]/g,"").trim()
      :String(s||"").replace(/[^\w\s-]/g,"").trim();
  }
  function fileTitle(){
    var n=safeName(document.getElementById("lqName").value).split(/\s+/).filter(Boolean);
    var last=n.length>1?n[n.length-1]:(n[0]||"Learner");
    var first=n.length>1?n.slice(0,-1).join("_"):"";
    var who=first?(last+"_"+first):last;
    return who+"_"+String(LQ.lab||"").replace(/[^\d.]/g,"");
  }

  document.getElementById("lqBuild").onclick=function(){
    var h=build();
    /* this lab's images are now inside a PDF the learner holds, so they become the
       first thing evicted when another lab needs room on the shared origin */
    store._done=true; save();

    var old=document.getElementById("lqPrint"); if(old) old.parentNode.removeChild(old);

    /* The sheet goes inside a one-cell table whose thead repeats on every printed
       page, so pages 2+ still carry the learner name, the lab and the set. */
    var runHead='<span class="r">'+esc(LQ.lab)+(hasSet()?' · Set '+esc(setLetter()):'')+'</span>'
      +esc(document.getElementById("lqName").value.trim()||"Name not entered")
      +' · '+esc(LQ.title);
    var pr=document.createElement("div"); pr.id="lqPrint";
    pr.innerHTML='<table class="lqpage"><thead class="lqrhead"><tr><td class="lqrh">'
      +runHead+'</td></tr></thead><tbody><tr><td class="lqbody">'+h+'</td></tr></tbody></table>';
    document.body.appendChild(pr);

    /* the browser suggests document.title as the Save-as-PDF filename */
    var prevTitle=document.title;
    document.title=fileTitle();
    document.body.classList.add("lq-print");

    var restored=false;
    var done=function(){
      if(restored) return; restored=true;
      document.body.classList.remove("lq-print");
      document.title=prevTitle;
      var a=document.getElementById("lqPrint"); if(a&&a.parentNode) a.parentNode.removeChild(a);
      window.removeEventListener("afterprint",done);
      if(mq&&mq.removeListener) mq.removeListener(mqHandler);
    };
    var mq=window.matchMedia?window.matchMedia("print"):null;
    var mqHandler=function(m){ if(!m.matches) done(); };
    if(mq&&mq.addListener) mq.addListener(mqHandler);
    window.addEventListener("afterprint",done);

    setTimeout(function(){
      window.print();
      /* generous fallback: mobile print sheets are asynchronous, and tearing the
         container out too early yields a blank PDF */
      setTimeout(done,60000);
    },80);
  };
})();
</script>
<!-- ===== end submission module ============================================= -->
</body>
</html>
