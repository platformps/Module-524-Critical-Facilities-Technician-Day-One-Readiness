<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLAB 524.1.1 — Safety Zone Mapping — UCI 2227 (Training Simulator)</title>
<style>

  button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  button.primary:hover{background:#0a8bd8}
  button.danger{background:#4a1f1a;border-color:#6d3129;color:#ffb9ae}
  button:disabled{opacity:.4;cursor:not-allowed}
  select,input[type=text],input[type=number],textarea{
    font-family:inherit;font-size:13px;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:5px;padding:7px 9px}
  textarea{width:100%;resize:vertical;font-size:13px;line-height:1.45}

  /* ---------- shell ---------- */

  .brand{font-weight:700;letter-spacing:.4px;font-size:14px}

  .spacer{flex:1}
  .clock{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:1px}
  .clocklbl{color:var(--faint);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;text-align:right}
  .badge{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700;
    padding:4px 10px;border-radius:20px;background:#16324a;color:var(--blue);border:1px solid #23485f}
  .badge.run{background:#123a2a;color:var(--ok);border-color:#1d5b41}
  .badge.hold{background:#3d3220;color:var(--warn);border-color:#5c4c2e}

  main{flex:1;overflow:auto;padding:18px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin-bottom:14px}
  .card h3{font-size:15px;margin-bottom:4px}

  .side{display:flex;flex-direction:column;gap:12px}

<script>
"use strict";
const SET = 0;   /* fixed for this file */
/* ============================================================
   UCI 2227 — GLAB 524.1.1 · Safety Zone Mapping
   Standalone training console. Offline, no libraries, no network.
   Telemetry model and chart code are identical to the other lab tools.
   ============================================================ */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry32(1);
function noise(amp){return (rnd()*2-1)*amp;}
function fmtClock(mins){
  const base=3*60+14; // scenarios run from 03:14 site time
  const total=base+mins;
  const h=Math.floor(total/60)%24, m=Math.floor(total%60), s=Math.floor((mins%1)*60);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtElapsed(mins){
  return "T+"+String(Math.floor(mins)).padStart(2,"0")+":"+String(Math.floor((mins%1)*60)).padStart(2,"0");
}
function drawChart(cv,cfg){
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cfg.height||150;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  const x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,W,H);
  const pad={l:46,r:10,t:10,b:20};
  const pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  const {min,max}=cfg;
  const sy=v=>pad.t+ph-((v-min)/(max-min))*ph;
  const sx=i=>pad.l+(i/Math.max(1,cfg.xmax))*pw;

  // alarm band shading
  if(cfg.band){
    x.fillStyle="rgba(232,96,76,.10)";
    if(cfg.band.hi<max) x.fillRect(pad.l,pad.t,pw,sy(cfg.band.hi)-pad.t);
    if(cfg.band.lo>min) x.fillRect(pad.l,sy(cfg.band.lo),pw,pad.t+ph-sy(cfg.band.lo));
  }
  // grid + y labels
  x.strokeStyle="#1d3346"; x.lineWidth=1; x.font="10px "+getComputedStyle(document.body).fontFamily;
  x.fillStyle="#5c7a92"; x.textAlign="right"; x.textBaseline="middle";
  for(let i=0;i<=4;i++){
    const v=min+(max-min)*i/4, yy=sy(v);
    x.beginPath(); x.moveTo(pad.l,yy); x.lineTo(W-pad.r,yy); x.stroke();
    x.fillText(cfg.fmt?cfg.fmt(v):v.toFixed(1),pad.l-6,yy);
  }
  // step markers
  if(cfg.steps) cfg.steps.forEach(s=>{
    if(s>cfg.xmax) return;
    x.strokeStyle="#25415a"; x.setLineDash([3,3]);
    x.beginPath(); x.moveTo(sx(s),pad.t); x.lineTo(sx(s),pad.t+ph); x.stroke(); x.setLineDash([]);
  });
  // series
  (cfg.series||[]).forEach(se=>{
    if(!se.data.length) return;
    x.strokeStyle=se.color; x.lineWidth=se.width||2; x.beginPath();
    se.data.forEach((v,i)=>{ const px=sx(i*(cfg.xstep||1)), py=sy(clamp(v,min,max));
      i?x.lineTo(px,py):x.moveTo(px,py); });
    x.stroke();
    // last point dot
    const li=se.data.length-1;
    x.fillStyle=se.color; x.beginPath();
    x.arc(sx(li*(cfg.xstep||1)),sy(clamp(se.data[li],min,max)),2.6,0,7); x.fill();
  });
  // x label
  x.fillStyle="#5c7a92"; x.textAlign="center"; x.textBaseline="top";
  x.fillText(cfg.xlabel||"minutes",pad.l+pw/2,H-13);
}
function tile(name,val,unit,band,cls){
  return `<div class="tile ${cls||''}"><div class="name">${name}</div>
    <div class="val">${val}<span class="unit">${unit||''}</span></div>
    <div class="band">${band||''}</div></div>`;
}

/* ---------- this lab ---------- */
const LAB={lab:"GLAB 524.1.1",obj:"M1.1",title:"Safety Zone Mapping",duration:55,
  scale:1.5}; // inches of real distance per plan unit

const SETUPS=[
  {id:"A1",cfg:[5,0,94,85],mode:"tray"},
  {id:"A2",cfg:[2,1,97,88],mode:"mezz"},
  {id:"A3",cfg:[0,2,91,80],mode:"scaf"}
];

const RNG_KEY=(0x9E3779B1^Math.imul(SET+1,2654435761))>>>0;
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function kvr(k,v,wide){ return '<div class="kvr'+(wide?" wide":"")+'"><span>'+k+'</span><span>'+v+'</span></div>'; }

const EQUIP=[
  {id:"MSB-1",  nm:"Main switchgear MSB-1",        x:420,y:90, w:150,h:44, v:"480 V, 3 phase", ie:28.4,cat:"4", afb:118,lim:42,res:12},
  {id:"UPS-A",  nm:"Uninterruptible supply UPS-A", x:420,y:160,w:110,h:40, v:"480 V, 3 phase", ie:12.6,cat:"3", afb:62, lim:42,res:12},
  {id:"UPS-B",  nm:"Uninterruptible supply UPS-B", x:420,y:215,w:110,h:40, v:"480 V, 3 phase", ie:11.8,cat:"3", afb:58, lim:42,res:12},
  {id:"PDU-1",  nm:"Power distribution unit 1",    x:585,y:90, w:80, h:32, v:"480/208 V",      ie:6.8, cat:"2", afb:38, lim:42,res:12},
  {id:"PDU-2",  nm:"Power distribution unit 2",    x:585,y:132,w:80, h:32, v:"480/208 V",      ie:6.4, cat:"2", afb:36, lim:42,res:12},
  {id:"PDU-3",  nm:"Power distribution unit 3",    x:585,y:174,w:80, h:32, v:"480/208 V",      ie:6.8, cat:"2", afb:38, lim:42,res:12},
  {id:"PDU-4",  nm:"Power distribution unit 4",    x:585,y:216,w:80, h:32, v:"480/208 V",      ie:7.1, cat:"2", afb:40, lim:42,res:12},
  {id:"ATS-1",  nm:"Automatic transfer switch 1",  x:980,y:120,w:90, h:50, v:"480 V, 3 phase", ie:22.1,cat:"3", afb:94, lim:42,res:12},
  {id:"GEN-1",  nm:"Generator 1 output breaker",   x:760,y:90, w:140,h:60, v:"480 V, 3 phase", ie:9.4, cat:"3", afb:51, lim:42,res:12},
  {id:"GEN-2",  nm:"Generator 2 output breaker",   x:760,y:180,w:140,h:60, v:"480 V, 3 phase", ie:9.4, cat:"3", afb:51, lim:42,res:12},

function paintLabel(){
  const box=$("lblBox");
  if(!S.sel){
    box.innerHTML=`<h4>Posted label</h4><div class="note">No equipment selected. Click an item on the plan.</div>`;
    return;
  }
  const e=eqById(S.sel);
  let html=`<h4>Posted label — ${e.id}</h4>`+labelHTML(e);
  if(S.mode==="boundary"&&e.id!==S.z1){
    const cur=S.bounds[e.id]?S.bounds[e.id].dist:"";
    html+=`<div class="row" style="margin-top:11px">
      <div class="fld"><label>Boundary distance read off the label (in)</label>
        <input type="number" id="bdDist" value="${cur}" style="width:130px"></div>
      <button class="primary" id="bdMark">Draw boundary</button>
      <button id="bdCancel">Cancel</button></div>`;
  }
  if(S.mode==="boundary"&&e.id===S.z1){
    html+=`<div class="row" style="margin-top:11px">
      <div class="fld"><label>Boundary distance (in)</label>
        <input type="number" id="bdDist" style="width:130px"></div>
      <button id="bdMark">Draw boundary</button>
      <button id="bdCancel">Cancel</button></div>`;
  }
  box.innerHTML=html;
  const lg=box.querySelector("#btnFlag");
  if(lg) lg.onclick=()=>{S.flagged[e.id]=!S.flagged[e.id];paintLabel();drawMarks();};
  const mk=box.querySelector("#bdMark");
  if(mk) mk.onclick=()=>{
    const d=+box.querySelector("#bdDist").value;
    if(!d||d<=0){alert("Enter the boundary distance in inches, as printed on the label.");return;}
    S.bounds[e.id]={dist:Math.round(d)};
    drawMarks(); paintLabel();
  };
  const cn=box.querySelector("#bdCancel");
  if(cn) cn.onclick=()=>{S.sel=null;drawMarks();paintLabel();};
}

/* ---------- geometry ---------- */
function svgPoint(evt){
  const svg=$("plan");
  const pt=svg.createSVGPoint();
  pt.x=evt.clientX; pt.y=evt.clientY;
  const m=svg.getScreenCTM();
  if(!m) return {x:0,y:0};
  const p=pt.matrixTransform(m.inverse());
  return {x:p.x,y:p.y};
}

function buildSubmission(){
  const r=$("mapResult"), b=[];
  b.push(`<h3 style="font-size:15px">${LAB.lab} — ${LAB.title}</h3>
    <div class="sub" style="margin:2px 0 11px">Submission sheet</div>`);
  b.push(kvr("Name",esc(S.learner)||"—")+
         kvr("Completed",stamp())+kvr("Time on task",fmtElapsed(S.t)));

  const ids=Object.keys(S.bounds);
  b.push(`<h4>Arc flash boundaries marked</h4>`+
    (ids.length?ids.map(id=>kvr(id+" — "+eqById(id).nm,S.bounds[id].dist+" in")).join("")
               :`<div class="note">No boundaries marked.</div>`));

  const fl=Object.keys(S.flagged).filter(k=>S.flagged[k]);
  b.push(`<h4>Items flagged for a written finding</h4>`+
    (fl.length?fl.map(id=>kvr(id,eqById(id)?eqById(id).nm:"—")).join("")
              :`<div class="note">None flagged.</div>`));

  b.push(`<h4>Noise zones shaded</h4>`+
    (S.shades.length?S.shades.map((s,i)=>kvr("Zone "+(i+1)+" — plan area "+s.x+","+s.y+" "+s.w+"x"+s.h,
        s.dba+" dBA")).join("")
      :`<div class="note">No noise zones shaded.</div>`));

  const cz=$("confZone").value, cs=$("confSign").value, cv=$("confSurvey").value;
  const czn=cz?(S.zones.filter(z=>z.id===cz)[0]||{}).nm:"";
  b.push(`<h4>Signage against survey</h4>`+
    kvr("Conflict box ticked",S.conflictFlag?"yes":"no")+
    kvr("Zone",cz?esc(cz+" · "+czn):"—")+
    kvr("Posted signage",cs?esc(cs)+" dBA":"—")+
    kvr("Acoustic survey",cv?esc(cv)+" dBA":"—"));

  b.push(`<h4>Fall hazard marks</h4>`+
    (S.falls.length?S.falls.map((p,i)=>kvr("Fall mark "+(i+1),"plan "+p.x+", "+p.y)).join("")
      :`<div class="note">No fall hazard marks placed.</div>`));

  const rows=S.rows.filter(x=>x.where||x.what||x.when||x.who);
  b.push(`<h4>Hazard check sheet</h4>`+
    (rows.length?`<table><thead><tr>
        <th style="cursor:default">Where</th><th style="cursor:default">What</th>
        <th style="cursor:default">When</th><th style="cursor:default">Who</th></tr></thead><tbody>`+
      rows.map(x=>`<tr><td>${esc(x.where)||"—"}</td><td>${esc(x.what)||"—"}</td>
        <td>${esc(x.when)||"—"}</td><td>${esc(x.who)||"—"}</td></tr>`).join("")+`</tbody></table>`
      :`<div class="note">No rows written.</div>`));

  b.push(`<h4>Sentence for the shift lead</h4>`+
    `<div class="note">${esc($("ansText").value.trim())||"—"}</div>`);

  const miss=[];
  if(!S.learner) miss.push("your name");
  if(!$("ansText").value.trim()) miss.push("the sentence for the shift lead");
  if(!S.rows.some(x=>x.where&&x.what&&x.when&&x.who))
    miss.push("at least one hazard check sheet row with all four columns filled");
  if(miss.length) b.push(`<div class="todo"><b>Blank fields on this sheet:</b>
    <ul>${miss.map(m=>`<li>${m}</li>`).join("")}</ul></div>`);

  b.push(`<div class="close">Check every field before printing. Hand this sheet to your instructor
    with your worksheet.</div>
    <div class="row noprint" style="margin-top:11px">
      <button onclick="window.print()">Print submission sheet</button></div>`);

  r.className="result show";
  r.innerHTML=b.join("");
}

    </div>`;

  $("confZone").innerHTML=`<option value="">— choose —</option>`+
    S.zones.map(z=>`<option value="${z.id}">${z.id} · ${z.nm}</option>`).join("");

  const plan=$("plan");
  plan.addEventListener("click",e=>{
    if(S.mode==="noise") return;
    const g=e.target.closest(".eq");
    if(g){
      S.sel=g.dataset.id; drawMarks(); paintLabel(); return;
    }
    if(S.mode==="fall"){
      const p=svgPoint(e);
      if(p.x<20||p.x>1180||p.y<20||p.y>680) return;
      S.falls.push({x:Math.round(p.x),y:Math.round(p.y)});
      drawMarks();
    }
  });
  plan.addEventListener("pointerdown",e=>{
    if(S.mode!=="noise") return;
    const p=svgPoint(e);
    S.drag={x0:p.x,y0:p.y,x1:p.x,y1:p.y};
    plan.setPointerCapture&&plan.setPointerCapture(e.pointerId);
    paintRubber();
  });
  plan.addEventListener("pointermove",e=>{
    if(!S.drag) return;
    const p=svgPoint(e);
    S.drag.x1=p.x; S.drag.y1=p.y; paintRubber();
  });
  plan.addEventListener("pointerup",()=>{
    if(!S.drag) return;
    const d=S.drag; S.drag=null;
    $("rubber").classList.add("hidden");
    const x=Math.min(d.x0,d.x1), y=Math.min(d.y0,d.y1);
    const w=Math.abs(d.x1-d.x0), h=Math.abs(d.y1-d.y0);
    if(w<25||h<25) return;
    const v=prompt("Noise level you are working to in this zone, in dBA:","");
    if(v===null) return;
    const n=+v;
    if(!n||n<40||n>140){alert("Enter a level between 40 and 140 dBA.");return;}
    S.shades.push({x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h),dba:Math.round(n)});
    drawMarks();
  });
  plan.addEventListener("pointercancel",()=>{S.drag=null;$("rubber").classList.add("hidden");});

  $("btnSurvey").onclick=()=>{
    S.showSurvey=!S.showSurvey;
    $("zones").classList.toggle("hidden",!S.showSurvey);
    $("btnSurvey").textContent=S.showSurvey?"Hide posted acoustic survey":"Show posted acoustic survey";
    $("btnSurvey").className=S.showSurvey?"modeon":"";
  };
  $("chkConflict").onclick=()=>{
    S.conflictFlag=!S.conflictFlag;
    $("chkConflict").classList.toggle("on",S.conflictFlag);
  };
  $("ckWrap").onclick=e=>{if(e.target.id!=="chkConflict"){$("chkConflict").click();}};
  $("sheetBody").addEventListener("input",e=>{
    const i=e.target.dataset.i, k=e.target.dataset.k;
    if(i===undefined||!k) return;
    S.rows[+i][k]=e.target.value; paintCounts();
  });
  $("sheetBody").addEventListener("click",e=>{
    const b=e.target.closest("button[data-del]"); if(!b) return;
    S.rows.splice(+b.dataset.del,1);
    if(!S.rows.length) S.rows.push({where:"",what:"",when:"",who:""});
    paintSheet();
  });
  $("btnAddRow").onclick=()=>{S.rows.push({where:"",what:"",when:"",who:""});paintSheet();};
  $("learnerName").value=S.learner;
  $("learnerName").addEventListener("input",e=>{S.learner=e.target.value.trim();});
  $("btnSubmitMap").onclick=buildSubmission;

  paintSheet(); drawMarks(); paintSide();
}
function paintRubber(){
  const d=S.drag; if(!d) return;
  const r=$("rubber");
  r.classList.remove("hidden");
  r.setAttribute("x",Math.min(d.x0,d.x1));
  r.setAttribute("y",Math.min(d.y0,d.y1));
  r.setAttribute("width",Math.abs(d.x1-d.x0));
  r.setAttribute("height",Math.abs(d.y1-d.y0));
}
function setMode(m){
  S.mode=m;
  S.drag=null; // an interrupted drag must not carry into the next mode
  if(m!=="inspect"&&m!=="boundary") S.sel=null;
  const map={inspect:"btnInspect",boundary:"btnBoundary",noise:"btnNoise",fall:"btnFall"};
  Object.keys(map).forEach(k=>$(map[k]).className=(k===m?"modeon":""));
  const plan=$("plan");
  if(plan) plan.setAttribute("class","mode-"+m);
  const names={inspect:"Inspect",boundary:"Marking boundaries",noise:"Shading noise",fall:"Marking falls"};
  $("statusBadge").textContent=names[m];
  $("statusBadge").className="badge run";
  if(plan){$("rubber").classList.add("hidden");drawMarks();paintSide();}
}

/* ---------- clock ---------- */
function startClock(){
  stopClock();
  $("clock").textContent=fmtClock(S.t);
  S.timer=setInterval(()=>{S.t+=1/60;$("clock").textContent=fmtClock(S.t);},1000);
}
function stopClock(){if(S.timer){clearInterval(S.timer);S.timer=null;}}

/* ---------- reset / nav ---------- */
function clearMarks(){
  S.bounds={}; S.shades=[]; S.falls=[]; S.sel=null; S.flagged={};
  drawMarks(); paintLabel();
  const r=$("mapResult"); if(r) r.className="result";
}
function resetRun(){
  rnd=mulberry32(RNG_KEY);
  S.t=0; S.bounds={}; S.shades=[]; S.falls=[]; S.sel=null;
  S.flagged={}; S.showSurvey=false; S.conflictFlag=false; S.drag=null;
  S.rows=[{where:"",what:"",when:"",who:""},{where:"",what:"",when:"",who:""},{where:"",what:"",when:"",who:""}];
  buildZones();
  buildView(); setMode("inspect"); startClock();
}
/* ---------- wiring ---------- */
$("btnInspect").onclick=()=>setMode("inspect");
$("btnBoundary").onclick=()=>setMode("boundary");
$("btnNoise").onclick=()=>setMode("noise");
$("btnFall").onclick=()=>setMode("fall");
$("btnClear").onclick=clearMarks;
$("btnRestart").onclick=resetRun;
/* Floor Route Packet — reference copy, opened in its own window so it can sit beside the console.
   Source is embedded below in #packetSrc; nothing is fetched. */
$("btnPacket").onclick=()=>{
  const w=window.open("","glab5211_packet","width=1240,height=900,resizable=yes,scrollbars=yes");
  if(!w){alert("The browser blocked the packet window. Allow pop-ups for this file and press Packet again.");return;}
  w.document.open(); w.document.write($("packetSrc").textContent); w.document.close(); w.focus();
};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.sel&&$("lblBox")){S.sel=null;drawMarks();paintLabel();}
});

/* ---------- boot ---------- */
$("setTag").textContent="Set "+"ABCDEFGH".charAt(SET);
resetRun();

</script>

  save findings until the end of the walk, because you will lose two.</p>

<script id="lqData">var LQ={"lab": "GLAB 524.1.1", "title": "Safety Zone Mapping", "handout": "GLAB 524.1.1 - Safety Zone Mapping", "file": "524-1-1-A_SafetyZones.html", "set": "A", "items": [{"s": "Part 1: Walking and mapping the floor", "k": "text", "p": "Step 1. Collect your blueprint packet, hazard check sheet, acoustic survey map and colored markers from the front bench, and sign the facility entry safety log. Record your entry time. If your group is working in the tool, open the 524.1.1 file your instructor gives you — it opens straight into the lab. Write your entry time below."}, {"s": "Part 1: Walking and mapping the floor", "k": "text", "p": "Step 2. Before you move, read the packet cover. Confirm the route, the floor level, the plan revision date and the plan scale. The plan is drawn at 1.5 plan units to one inch of real distance, which matters the moment you convert a boundary distance in inches into a circle on the drawing. Get this wrong and every boundary you draw is the wrong size. Record the route, the floor level, the plan revision date and the plan scale below."}, {"s": "Part 1: Walking and mapping the floor", "k": "text", "p": "Step 4. Walk it a second time and start marking. At each item of energized equipment, read the arc flash label from outside the boundary [Inspect]. Record the equipment identifier, the system voltage, the incident energy in cal/cm², the PPE category and the arc flash boundary distance in inches. Record the first three you reach below, so you have a worked example of the format."}, {"s": "Part 1: Walking and mapping the floor", "k": "text", "p": "Step 6. You will find at least one label you cannot read. Do not estimate it, do not measure it off the plan, and do not copy the distance from the identical unit next to it. Log it as a finding [Log unreadable]: the equipment identifier, what specifically is wrong with the label, and the consequence — that the equipment cannot be worked energized until the incident energy study is re-issued. Write that finding out in full below."}, {"s": "Part 1: Walking and mapping the floor", "k": "text", "p": "Step 7. Now the noise zones. Shade every zone where posted signage or the acoustic survey shows 85 dBA or above [Noise / Survey]. Work zone by zone rather than sign by sign, and check both sources for each zone before you shade it. List the zones you shaded and the dBA figure you shaded them at."}, {"s": "Part 1: Walking and mapping the floor", "k": "text", "p": "Step 8. One zone will have a posted sign and a survey figure that disagree, and there is no way to tell from the floor which is current. Log both numbers, flag the conflict explicitly [Flag conflict], and work to the higher figure until somebody with the survey file says otherwise. Do not average them and do not pick the one you like. Record the zone, both values, and the figure you are working to."}, {"s": "Part 1: Walking and mapping the floor", "k": "text", "p": "Step 9. Mark with an X every location where work would put a technician above four feet [Fall]. Four feet, not six — this is general industry under 29 CFR 1910.28 and 1910.23, and the six-foot figure you may have heard is the construction standard. There are three such locations on your route. List all three below, each with the height involved and the work that would take somebody up there."}, {"s": "Part 1: Walking and mapping the floor", "k": "text", "p": "Step 10. For each fall location, note whether there is an anchor point. Where an anchor point is absent, that absence is the finding, and it is worth more than the marking itself — a fall location with a rated anchor is a controlled hazard, a fall location without one is not."}, {"s": "Part 1: Walking and mapping the floor", "k": "text", "p": "Step 11. Complete the hazard check sheet — one line per finding, using WHERE / WHAT / WHEN / WHO [Add row]. WHERE is a location a stranger could find. WHAT is what you observed, not what you concluded. WHEN is the time you observed it e the same model. Explain why that is not acceptable, in terms of what an arc flash boundary distance is actually calculated from."}, {"s": "Part 2: Reflection", "k": "text", "p": "Read back your own hazard check sheet as though you were the technician coming on shift tomorrow and had never met you. Pick your weakest line — the one that would make you ask a question — and rewrite it below so that it does not."}]};</script>

  function otherLabKeys(){

      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);

      }

      }

    return n;
  }
  function evictOtherImages(target){
    /* returns bytes freed. Prefers labs whose PDF has already been built, then oldest. */

   +'<p id="lqStatus" class="lqvh" role="status" aria-live="polite"></p>'
   +'<div class="lqid">'
   +'<div class="lqfld" style="flex:1 1 260px"><label for="lqName">Your name</label>'
     +'<input type="text" id="lqName" autocomplete="name" placeholder="First and last" value="'+esc(store.name||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 180px"><label for="lqCohort">Cohort / section</label>'
     +'<input type="text" id="lqCohort" placeholder="e.g. UCI 2227-01" value="'+esc(store.cohort||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 150px"><label for="lqDate">Date</label>'
     +'<input type="text" id="lqDate" value="'+esc(store.date||new Date().toLocaleDateString())+'"></div>'
   +'</div>';

  secs.forEach(function(sec,si){
    html+='<h3 class="lqsec" id="lqSec'+si+'">'+esc(sec.name||"Questions")+'</h3>';
    sec.list.forEach(function(o){
      var id="lqQ"+o.i, n=o.i+1;
      html+='<div class="lqq">';
      if(o.it.k==="image"){
        html+='<p class="lqp"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</p>'
             +'<div class="lqimgwrap">'
             +'<label class="lqfilelbl" for="'+id+'_f">Attach your image for question '+n+'</label>'
             +'<input type="file" accept="image/*" id="'+id+'_f">'
             +'<p class="lqnote" style="margin:5px 0 0">A photo or screenshot. It is resized and '
             +'embedded in the PDF you hand in.</p>'
             +'<img id="'+id+'_img" alt="Your attached image for question '+n+'" style="display:none">'
             +'<label class="lqfilelbl" for="'+id+'" style="margin-top:8px">Caption or note for question '+n+'</label>'
             +'<textarea id="'+id+'" rows="2" placeholder="Add any caption or note that goes with the image.">'
             +esc(store[id]||"")+'</textarea></div>';
      }else{
        html+='<label class="lqp" for="'+id+'"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</label>'
             +'<textarea id="'+id+'" rows="3" placeholder="Type your answer here.">'+esc(store[id]||"")+'</textarea>';
      }
      html+='</div>';
    });
  });

  html+='<div class="lqbtns">'
    +'<button type="button" class="lqprimary" id="lqBuild">Build submission PDF</button>'
    +'<button type="button" id="lqPreview">Preview without printing</button>'
    +'<button type="button" id="lqClear">Clear my responses</button>'
    +'<span class="lqnote">The PDF carries every question, your responses and the simulator record. One file, one upload.</span>'
    +'</div><div id="lqOut" role="region" aria-label="Submission sheet preview"></div>';

  card.innerHTML=html;
  host.appendChild(card);

  /* ---------- wiring ---------- */
  ["lqName","lqCohort","lqDate"].forEach(function(id){
    var el=document.getElementById(id);
    el.oninput=function(){ store[id.replace("lq","").toLowerCase()]=el.value; save(); };
  });
  qs.forEach(function(it,i){
    var id="lqQ"+i, ta=document.getElementById(id);
    if(ta) ta.oninput=function(){ store[id]=ta.value; save(); };
    var f=document.getElementById(id+"_f");
    if(f) f.onchange=function(){
      var file=f.files&&f.files[0]; if(!file) return;
      announce("Processing your image for question "+(i+1)+".");
      downscale(file,function(dataUrl,err){
        if(err){ announce(err); alert(err); return; }
        var img=document.getElementById(id+"_img");
        img.src=dataUrl; img.style.display="block";
        store[id+"_img"]=dataUrl;
        var okSave=save();
        announce("Image attached to question "+(i+1)+
          (okSave?"." : ", but it could not be saved in this browser. Build your PDF now."));
      });
    };
    if(store[id+"_img"]){
      var im0=document.getElementById(id+"_img");
      if(im0){ im0.src=store[id+"_img"]; im0.style.display="block"; }
    }
  });

  /* an image of this lab was evicted to make room for another lab on the shared
     origin, and this lab had not yet been exported — say so plainly */
  if(store._evicted&&!store._done){
    var eb=document.getElementById("lqStoreErr");
    eb.style.display="block";
    eb.innerHTML='<b>An image you attached is no longer stored.</b><br>'
      +'This browser ran out of room across all the labs on this machine and dropped it. '
      +'Your typed answers are all still here — only the image went. '
      +'Attach it again before you build your submission PDF.';
    delete store._evicted; save();
  }

  document.getElementById("lqClear").onclick=function(){
    if(!confirm("Clear every response you have typed in this lab? This cannot be undone.")) return;
    store={}; save();
    qs.forEach(function(it,i){
      var ta=document.getElementById("lqQ"+i); if(ta) ta.value="";
      var im=document.getElementById("lqQ"+i+"_img"); if(im){ im.removeAttribute("src"); im.style.display="none"; }
      var fi=document.getElementById("lqQ"+i+"_f"); if(fi) fi.value="";
    });
    document.getElementById("lqOut").innerHTML="";
    announce("All responses cleared.");
  };

  /* ---------- guard the simulator's Restart button ----------
     Restart wipes the simulator record but not the responses typed here, which
     would leave a submission whose prose describes a record that no longer exists.
     A capture-phase listener runs ahead of the tool's own onclick, so one confirm
     covers every variant of the handler. */
  (function(){
    var rb=document.getElementById("btnRestart")||document.getElementById("btnReset");
    if(!rb||card.contains(rb)) return;
    rb.addEventListener("click",function(ev){
      if(rb.dataset.lqOk==="1"){ rb.dataset.lqOk=""; return; }
      ev.preventDefault(); ev.stopImmediatePropagation();
      var ok=confirm(
        "Restart the scenario?\n\n"+
        "Everything you recorded in the simulator — readings, marks, logs, the "+
        "submission sheet it built — is wiped and the run starts again.\n\n"+
        "The answers you typed in the submission panel lower down are KEPT. If they "+
        "describe readings you are about to erase, build your submission PDF first.");
      if(ok){ rb.dataset.lqOk="1"; rb.click(); }
    },true);
  })();

  /* ---------- harvest the simulator's own record ---------- */
  var REC_SEL=".sheet, .result.show";
  function collect(){
    var raw=[];
    Array.prototype.forEach.call(document.querySelectorAll(REC_SEL),function(s){
      if(card.contains(s)) return;
      if(!s.textContent.replace(/\s/g,"")) return;
      raw.push(s);
    });
    return raw.filter(function(s){
      return !raw.some(function(o){ return o!==s && o.contains(s); });
    });
  }

  /* the module already prints the learner name in its own Learner block, and every
     simulator sheet prints it again — four of them twice. Strip it from the clone. */
  var NAMEKEY=/^(your\s+)?(name|learner(\s+name)?)\s*:?\s*$/i;
  function stripDuplicateName(root){
    Array.prototype.forEach.call(root.querySelectorAll(".learnerline"),function(n){
      if(n.parentNode) n.parentNode.removeChild(n);
    });
    var rows=root.querySelectorAll("div,tr,p");
    Array.prototype.forEach.call(rows,function(r){
      var first=r.firstElementChild;
      if(!first||r.children.length>3) return;
      if(NAMEKEY.test((first.textContent||"").trim())){
        if(r.parentNode) r.parentNode.removeChild(r);
      }
    });
  }

  function toolRecord(){
    var found=collect();
    if(!found.length){
      var btns=document.querySelectorAll("button");
      var hit=null;
      Array.prototype.forEach.call(btns,function(b){
        if(card.contains(b)||hit) return;
        var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
        if(/print/.test(t)) return;
        if(/^build submission sheet$/.test(t)) hit=b;
      });
      if(!hit){
        Array.prototype.forEach.call(btns,function(b){
          if(card.contains(b)||hit) return;
          var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
          if(/print/.test(t)) return;
          if(/build .*sheet|submission sheet|submit .*(map|answer|sheet|round|log)|^submit$/.test(t)) hit=b;
        });
      }
      if(hit){ try{ hit.click(); }catch(e){} }
      found=collect();
    }
    if(!found.length) return null;
    var wrap=document.createElement("div");
    found.forEach(function(s){
      var c=s.cloneNode(true);
      Array.prototype.forEach.call(c.querySelectorAll(".noprint, button"),function(n){
        if(n.parentNode) n.parentNode.removeChild(n);
      });
      stripDuplicateName(c);
      wrap.appendChild(c);
    });
    return wrap.innerHTML;
  }

  /* ---------- assemble the one sheet ---------- */
  function build(){
    var name=document.getElementById("lqName").value.trim();
    var coh=document.getElementById("lqCohort").value.trim();
    var dt=document.getElementById("lqDate").value.trim();
    var gaps=[];
    if(!name) gaps.push("Your name");
    if(!coh)  gaps.push("Cohort / section");

    var h=''
     +'<div class="lqsheet">'
     +'<h1>'+esc(LQ.lab)+' — '+esc(LQ.title)+'</h1>'
     +'<div class="lqmeta">UCI 2227 · Module 524 · '+esc(LQ.handout)
       +' · Set '+esc(setLetter())+' · submission sheet</div>'
     +'<h2>Learner</h2>'
     +'<div class="lqrow"><span class="k">Name</span><span class="v">'+(esc(name)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Cohort / section</span><span class="v">'+(esc(coh)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Date</span><span class="v">'+(esc(dt)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Scenario set</span><span class="v">'+esc(setLetter())+'</span></div>'
     +'<div class="lqrow"><span class="k">Built</span><span class="v">'
       +esc(new Date().toLocaleString())+'</span></div>';

    var rec=LQ.nosim?null:toolRecord();
    if(rec){ h+='<h2>Simulator record</h2>'+rec; }
    else if(!LQ.nosim){
      gaps.push("The simulator record — work through the lab tool above and press its own "
               +"“Build submission sheet” button before you build this PDF");
    }else{
      h+='<h2>Assessed on the floor</h2>'
        +'<div class="lqrow"><span class="k">Practical steps</span><span class="v">'
        +'Observed and signed off by the instructor against the handout. '
        +'The instructor signature below records that sign-off.</span></div>';
    }

    var curSec=null;
    qs.forEach(function(it,i){
      if(it.s!==curSec){ curSec=it.s; h+='<h2>'+esc(curSec||"Questions")+'</h2>'; }
      var ta=document.getElementById("lqQ"+i);
      var a=ta?ta.value.trim():"";
      var im=store["lqQ"+i+"_img"];
      if(!a&&!im) gaps.push("Q"+(i+1));
      h+='<div class="lqa"><div class="q"><span class="qn">Q'+(i+1)+'.</span>'+esc(it.p)+'</div>';
      if(im) h+='<img src="'+im+'" alt="Attachment for question '+(i+1)+'">';
      h+='<div class="a'+((!a&&!im)?" blank":"")+'">'+(a?esc(a):"— not answered —")+'</div></div>';
    });

    if(gaps.length){
      h+='<div class="lqgap"><b>Not yet filled in ('+gaps.length+'):</b> '+esc(gaps.join(", "))
        +'.<br>This is a completeness check, not a grade. Fill them in and build again, '
        +'or hand the sheet in as it stands and explain the gaps to your instructor.</div>';
    }else{
      h+='<div class="lqgap ok">'
        +'<b>Complete.</b> Every question on this sheet carries a response and the simulator record is attached.</div>';
    }

    h+='<div class="lqsign">Learner signature: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'Instructor verification: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'<span style="font-size:11px">Save this as a PDF and upload the single file to the '
      +esc(LQ.lab)+' assignment in Canvas.</span></div></div>';

    document.getElementById("lqOut").innerHTML=h;
    announce(gaps.length
      ? ("Submission sheet built. "+gaps.length+" item"+(gaps.length===1?"":"s")+" still blank: "+gaps.join(", ")+".")
      : "Submission sheet built. Every question carries a response.");
    return h;
  }

  document.getElementById("lqPreview").onclick=function(){
    build();
    var o=document.getElementById("lqOut");
    if(o&&o.scrollIntoView) o.scrollIntoView({behavior:"smooth",block:"start"});
  };

  /* ---------- the one PDF ---------- */
  function safeName(s){
    return String(s||"").normalize?String(s||"").normalize("NFKD").replace(/[^\w\s-]/g,"").trim()
      :String(s||"").replace(/[^\w\s-]/g,"").trim();
  }
  function fileTitle(){
    var n=safeName(document.getElementById("lqName").value).split(/\s+/).filter(Boolean);
    var last=n.length>1?n[n.length-1]:(n[0]||"Learner");
    var first=n.length>1?n.slice(0,-1).join("_"):"";
    var who=first?(last+"_"+first):last;
    return who+"_"+String(LQ.lab||"").replace(/[^\d.]/g,"");
  }

  document.getElementById("lqBuild").onclick=function(){
    var h=build();
    /* this lab's images are now inside a PDF the learner holds, so they become the
       first thing evicted when another lab needs room on the shared origin */
    store._done=true; save();

    var old=document.getElementById("lqPrint"); if(old) old.parentNode.removeChild(old);

    /* The sheet goes inside a one-cell table whose thead repeats on every printed
       page, so pages 2+ still carry the learner name, the lab and the set. */
    var runHead='<span class="r">'+esc(LQ.lab)+' · Set '+esc(setLetter())+'</span>'
      +esc(document.getElementById("lqName").value.trim()||"Name not entered")
      +' · '+esc(LQ.title);
    var pr=document.createElement("div"); pr.id="lqPrint";
    pr.innerHTML='<table class="lqpage"><thead class="lqrhead"><tr><td class="lqrh">'
      +runHead+'</td></tr></thead><tbody><tr><td class="lqbody">'+h+'</td></tr></tbody></table>';
    document.body.appendChild(pr);

    /* the browser suggests document.title as the Save-as-PDF filename */
    var prevTitle=document.title;
    document.title=fileTitle();
    document.body.classList.add("lq-print");

    var restored=false;
    var done=function(){
      if(restored) return; restored=true;
      document.body.classList.remove("lq-print");
      document.title=prevTitle;
      var a=document.getElementById("lqPrint"); if(a&&a.parentNode) a.parentNode.removeChild(a);
      window.removeEventListener("afterprint",done);
      if(mq&&mq.removeListener) mq.removeListener(mqHandler);
    };
    var mq=window.matchMedia?window.matchMedia("print"):null;
    var mqHandler=function(m){ if(!m.matches) done(); };
    if(mq&&mq.addListener) mq.addListener(mqHandler);
    window.addEventListener("afterprint",done);

    setTimeout(function(){
      window.print();
      /* generous fallback: mobile print sheets are asynchronous, and tearing the
         container out too early yields a blank PDF */
      setTimeout(done,60000);
    },80);
  };
})();
</script>
<!-- ===== end submission module ============================================= -->

</body>
</html>
