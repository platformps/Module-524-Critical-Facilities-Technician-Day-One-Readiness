<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLAB 524.3.2 — Thermal Envelope Audit — UCI 2227 (Training Simulator)</title>
<style>
  :root{
    --bg:#0b1620; --panel:#132433; --panel2:#0f1d29; --line:#4a7291;
    --ink:#dfeaf3; --dim:#8ba6bd; --faint:#7e9bb2;
    --blue:#33a6e8; --navy:#0079C0; --ice:#CFEBFC;
    --ok:#37c07a; --warn:#e8a33d; --stop:#e8604c;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
  button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:5px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:7px 13px}
  button:hover{background:#1b3044;border-color:#2d4d68}
  button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  button.primary:hover{background:#0a8bd8}
  button.danger{background:#4a1f1a;border-color:#6d3129;color:#ffb9ae}
  button:disabled{opacity:.4;cursor:not-allowed}
  select,input[type=text],input[type=number],textarea{
    font-family:inherit;font-size:13px;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:5px;padding:7px 9px}
  textarea{width:100%;resize:vertical;font-size:13px;line-height:1.45}
  h1,h2,h3{margin:0;font-weight:700}
  .mono{font-family:var(--mono)}

  /* ---------- shell ---------- */
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{font-weight:700;letter-spacing:.4px;font-size:14px}
  .brand span{color:var(--blue)}
  .sysname{color:var(--dim);font-size:12px;border-left:1px solid var(--line);padding-left:16px}
  .spacer{flex:1}
  .clock{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:1px}
  .clocklbl{color:var(--faint);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;text-align:right}
  .badge{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700;
    padding:4px 10px;border-radius:20px;background:#16324a;color:var(--blue);border:1px solid #23485f}
  .badge.run{background:#123a2a;color:var(--ok);border-color:#1d5b41}
  .badge.hold{background:#3d3220;color:var(--warn);border-color:#5c4c2e}

  main{flex:1;overflow:auto;padding:18px}
  .wrap{max-width:1500px;margin:0 auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin-bottom:14px}
  .card h3{font-size:15px;margin-bottom:4px}
  .card p{color:var(--dim);margin:0 0 14px;line-height:1.5;font-size:13px}
  .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);font-weight:700}
  .hint{font-size:12px;color:var(--faint);line-height:1.5;margin-top:10px}

  /* ---------- console ---------- */
  .toolbar{display:flex;gap:9px;align-items:center;padding:9px 18px;background:var(--panel2);
    border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1fr 1fr}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px}
  .tile .name{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:700}
  .tile .val{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1.15;margin-top:5px}
  .tile .unit{font-size:14px;color:var(--dim);font-weight:400;margin-left:3px}

  .tile.alarm{border-color:var(--stop);background:#2a1512}
  .tile.alarm .val{color:var(--stop)}

  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .chartbox h3{font-size:13px;margin-bottom:2px}

  canvas{display:block;width:100%;height:auto}

  /* ---------- alarms ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);

  th:hover{color:var(--blue)}
  td{padding:8px 10px;border-bottom:1px solid #182b3b;vertical-align:top}

  .sev.high{background:#4a3418;color:#ffc069}

  .tick{display:inline-block;width:15px;height:15px;border:1px solid var(--line);border-radius:3px;

  .tick.on{background:var(--blue);border-color:var(--blue)}
  .flt{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .flt .chip{font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);

  .cgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;font-family:var(--mono);font-size:10px}
  .cgrid .hd{color:var(--faint);text-align:center;padding:3px 0}
  .cgrid .rl{color:var(--dim);padding:3px 2px}
  .cell{border:1px solid var(--line);background:var(--panel2);border-radius:4px;height:24px;

  .cell:hover{border-color:#3f7099}

  .cell.minor{background:#2b2310;border-color:#5c4c2e;color:var(--warn)}

  .ilist{display:flex;flex-direction:column;gap:6px}

  .irow .nm{font-size:12.5px;flex:1}
  .irow .st{font-family:var(--mono);font-size:11px;min-width:132px;text-align:right;color:var(--faint)}
  .irow.ok{border-color:#1d5b41}

  .caution b{color:var(--warn)}
  .scale{display:flex;gap:0;margin-top:8px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .scale div{flex:1;height:15px}

    color:var(--faint);margin-top:3px}

  .auditrow td{font-size:12.5px}
  .ok{color:var(--ok)} .bad{color:var(--stop)} .warn{color:var(--warn)}
</style>

<body>
<div id="app">

  <header>
    <div class="brand">THERMAL ENVELOPE AUDIT</div>
    <div class="sysname">GLAB 524.3.2 &middot; UCI 2227 · objective 8 · <span id="setTag"></span> · TRAINING SIMULATOR — not connected to any live plant</div>
    <div class="spacer"></div>
    <div id="statusBadge" class="badge">Ready</div>
    <div>
      <div class="clocklbl">Site time</div>
      <div class="clock mono" id="clock">--:--:--</div>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <button id="btnCapture" class="primary">Capture readings</button>
    <button id="btnChart">ASHRAE chart</button>
    <button id="btnCont">Containment check</button>
    <button id="btnCam">Thermal camera</button>
    <button id="btnAudit">Audit form</button>
    <span class="spacer" style="flex:1"></span>
    <span class="counter" id="progress">0 / 36 inlets</span>
    <span class="counter" id="elapsed">T+00:00</span>
    <button id="btnRestart">Restart</button>
  </div>

  <main>
    <div class="wrap">
      <section id="labView"></section>
    </div>
  </main>
</div>


<script>
"use strict";
const SET = 2;   /* fixed for this file */
/* ============================================================
   UCI 2227 — GLAB 524.3.2 · Thermal Envelope Audit
   Standalone training console. Offline, no libraries, no network.
   Telemetry model and chart code are identical to the other lab tools.
   ============================================================ */

/* ---------- fixed scenario ---------- */
const SETLETTER="ABCDEFGH".charAt(SET);
const RUNKEY=(0x9E3779B1 ^ Math.imul(SET+1,2654435761))>>>0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry32(1);
function noise(amp){return (rnd()*2-1)*amp;}
function fmtClock(mins){
  const base=3*60+14; // scenarios run from 03:14 site time
  const total=base+mins;
  const h=Math.floor(total/60)%24, m=Math.floor(total%60), s=Math.floor((mins%1)*60);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtElapsed(mins){
  return "T+"+String(Math.floor(mins)).padStart(2,"0")+":"+String(Math.floor((mins%1)*60)).padStart(2,"0");
}
function drawChart(cv,cfg){
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cfg.height||150;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  const x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,W,H);
  const pad={l:46,r:10,t:10,b:20};
  const pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  const {min,max}=cfg;
  const sy=v=>pad.t+ph-((v-min)/(max-min))*ph;
  const sx=i=>pad.l+(i/Math.max(1,cfg.xmax))*pw;

  // alarm band shading
  if(cfg.band){
    x.fillStyle="rgba(232,96,76,.10)";
    if(cfg.band.hi<max) x.fillRect(pad.l,pad.t,pw,sy(cfg.band.hi)-pad.t);
    if(cfg.band.lo>min) x.fillRect(pad.l,sy(cfg.band.lo),pw,pad.t+ph-sy(cfg.band.lo));
  }
  // grid + y labels
  x.strokeStyle="#1d3346"; x.lineWidth=1; x.font="10px "+getComputedStyle(document.body).fontFamily;
  x.fillStyle="#5c7a92"; x.textAlign="right"; x.textBaseline="middle";
  for(let i=0;i<=4;i++){
    const v=min+(max-min)*i/4, yy=sy(v);
    x.beginPath(); x.moveTo(pad.l,yy); x.lineTo(W-pad.r,yy); x.stroke();
    x.fillText(cfg.fmt?cfg.fmt(v):v.toFixed(1),pad.l-6,yy);
  }
  // step markers
  if(cfg.steps) cfg.steps.forEach(s=>{
    if(s>cfg.xmax) return;
    x.strokeStyle="#25415a"; x.setLineDash([3,3]);
    x.beginPath(); x.moveTo(sx(s),pad.t); x.lineTo(sx(s),pad.t+ph); x.stroke(); x.setLineDash([]);
  });
  // series
  (cfg.series||[]).forEach(se=>{
    if(!se.data.length) return;
    x.strokeStyle=se.color; x.lineWidth=se.width||2; x.beginPath();
    se.data.forEach((v,i)=>{ const px=sx(i*(cfg.xstep||1)), py=sy(clamp(v,min,max));
      i?x.lineTo(px,py):x.moveTo(px,py); });
    x.stroke();
    // last point dot
    const li=se.data.length-1;
    x.fillStyle=se.color; x.beginPath();
    x.arc(sx(li*(cfg.xstep||1)),sy(clamp(se.data[li],min,max)),2.6,0,7); x.fill();
  });
  // x label
  x.fillStyle="#5c7a92"; x.textAlign="center"; x.textBaseline="top";
  x.fillText(cfg.xlabel||"minutes",pad.l+pw/2,H-13);
}
function tile(name,val,unit,band,cls){
  return `<div class="tile ${cls||''}"><div class="name">${name}</div>
    <div class="val">${val}<span class="unit">${unit||''}</span></div>
    <div class="band">${band||''}</div></div>`;
}

/* ---------- this lab ---------- */
const LAB={lab:"GLAB 524.3.2",obj:"objective 8",title:"Thermal Envelope Audit",duration:70};

const SCENARIOS=[
  {id:"T1",dbBase:22.0,rhBase:45,supply:19.0,ret:30.1},
  {id:"T2",dbBase:21.0,rhBase:52,supply:19.0,ret:23.3},
  {id:"T3",dbBase:23.0,rhBase:38,supply:19.0,ret:26.0}
];

const S={learner:"",t:0,timer:null,view:"cap",
  sel:0,readings:{},nz:[],hallDB:22.0,hallRH:45,dpSet:false,dpEntered:null,
  insp:{},cam:false,refuse:""};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
let V=SCENARIOS[SET];

const ELEV=[{k:0,h:"0.3 m",nm:"Bottom of rack — 0.3 m above finished floor"},
            {k:1,h:"1.1 m",nm:"Middle of rack — 1.1 m above finished floor"},
            {k:2,h:"1.8 m",nm:"Top of rack — 1.8 m above finished floor"}];
const REC={dbLo:18,dbHi:27,dpLo:-9,dpHi:15,rhHi:60};
const DESIGN={supply:19.0,ret:30.5,dt:11.5};

/* rack geometry — row A above the aisle, row B below, both facing into it.
   Position 1 is the west end, where the end-cap door is. */
const RACKS=[];
for(let i=0;i<12;i++){
  const row=i<6?"A":"B", pos=i<6?(i+1):(12-i);
  RACKS.push({i,id:"R-"+String(i+1).padStart(2,"0"),row,pos});
}
const RW=110,RG=8,X0=90,ROWA_Y=58,ROWB_Y=252,RH_=70,AIS_Y=136,AIS_H=112;
const px=pos=>X0+(pos-1)*(RW+RG);

/* ---------- psychrometrics ---------- */
/* Magnus formula, WMO coefficients b = 17.62, c = 243.12 °C.
   gamma = ln(RH/100) + bT/(c+T)   ·   dew point = c*gamma / (b - gamma) */
const MAG={b:17.62,c:243.12};
function dewPoint(T,RH){
  const g=Math.log(RH/100)+(MAG.b*T)/(MAG.c+T);
  return (MAG.c*g)/(MAG.b-g);
}
function dpAtRH(T,rh){return dewPoint(T,rh);}

/* ---------- model ---------- */
function inletTemp(i,e){
  const r=RACKS[i];
  const base=[18.9,19.4,20.1][e]+0.06*r.pos;
  let d=0;
  if(V.id==="T1"){
    if(r.id==="R-05"||r.id==="R-06") d=[0.4,4.3,9.6][e];
    else if(r.id==="R-04"||r.id==="R-07") d=[0.1,1.0,2.6][e];
  }else if(V.id==="T2"){
    d=[-0.3,-0.4,-0.6][e];
  }else if(V.id==="T3"){
    if(r.id==="R-01"||r.id==="R-12") d=[0.6,3.6,9.2][e];
    else if(r.id==="R-02"||r.id==="R-11") d=[0.2,0.9,2.2][e];
  }
  return base+d+(S.nz[i*3+e]||0);
}
function capturedCount(){return Object.keys(S.readings).length;}
function allCaptured(){return capturedCount()===36;}
function rackCaptured(i){let n=0;for(let e=0;e<3;e++) if(S.readings[i+"-"+e]!==undefined) n++;return n;}
function hottest(){
  let best=null;
  for(let i=0;i<12;i++) for(let e=0;e<3;e++){
    const v=inletTemp(i,e);
    if(!best||v>best.v) best={v,i,e};
  }
  return best;
}

      else if(V.id==="T1"&&g===1&&r.id==="R-06"){st="minor";txt="One panel loose but seated";}
      else if(V.id==="T3"&&g===1&&r.id==="R-02"){st="minor";txt="One panel loose but seated";}
      else if(V.id==="T2"&&g===0&&r.id==="R-09"){st="minor";txt="Panel fitted upside down, still sealing";}
      out.push({id:"BP-"+r.id+"-"+g,grp:"bp",row:i,col:g,nm:"Blanking panels — "+r.id+" "+["lower U1–U14","middle U15–U28","upper U29–U42"][g],st,txt});
    }
  }
  const gaps=[];
  for(let p=1;p<6;p++){
    gaps.push({id:"GAP-A"+p,nm:"Rack-to-rack gap — R-0"+p+" to R-0"+(p+1),

  }

    gaps.push({id:"GAP-B"+p,nm:"Rack-to-rack gap — "+a+" to "+b,st:"ok",txt:"Cabinets butted, side panels fitted"});

    st:V.id==="T3"?"bad":"ok",

  out.push({id:"DOOR-E",grp:"door",nm:"Containment door — east end cap",st:"ok",txt:"Closed, closer working, seals intact"});
  out.push({id:"CAP-W",grp:"cap",nm:"End-cap panel — west",st:"ok",txt:"Panel fixed, no light visible around frame"});
  out.push({id:"CAP-E",grp:"cap",nm:"End-cap panel — east",
    st:V.id==="T1"?"minor":"ok",
    txt:V.id==="T1"?"Frame seal lifting at one corner, no measurable flow":"Panel fixed, no light visible around frame"});
  for(let p=1;p<=6;p++){

      st:(V.id==="T2"&&p===5)?"minor":"ok",

  }
  return out;
}

function fcol(t){
  const stops=[[17,[16,48,95]],[20,[29,127,184]],[23,[49,176,122]],[26,[216,197,69]],[29,[224,138,46]],[33,[214,59,35]]];
  if(t<=stops[0][0]) return "rgb("+stops[0][1].join(",")+")";
  for(let i=1;i<stops.length;i++){
    if(t<=stops[i][0]){
      const a=stops[i-1],b=stops[i],f=(t-a[0])/(b[0]-a[0]);
      const c=[0,1,2].map(k=>Math.round(a[1][k]+(b[1][k]-a[1][k])*f));
      return "rgb("+c.join(",")+")";
    }
  }
  return "rgb("+stops[stops.length-1][1].join(",")+")";
}

/* ---------- ASHRAE TC 9.9 chart ---------- */
function drawAshrae(cv){
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=380;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,W,H);
  const pad={l:52,r:14,t:16,b:44};
  const pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  const XMIN=2,XMAX=48,YMIN=-16,YMAX=26;
  const X=v=>pad.l+((v-XMIN)/(XMAX-XMIN))*pw;
  const Y=v=>pad.t+ph-((v-YMIN)/(YMAX-YMIN))*ph;

  // allowable classes A4 -> A1, drawn widest first
  const cls=[{n:"A4",x0:5,x1:45,y0:-12,y1:24,f:"rgba(51,166,232,.05)",s:"#1c3d55"},
             {n:"A3",x0:5,x1:40,y0:-12,y1:24,f:"rgba(51,166,232,.06)",s:"#215073"},
             {n:"A2",x0:10,x1:35,y0:-12,y1:21,f:"rgba(51,166,232,.07)",s:"#2a6790"},
             {n:"A1",x0:15,x1:32,y0:-12,y1:17,f:"rgba(51,166,232,.09)",s:"#3480ad"}];
  c.font="10px "+getComputedStyle(document.body).fontFamily;
  cls.forEach(k=>{
    c.fillStyle=k.f; c.strokeStyle=k.s; c.lineWidth=1;
    c.fillRect(X(k.x0),Y(k.y1),X(k.x1)-X(k.x0),Y(k.y0)-Y(k.y1));
    c.strokeRect(X(k.x0),Y(k.y1),X(k.x1)-X(k.x0),Y(k.y0)-Y(k.y1));
    c.fillStyle=k.s; c.textAlign="left"; c.textBaseline="top";
    c.fillText("Allowable "+k.n,X(k.x0)+4,Y(k.y1)+3);
  });

  // recommended envelope: 18-27 °C dry-bulb, -9 °C dew point up to
  // the lesser of 15 °C dew point and the 60% relative humidity line
  c.beginPath();
  c.moveTo(X(REC.dbLo),Y(REC.dpLo));
  c.lineTo(X(REC.dbHi),Y(REC.dpLo));
  for(let t=REC.dbHi;t>=REC.dbLo-0.001;t-=0.5)
    c.lineTo(X(t),Y(Math.min(REC.dpHi,dpAtRH(t,REC.rhHi))));
  c.closePath();
  c.fillStyle="rgba(55,192,122,.16)"; c.fill();
  c.strokeStyle="#37c07a"; c.lineWidth=1.8; c.stroke();
  c.fillStyle="#37c07a"; c.textAlign="center"; c.textBaseline="middle";
  c.fillText("RECOMMENDED",X(22.5),Y(3));

  // 60% relative humidity curve
  c.strokeStyle="#5c7a92"; c.lineWidth=1; c.setLineDash([4,3]); c.beginPath();
  for(let t=XMIN;t<=XMAX;t+=0.5){
    const y=dpAtRH(t,REC.rhHi);
    if(t===XMIN) c.moveTo(X(t),Y(y)); else c.lineTo(X(t),Y(y));
  }
  c.stroke(); c.setLineDash([]);
  c.fillStyle="#5c7a92"; c.textAlign="left";
  c.fillText("60% relative humidity",X(37),Y(dpAtRH(38,60))-9);

  // axes
  c.strokeStyle="#1d3346"; c.lineWidth=1;
  c.textAlign="right"; c.textBaseline="middle"; c.fillStyle="#5c7a92";
  for(let v=-15;v<=25;v+=5){
    c.beginPath(); c.moveTo(pad.l,Y(v)); c.lineTo(W-pad.r,Y(v)); c.stroke();
    c.fillText(v.toFixed(0),pad.l-6,Y(v));
  }
  c.textAlign="center"; c.textBaseline="top";
  for(let v=5;v<=45;v+=5){
    c.beginPath(); c.moveTo(X(v),pad.t); c.lineTo(X(v),pad.t+ph); c.strokeStyle="#16283a"; c.stroke();
    c.fillStyle="#5c7a92"; c.fillText(v.toFixed(0),X(v),pad.t+ph+5);
  }
  c.fillStyle="#8ba6bd";
  c.fillText("Dry-bulb temperature at the equipment air inlet (°C)",pad.l+pw/2,H-17);
  c.save(); c.translate(13,pad.t+ph/2); c.rotate(-Math.PI/2);
  c.textAlign="center"; c.textBaseline="middle"; c.fillText("Dew point (°C)",0,0); c.restore();

  // plotted points
  if(S.dpSet){
    const dp=S.dpEntered;
    let out=0;
    Object.keys(S.readings).forEach(k=>{
      const v=S.readings[k];
      const bad=v>REC.dbHi||v<REC.dbLo||dp>REC.dpHi||dp<REC.dpLo;
      if(bad) out++;
      c.beginPath(); c.arc(X(v),Y(dp),3.4,0,7);
      c.fillStyle=bad?"rgba(232,96,76,.95)":"rgba(51,166,232,.85)"; c.fill();
      if(bad){c.strokeStyle="#ff8f7d"; c.lineWidth=1.4; c.beginPath(); c.arc(X(v),Y(dp),6.5,0,7); c.stroke();}
    });
    c.fillStyle="#8ba6bd"; c.textAlign="left"; c.textBaseline="top";
    c.fillText(Object.keys(S.readings).length+" inlet readings plotted at the dew point you entered · "+out+" outside the recommended envelope",pad.l+4,pad.t+2);
  }else{
    c.fillStyle="#e8a33d"; c.textAlign="left"; c.textBaseline="top";
    c.fillText("Enter the dew point on the capture screen before the readings can be plotted.",pad.l+4,pad.t+2);
  }
}

}

      from adjacent metalwork, and the door perforation all change the reading. Use the camera to decide where to point the probe and to
      confirm a probe reading you already have. Never use it to replace one, and never put a camera reading on the ASHRAE chart.

    <div class="planbox">

function renderAudit(){
  const el=$("labView");
  const dp=S.dpSet?S.dpEntered:null;
  const dt=hallDT();
  const rows=[];
  rows.push(["Hall dry-bulb, aisle reference",S.hallDB.toFixed(1)+" °C","18.0 – 27.0 °C",S.hallDB>=18&&S.hallDB<=27?"in range":"out of range"]);
  rows.push(["Hall relative humidity",S.hallRH.toFixed(1)+" %","up to 60 %",S.hallRH<=60?"in range":"out of range"]);
  rows.push(["Dew point, as you entered it",dp===null?"not entered":dp.toFixed(1)+" °C","−9.0 to 15.0 °C",
    dp===null?"not entered":(dp>=-9&&dp<=15?"in range":"out of range")]);
  rows.push(["CRAH supply air",V.supply.toFixed(1)+" °C","design 19.0 °C","in range"]);
  rows.push(["CRAH return air",V.ret.toFixed(1)+" °C","design 30.5 °C",V.ret<26.5?"out of range":"in range"]);
  rows.push(["Hall delta T",dt.toFixed(1)+" K","design 11.5 K",dt<9?"out of range":"in range"]);
  const capt=Object.keys(S.readings);
  const above=capt.filter(k=>S.readings[k]>REC.dbHi);
  rows.push(["Inlet readings captured",capt.length+" of 36","36 required",capt.length===36?"complete":"incomplete"]);
  rows.push(["Captured inlet readings above 27.0 °C",String(above.length),"limit 27.0 °C",above.length?"out of range":"in range"]);
  const worst=above.map(k=>{const p=k.split("-");return RACKS[+p[0]].id+" at "+ELEV[+p[1]].h+" — "+S.readings[k].toFixed(1)+" °C";});

  el.innerHTML=`
    <div class="planbox" style="margin-bottom:14px">
      <h3>Thermal envelope audit — Hall B cold aisle</h3>
      <div class="sub">Learner: ${esc(S.learner)||"—"} · site time ${fmtClock(S.t)} · ASHRAE TC 9.9 recommended envelope, measured at the equipment air inlet.</div>
      <table>
        <tr><th>Parameter</th><th>Measured</th><th>Limit</th><th>Assessment</th></tr>
        ${rows.map(r=>'<tr class="auditrow"><td>'+r[0]+"</td><td class=\"mono\">"+r[1]+'</td><td class="mono">'+r[2]+
          '</td><td class="'+(/out of range|incomplete|not calculated/.test(r[3])?"bad":"ok")+'">'+r[3]+"</td></tr>").join("")}
      </table>
      ${worst.length?'<div class="note" style="margin-top:10px"><b>Captured readings above the 27.0 °C recommended upper limit:</b><br>'+worst.join("<br>")+"</div>"
        :'<div class="note" style="margin-top:10px">No captured inlet reading exceeds the 27.0 °C recommended upper limit.</div>'}
    </div>

    <div class="submit">
      <h3>Your audit findings</h3>
      <div class="sub">Fill this in from your own survey. Every entry is recorded on the submission sheet exactly as you write it.</div>
      <div class="fld" style="margin-bottom:12px"><label>Your name</label><input type="text" id="learnerName" placeholder="First and last" style="max-width:340px" value="${esc(S.learner)}"></div>
      <div class="fgrid">
        <div class="fld"><label>Inlet readings above the recommended upper limit of 27.0 °C</label>
          <input type="number" id="ansAbove" step="1" min="0" placeholder="count"></div>
        <div class="fld"><label>Hall delta T against design</label>
          <select id="ansDt">
            <option value="">— choose —</option>
            <option value="within">Within design, 10 to 13 K</option>
            <option value="reduced">Reduced — below design</option>
            <option value="elevated">Elevated — above design</option>
          </select></div>
      </div>
      <div class="fgrid">
        <div class="fld"><label>Containment leakage point</label>
          <select id="ansLoc"><option value="">— choose —</option>
            ${LOCOPTS.map(k=>'<option value="'+k+'">'+LOCNAME[k]+"</option>").join("")}</select></div>
        <div class="fld"><label>Classification of the breach</label>
          <select id="ansCls"><option value="">— choose —</option>
            <option value="bypass">Bypass — cold supply air returns to the cooling unit without passing through equipment</option>
            <option value="recirculation">Recirculation — hot exhaust re-enters the cold aisle and is drawn back into inlets</option>
            <option value="both">Both mechanisms at the same opening</option>
          </select></div>
      </div>
      <div class="fld" style="margin-bottom:12px">
        <label>Your evidence — quote the readings that force this classification</label>
        <textarea id="ansEv" rows="3" placeholder="Quote the readings that force your classification: which racks and elevations, what the hall figures do, and what the containment inspection found."></textarea>
      </div>
      <div class="fld" style="margin-bottom:12px">
        <label>Recommended action</label>
        <textarea id="ansAct" rows="2" placeholder="What is to be done, by whom, and what is re-measured afterwards."></textarea>
      </div>
      <div class="row noprint">
        <button class="primary" id="btnSubmit">Build submission sheet</button>
        <button id="btnPrintAudit">Print audit form</button>
      </div>
      <div class="result" id="auditResult"></div>
    </div>`;
  $("btnSubmit").onclick=buildSheet;
  {const _n=$("learnerName"); if(_n) _n.oninput=()=>{S.learner=_n.value.trim();};}
  $("btnPrintAudit").onclick=()=>window.print();
}

function srow(k,v){ return '<div class="srow"><div class="sk">'+k+'</div><div class="sv">'+v+'</div></div>'; }
function buildSheet(){
  {const _n=$("learnerName"); if(_n) S.learner=_n.value.trim();}
  const above=$("ansAbove").value.trim(), dtA=$("ansDt").value, loc=$("ansLoc").value, cl=$("ansCls").value;
  const ev=$("ansEv").value.trim(), act=$("ansAct").value.trim();
  const dtNames={within:"Within design, 10 to 13 K",reduced:"Reduced — below design",elevated:"Elevated — above design"};
  const clNames={bypass:"Bypass — cold supply air returns to the cooling unit without passing through equipment",
                 recirculation:"Recirculation — hot exhaust re-enters the cold aisle and is drawn back into inlets",
                 both:"Both mechanisms at the same opening"};
  const missing=[];
  if(!allCaptured()) missing.push(capturedCount()+" of 36 inlet readings captured");
  if(!S.dpSet) missing.push("dew point");
  if(above==="") missing.push("count of readings above the recommended upper limit");
  if(!dtA) missing.push("hall delta T assessment");
  if(!loc) missing.push("containment leakage point");
  if(!cl) missing.push("classification");
  if(!ev) missing.push("evidence");
  if(!act) missing.push("recommended action");
  if(!Object.keys(S.insp).length) missing.push("no containment items inspected");
  if(!S.learner) missing.push("your name");

  let h='<div class="sheet"><h4>'+LAB.lab+" \u2014 "+LAB.title+" \u00b7 Set "+SETLETTER+'</h4>';
  h+='<div class="learnerline"><b>Name:</b> '+(esc(S.learner)||"\u2014")+'</div>';
  h+=srow("Learner",esc(S.learner)||"&mdash;");
  h+=srow("Set",SETLETTER);
  h+=srow("Completed",stamp());
  h+=srow("Elapsed on the survey",fmtElapsed(S.t));

  h+='<h4>Rack inlet survey — all thirty-six readings</h4>';
  h+='<table><thead><tr><th style="cursor:default">Rack</th>'+
     ELEV.map(e=>'<th style="cursor:default">'+e.h+'</th>').join("")+'</tr></thead><tbody>';
  for(let i=0;i<12;i++){
    const cells=ELEV.map(e=>{
      const v=S.readings[i+"-"+e.k];
      return '<td class="mono">'+(v===undefined?"not captured":v.toFixed(1)+" \u00b0C")+'</td>';
    }).join("");
    h+='<tr><td class="mono">'+RACKS[i].id+'</td>'+cells+'</tr>';
  }
  h+='</tbody></table>';
  h+='<div class="note" style="margin-top:6px">'+capturedCount()+' of 36 inlet readings captured.</div>';

  h+='<h4>Hall conditions and moisture</h4>';
  h+=srow("Hall dry-bulb, aisle reference",S.hallDB.toFixed(1)+" \u00b0C");
  h+=srow("Hall relative humidity",S.hallRH.toFixed(1)+" %");
  h+=srow("Dew point, as you entered it",S.dpSet?S.dpEntered.toFixed(1)+" \u00b0C":"not entered");
  h+=srow("CRAH supply / return",V.supply.toFixed(1)+" / "+V.ret.toFixed(1)+" \u00b0C");
  h+=srow("Hall delta T",hallDT().toFixed(1)+" K");

  h+='<h4>Containment inspection — items you inspected</h4>';
  const done=ITEMS.filter(o=>S.insp[o.id]);
  h+=done.length
    ? done.map(o=>srow(esc(o.nm),({ok:"SOUND",minor:"MINOR",bad:"DEFECT"})[o.st]+" \u2014 "+esc(o.txt))).join("")
    : srow("Inspection","no items inspected");
  h+='<div class="note" style="margin-top:6px">'+done.length+' of '+ITEMS.length+' containment items inspected.</div>';

  h+='<h4>Your audit findings</h4>';
  h+=srow("Inlet readings above 27.0 \u00b0C, as recorded",above===""?"not recorded":esc(above));
  h+=srow("Hall delta T against design",dtA?dtNames[dtA]:"not recorded");
  h+=srow("Containment leakage point",loc?esc(LOCNAME[loc]):"not recorded");
  h+=srow("Classification of the breach",cl?clNames[cl]:"not recorded");
  h+=srow("Evidence",esc(ev)||"not recorded");
  h+=srow("Recommended action",esc(act)||"not recorded");

  if(missing.length)
    h+='<div class="note" style="margin-top:12px"><b>Not yet filled in:</b> '+missing.join("; ")+
       ". This is a completeness check only \u2014 it says nothing about what you have written.</div>";
  h+='<div class="note" style="margin-top:12px">Check every field before printing. Hand this sheet to your instructor with your worksheet.</div>';
  h+='<div class="row noprint" style="margin-top:12px"><button id="btnPrintSheet">Print submission sheet</button></div></div>';
  const r=$("auditResult");
  r.className="result show";
  r.innerHTML=h;
  $("btnPrintSheet").onclick=()=>window.print();
}

/* ---------- run loop ---------- */
function updateProgress(){
  const p=$("progress"); if(p) p.textContent=capturedCount()+" / 36 inlets";
}
function render(){
  $("clock").textContent=fmtClock(S.t);
  $("elapsed").textContent=fmtElapsed(S.t);
  $("labView").onclick=null;
  if(S.view==="cap") renderCapture();
  else if(S.view==="chart") renderChartView();
  else if(S.view==="cont") renderCont();
  else if(S.view==="cam") renderCam();
  else renderAudit();
  updateProgress();
  const bd=$("statusBadge");
  if(allCaptured()&&S.dpSet){bd.textContent="Survey complete";bd.className="badge run";}
  else{bd.textContent="Survey in progress";bd.className="badge";}
}
function tick(){
  S.t=Math.min(LAB.duration,S.t+1/60);
  $("clock").textContent=fmtClock(S.t);
  $("elapsed").textContent=fmtElapsed(S.t);
  if(S.t>=LAB.duration&&S.timer){clearInterval(S.timer);S.timer=null;}
}
function startClock(){
  if(S.timer) clearInterval(S.timer);
  S.timer=setInterval(tick,1000);
}
function stopClock(){ if(S.timer){clearInterval(S.timer);S.timer=null;} }
function resetRun(){
  rnd=mulberry32(RUNKEY);
  S.t=0; S.readings={}; S.insp={}; S.sel=0; S.dpSet=false; S.dpEntered=null; S.cam=false; S.refuse="";
  S.hallDB=+(V.dbBase+noise(0.3)).toFixed(1);
  S.hallRH=+(V.rhBase+noise(1.5)).toFixed(1);
  S.nz=[]; for(let i=0;i<36;i++) S.nz.push(noise(0.3));
  ITEMS=inspItems();
  S.view="cap"; setToolbar();
  startClock(); render();
}

/* ---------- setup / nav ---------- */
function setToolbar(){
  const map={cap:"btnCapture",chart:"btnChart",cont:"btnCont",cam:"btnCam",audit:"btnAudit"};
  Object.keys(map).forEach(k=>{
    const b=$(map[k]); b.className=(k===S.view?"primary":"");
  });
}
function go(v){ S.view=v; setToolbar(); render(); }

/* ---------- wiring ---------- */
$("btnCapture").onclick=()=>go("cap");
$("btnChart").onclick=()=>go("chart");
$("btnCont").onclick=()=>go("cont");
$("btnCam").onclick=()=>go("cam");
$("btnAudit").onclick=()=>go("audit");
$("btnRestart").onclick=()=>{S.learner="";resetRun();};
window.addEventListener("resize",()=>{
  if(S.view==="chart") renderChartView();
});

/* ---------- boot ---------- */
$("setTag").textContent="Set "+SETLETTER;
S.hallDB=V.dbBase; S.hallRH=V.rhBase;
resetRun();
</script>

      page-break-after:avoid;break-after:avoid}

      page-break-inside:avoid;break-inside:avoid}

</style>
<script id="lqScript">
(function(){
  if(window.__lqLoaded) return; window.__lqLoaded=true;

  var esc=function(s){return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};

  var KEY="uci2227:"+LQ.file;
  var store={}, storageBroken=false;
  try{ store=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ store={}; }

  /* ---------- cross-lab storage budget ----------
     Every lab in the module is served from one origin, so all 43 share a single
     ~5 MB localStorage budget. Seventeen image questions at ~325 KB apiece is 5.4 MB
     — a learner working through the whole module on one browser profile would run out
     near the end. Images belonging to OTHER labs are evicted when room is needed,
     oldest and already-exported first. Text answers are never evicted: they are tiny,
     and they are the part a learner cannot reproduce. An evicted image is already
     inside the submission PDF that lab produced. */
  function otherLabKeys(){
    var out=[];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf("uci2227:")===0&&k!==KEY) out.push(k);
      }
    }catch(e){}
    return out;
  }
  function evictOtherImages(target){
    /* returns bytes freed. Prefers labs whose PDF has already been built, then oldest. */
    var recs=[];
    otherLabKeys().forEach(function(k){
      var raw,obj;
      try{ raw=localStorage.getItem(k)||"{}"; obj=JSON.parse(raw); }catch(e){ return; }
      var imgBytes=0;
      for(var f in obj) if(/_img$/.test(f)) imgBytes+=String(obj[f]).length;
      if(imgBytes>0) recs.push({k:k,obj:obj,bytes:imgBytes,ts:obj._ts||0,done:obj._done?1:0});
    });
    recs.sort(function(a,b){ return (b.done-a.done)||(a.ts-b.ts); });
    var freed=0;
    for(var i=0;i<recs.length&&freed<target;i++){
      var r=recs[i];
      for(var f in r.obj) if(/_img$/.test(f)) delete r.obj[f];
      r.obj._evicted=true;
      try{ localStorage.setItem(r.k,JSON.stringify(r.obj)); freed+=r.bytes; }catch(e){}
    }
    return freed;
  }

  function save(){
    store._ts=Date.now();
    var payload;
    try{ payload=JSON.stringify(store); }catch(e){ return false; }
    try{
      localStorage.setItem(KEY,payload);
      if(storageBroken){ storageBroken=false; showStoreErr(null); }
      return true;
    }catch(e){
      /* make room from other labs, then try once more */
      if(evictOtherImages(payload.length+200000)>0){
        try{
          localStorage.setItem(KEY,payload);
          if(storageBroken){ storageBroken=false; showStoreErr(null); }
          return true;
        }catch(e2){}
      }
      storageBroken=true;
      showStoreErr(e);
      return false;
    }
  }
  function showStoreErr(e){
    var b=document.getElementById("lqStoreErr");
    if(!b) return;
    if(!e){ b.style.display="none"; return; }
    b.style.display="block";
    b.innerHTML='<b>Your work is no longer being saved in this browser.</b><br>'
      +'Storage is full or switched off — usually private browsing, or a great many images '
      +'attached across the labs on this machine. Everything on screen is intact and the '
      +'submission PDF will still build correctly — but <b>do not refresh or close this tab</b>. '
      +'Press <b>Build submission PDF</b> now and save the file. '
      +'Then press <b>Clear my responses</b> to free the space up for the next lab.';
    if(b.scrollIntoView) b.scrollIntoView({block:"nearest"});
  }

  function announce(msg){
    var s=document.getElementById("lqStatus");
    if(s){ s.textContent=""; setTimeout(function(){ s.textContent=msg; },30); }
  }

  /* ---------- detect the set letter the tool is running ---------- */
  function setLetter(){
    try{ if(typeof SETLETTER!=="undefined"&&SETLETTER) return SETLETTER; }catch(e){}
    var tag=document.getElementById("setTag");
    if(tag&&tag.textContent){
      var m=tag.textContent.match(/set\s+([A-H])/i); if(m) return m[1].toUpperCase();
    }
    var m2=(LQ.file||"").match(/524-\d-\d-([A-H])_/); if(m2) return m2[1];
    return LQ.set||"—";
  }

  /* ---------- downscale an image before it goes anywhere near storage ----------
     A phone photo is 2-5 MB and base64 inflates it by a third; localStorage is
     about 5 MB for the whole origin. Downscaling to 1600px JPEG brings a typical
     capture under 400 KB, which is still far more detail than the PDF can show. */
  var MAXPX=1600, JPEGQ=0.82;
  function downscale(file,cb){
    var rd=new FileReader();
    rd.onerror=function(){ cb(null,"The browser could not read that file."); };
    rd.onload=function(){
      var img=new Image();
      img.onerror=function(){ cb(null,"That file does not look like an image the browser can open."); };
      img.onload=function(){
        try{
          var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
          if(!w||!h){ cb(rd.result,null); return; }
          var sc=Math.min(1,MAXPX/Math.max(w,h));
          if(sc>=1&&rd.result.length<600000){ cb(rd.result,null); return; }
          var cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
          var c=document.createElement("canvas"); c.width=cw; c.height=ch;
          var x=c.getContext("2d");
          x.fillStyle="#fff"; x.fillRect(0,0,cw,ch);
          x.drawImage(img,0,0,cw,ch);
          cb(c.toDataURL("image/jpeg",JPEGQ),null);
        }catch(err){ cb(rd.result,null); }
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  }

  /* ---------- build the card ---------- */
  var host=document.querySelector("main .wrap")||document.querySelector("main")||document.body;
  var card=document.createElement("section");
  card.id="lqCard";
  card.setAttribute("aria-labelledby","lqCardTitle");

  var qs=LQ.items, secs=[], cur=null;
  qs.forEach(function(it,i){
    if(!cur||cur.name!==it.s){ cur={name:it.s,list:[]}; secs.push(cur); }
    cur.list.push({i:i,it:it});
  });

  var html=""
   +'<h2 id="lqCardTitle">Lab submission — questions and responses</h2>'
   +'<p class="lqsub">Every question from the <b>'+esc(LQ.handout)+'</b> handout is answered here, not on paper. '
   +'Your responses, together with the record this simulator builds, print to a <b>single PDF</b> that you upload to Canvas. '
   +'Your work is kept in this browser as you type, so a refresh will not lose it.</p>'
   +'<div id="lqStoreErr" role="alert"></div>'
   +'<p id="lqStatus" class="lqvh" role="status" aria-live="polite"></p>'
   +'<div class="lqid">'
   +'<div class="lqfld" style="flex:1 1 260px"><label for="lqName">Your name</label>'
     +'<input type="text" id="lqName" autocomplete="name" placeholder="First and last" value="'+esc(store.name||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 180px"><label for="lqCohort">Cohort / section</label>'
     +'<input type="text" id="lqCohort" placeholder="e.g. UCI 2227-01" value="'+esc(store.cohort||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 150px"><label for="lqDate">Date</label>'
     +'<input type="text" id="lqDate" value="'+esc(store.date||new Date().toLocaleDateString())+'"></div>'
   +'</div>';

  secs.forEach(function(sec,si){
    html+='<h3 class="lqsec" id="lqSec'+si+'">'+esc(sec.name||"Questions")+'</h3>';
    sec.list.forEach(function(o){
      var id="lqQ"+o.i, n=o.i+1;
      html+='<div class="lqq">';
      if(o.it.k==="image"){
        html+='<p class="lqp"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</p>'
             +'<div class="lqimgwrap">'
             +'<label class="lqfilelbl" for="'+id+'_f">Attach your image for question '+n+'</label>'
             +'<input type="file" accept="image/*" id="'+id+'_f">'
             +'<p class="lqnote" style="margin:5px 0 0">A photo or screenshot. It is resized and '
             +'embedded in the PDF you hand in.</p>'
             +'<img id="'+id+'_img" alt="Your attached image for question '+n+'" style="display:none">'
             +'<label class="lqfilelbl" for="'+id+'" style="margin-top:8px">Caption or note for question '+n+'</label>'
             +'<textarea id="'+id+'" rows="2" placeholder="Add any caption or note that goes with the image.">'
             +esc(store[id]||"")+'</textarea></div>';
      }else{
        html+='<label class="lqp" for="'+id+'"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</label>'
             +'<textarea id="'+id+'" rows="3" placeholder="Type your answer here.">'+esc(store[id]||"")+'</textarea>';
      }
      html+='</div>';
    });
  });

  html+='<div class="lqbtns">'
    +'<button type="button" class="lqprimary" id="lqBuild">Build submission PDF</button>'
    +'<button type="button" id="lqPreview">Preview without printing</button>'
    +'<button type="button" id="lqClear">Clear my responses</button>'
    +'<span class="lqnote">The PDF carries every question, your responses and the simulator record. One file, one upload.</span>'
    +'</div><div id="lqOut" role="region" aria-label="Submission sheet preview"></div>';

  card.innerHTML=html;
  host.appendChild(card);

  /* ---------- wiring ---------- */
  ["lqName","lqCohort","lqDate"].forEach(function(id){
    var el=document.getElementById(id);
    el.oninput=function(){ store[id.replace("lq","").toLowerCase()]=el.value; save(); };
  });
  /* The date box is pre-filled with today, but nothing wrote that back to
     storage, so a learner who started yesterday and reopened the tab today saw
     the field silently move to today's date. Persist the default on first sight. */
  if(!store.date){ store.date=document.getElementById("lqDate").value; save(); }
  qs.forEach(function(it,i){
    var id="lqQ"+i, ta=document.getElementById(id);
    if(ta) ta.oninput=function(){ store[id]=ta.value; save(); };
    var f=document.getElementById(id+"_f");
    if(f) f.onchange=function(){
      var file=f.files&&f.files[0]; if(!file) return;
      announce("Processing your image for question "+(i+1)+".");
      downscale(file,function(dataUrl,err){
        if(err){ announce(err); alert(err); return; }
        var img=document.getElementById(id+"_img");
        img.src=dataUrl; img.style.display="block";
        store[id+"_img"]=dataUrl;
        var okSave=save();
        announce("Image attached to question "+(i+1)+
          (okSave?"." : ", but it could not be saved in this browser. Build your PDF now."));
      });
    };
    if(store[id+"_img"]){
      var im0=document.getElementById(id+"_img");
      if(im0){ im0.src=store[id+"_img"]; im0.style.display="block"; }
    }
  });

  /* an image of this lab was evicted to make room for another lab on the shared
     origin, and this lab had not yet been exported — say so plainly */
  if(store._evicted&&!store._done){
    var eb=document.getElementById("lqStoreErr");
    eb.style.display="block";
    eb.innerHTML='<b>An image you attached is no longer stored.</b><br>'
      +'This browser ran out of room across all the labs on this machine and dropped it. '
      +'Your typed answers are all still here — only the image went. '
      +'Attach it again before you build your submission PDF.';
    delete store._evicted; save();
  }

  document.getElementById("lqClear").onclick=function(){
    if(!confirm("Clear every response you have typed in this lab? This cannot be undone.")) return;
    store={}; save();
    qs.forEach(function(it,i){
      var ta=document.getElementById("lqQ"+i); if(ta) ta.value="";
      var im=document.getElementById("lqQ"+i+"_img"); if(im){ im.removeAttribute("src"); im.style.display="none"; }
      var fi=document.getElementById("lqQ"+i+"_f"); if(fi) fi.value="";
    });
    document.getElementById("lqOut").innerHTML="";
    announce("All responses cleared.");
  };

  /* ---------- guard the simulator's Restart button ----------
     Restart wipes the simulator record but not the responses typed here, which
     would leave a submission whose prose describes a record that no longer exists.
     A capture-phase listener runs ahead of the tool's own onclick, so one confirm
     covers every variant of the handler. */
  (function(){
    var rb=document.getElementById("btnRestart")||document.getElementById("btnReset");
    if(!rb||card.contains(rb)) return;
    rb.addEventListener("click",function(ev){
      if(rb.dataset.lqOk==="1"){ rb.dataset.lqOk=""; return; }
      ev.preventDefault(); ev.stopImmediatePropagation();
      var ok=confirm(
        "Restart the scenario?\n\n"+
        "Everything you recorded in the simulator — readings, marks, logs, the "+
        "submission sheet it built — is wiped and the run starts again.\n\n"+
        "The answers you typed in the submission panel lower down are KEPT. If they "+
        "describe readings you are about to erase, build your submission PDF first.");
      if(ok){ rb.dataset.lqOk="1"; rb.click(); }
    },true);
  })();

  /* ---------- harvest the simulator's own record ---------- */
  var REC_SEL=".sheet, .result.show";
  function collect(){
    var raw=[];
    Array.prototype.forEach.call(document.querySelectorAll(REC_SEL),function(s){
      if(card.contains(s)) return;
      if(!s.textContent.replace(/\s/g,"")) return;
      raw.push(s);
    });
    return raw.filter(function(s){
      return !raw.some(function(o){ return o!==s && o.contains(s); });
    });
  }

  /* the module already prints the learner name in its own Learner block, and every
     simulator sheet prints it again — four of them twice. Strip it from the clone. */
  var NAMEKEY=/^(your\s+)?(name|learner(\s+name)?)\s*:?\s*$/i;
  function stripDuplicateName(root){
    Array.prototype.forEach.call(root.querySelectorAll(".learnerline"),function(n){
      if(n.parentNode) n.parentNode.removeChild(n);
    });
    var rows=root.querySelectorAll("div,tr,p");
    Array.prototype.forEach.call(rows,function(r){
      var first=r.firstElementChild;
      if(!first||r.children.length>3) return;
      if(NAMEKEY.test((first.textContent||"").trim())){
        if(r.parentNode) r.parentNode.removeChild(r);
      }
    });
  }

  function toolRecord(){
    var found=collect();
    if(!found.length){
      var btns=document.querySelectorAll("button");
      var hit=null;
      Array.prototype.forEach.call(btns,function(b){
        if(card.contains(b)||hit) return;
        var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
        if(/print/.test(t)) return;
        if(/^build submission sheet$/.test(t)) hit=b;
      });
      if(!hit){
        Array.prototype.forEach.call(btns,function(b){
          if(card.contains(b)||hit) return;
          var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
          if(/print/.test(t)) return;
          if(/build .*sheet|submission sheet|submit .*(map|answer|sheet|round|log)|^submit$/.test(t)) hit=b;
        });
      }
      if(hit){ try{ hit.click(); }catch(e){} }
      found=collect();
    }
    if(!found.length) return null;
    var wrap=document.createElement("div");
    found.forEach(function(s){
      var c=s.cloneNode(true);
      Array.prototype.forEach.call(c.querySelectorAll(".noprint, button"),function(n){
        if(n.parentNode) n.parentNode.removeChild(n);
      });
      stripDuplicateName(c);
      wrap.appendChild(c);
    });
    return wrap.innerHTML;
  }

  /* ---------- assemble the one sheet ---------- */
  function build(){
    var name=document.getElementById("lqName").value.trim();
    var coh=document.getElementById("lqCohort").value.trim();
    var dt=document.getElementById("lqDate").value.trim();
    var gaps=[];
    if(!name) gaps.push("Your name");
    if(!coh)  gaps.push("Cohort / section");

    var h=''
     +'<div class="lqsheet">'
     +'<h1>'+esc(LQ.lab)+' — '+esc(LQ.title)+'</h1>'
     +'<div class="lqmeta">UCI 2227 · Module 524 · '+esc(LQ.handout)
       +' · Set '+esc(setLetter())+' · submission sheet</div>'
     +'<h2>Learner</h2>'
     +'<div class="lqrow"><span class="k">Name</span><span class="v">'+(esc(name)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Cohort / section</span><span class="v">'+(esc(coh)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Date</span><span class="v">'+(esc(dt)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Scenario set</span><span class="v">'+esc(setLetter())+'</span></div>'
     +'<div class="lqrow"><span class="k">Built</span><span class="v">'
       +esc(new Date().toLocaleString())+'</span></div>';

    var rec=LQ.nosim?null:toolRecord();
    if(rec){ h+='<h2>Simulator record</h2>'+rec; }
    else if(!LQ.nosim){
      gaps.push("The simulator record — work through the lab tool above and press its own "
               +"“Build submission sheet” button before you build this PDF");
    }else{
      h+='<h2>Assessed on the floor</h2>'
        +'<div class="lqrow"><span class="k">Practical steps</span><span class="v">'
        +'Observed and signed off by the instructor against the handout. '
        +'The instructor signature below records that sign-off.</span></div>';
    }

    var curSec=null;
    qs.forEach(function(it,i){
      if(it.s!==curSec){ curSec=it.s; h+='<h2>'+esc(curSec||"Questions")+'</h2>'; }
      var ta=document.getElementById("lqQ"+i);
      var a=ta?ta.value.trim():"";
      var im=store["lqQ"+i+"_img"];
      if(!a&&!im) gaps.push("Q"+(i+1));
      /* An image question exists for the photograph. A caption on its own used to
         satisfy the completeness check, which is the one case where the check
         said "complete" about a sheet the instructor cannot mark. */
      else if(it.k==="image"&&!im) gaps.push("Q"+(i+1)+" — the photograph");
      h+='<div class="lqa"><div class="q"><span class="qn">Q'+(i+1)+'.</span>'+esc(it.p)+'</div>';
      if(im) h+='<img src="'+im+'" alt="Attachment for question '+(i+1)+'">';
      h+='<div class="a'+((!a&&!im)?" blank":"")+'">'+(a?esc(a):"— not answered —")+'</div></div>';
    });

    if(gaps.length){
      h+='<div class="lqgap"><b>Not yet filled in ('+gaps.length+'):</b> '+esc(gaps.join(", "))
        +'.<br>This is a completeness check, not a grade. Fill them in and build again, '
        +'or hand the sheet in as it stands and explain the gaps to your instructor.</div>';
    }else{
      h+='<div class="lqgap ok">'
        +'<b>Complete.</b> Every question on this sheet carries a response and the simulator record is attached.</div>';
    }

    h+='<div class="lqsign">Learner signature: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'Instructor verification: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'<span style="font-size:11px">Save this as a PDF and upload the single file to the '
      +esc(LQ.lab)+' assignment in Canvas.</span></div></div>';

    document.getElementById("lqOut").innerHTML=h;
    /* A sheet built early can have twenty gaps; reading all of them aloud buries
       the count that matters. Name the first few, then say how many are left. */
    if(gaps.length){
      var head=gaps.slice(0,5), rest=gaps.length-head.length;
      announce("Submission sheet built. "+gaps.length+" item"+(gaps.length===1?"":"s")
        +" still blank: "+head.join(", ")+(rest>0?(", and "+rest+" more"):"")+".");
    }else{
      announce("Submission sheet built. Every question carries a response.");
    }
    return h;
  }

  document.getElementById("lqPreview").onclick=function(){
    build();
    var o=document.getElementById("lqOut");
    if(o&&o.scrollIntoView) o.scrollIntoView({behavior:"smooth",block:"start"});
  };

  /* ---------- the one PDF ---------- */
  function safeName(s){
    return String(s||"").normalize?String(s||"").normalize("NFKD").replace(/[^\w\s-]/g,"").trim()
      :String(s||"").replace(/[^\w\s-]/g,"").trim();
  }
  function fileTitle(){
    var n=safeName(document.getElementById("lqName").value).split(/\s+/).filter(Boolean);
    var last=n.length>1?n[n.length-1]:(n[0]||"Learner");
    var first=n.length>1?n.slice(0,-1).join("_"):"";
    var who=first?(last+"_"+first):last;
    return who+"_"+String(LQ.lab||"").replace(/[^\d.]/g,"");
  }

  document.getElementById("lqBuild").onclick=function(){
    var h=build();
    /* this lab's images are now inside a PDF the learner holds, so they become the
       first thing evicted when another lab needs room on the shared origin */
    store._done=true; save();

    var old=document.getElementById("lqPrint"); if(old) old.parentNode.removeChild(old);

    /* The sheet goes inside a one-cell table whose thead repeats on every printed
       page, so pages 2+ still carry the learner name, the lab and the set. */
    /* the right-hand span floats, so without a separator the two halves run
       together in the PDF's text layer and in anything that copies from it */
    var runHead='<span class="r">'+esc(LQ.lab)+' · Set '+esc(setLetter())+'</span> '
      +esc(document.getElementById("lqName").value.trim()||"Name not entered")
      +' · '+esc(LQ.title);
    var pr=document.createElement("div"); pr.id="lqPrint";
    pr.innerHTML='<table class="lqpage"><thead class="lqrhead"><tr><td class="lqrh">'
      +runHead+'</td></tr></thead><tbody><tr><td class="lqbody">'+h+'</td></tr></tbody></table>';
    document.body.appendChild(pr);

    /* the browser suggests document.title as the Save-as-PDF filename */
    var prevTitle=document.title;
    document.title=fileTitle();
    document.body.classList.add("lq-print");

    var restored=false;
    var done=function(){
      if(restored) return; restored=true;
      document.body.classList.remove("lq-print");
      document.title=prevTitle;
      var a=document.getElementById("lqPrint"); if(a&&a.parentNode) a.parentNode.removeChild(a);
      window.removeEventListener("afterprint",done);
      if(mq&&mq.removeListener) mq.removeListener(mqHandler);
    };
    var mq=window.matchMedia?window.matchMedia("print"):null;
    var mqHandler=function(m){ if(!m.matches) done(); };
    if(mq&&mq.addListener) mq.addListener(mqHandler);
    window.addEventListener("afterprint",done);

    setTimeout(function(){
      window.print();
      /* generous fallback: mobile print sheets are asynchronous, and tearing the
         container out too early yields a blank PDF */
      setTimeout(done,60000);
    },80);
  };

  /* ================= v2.1 additions ========================================
     Everything below improves the simulator ABOVE this panel without touching
     any of the sixteen simulators' own code. They all render through delegated
     click handlers, so a synthesised click behaves exactly like a real one.
     ====================================================================== */

  /* ---------- close-tab guard while storage is broken ----------
     Normally a refresh is harmless because every keystroke is persisted. Once
     storage has failed, the only copy of the learner's work is the DOM. */
  window.addEventListener("beforeunload",function(ev){
    if(!storageBroken) return;
    var typed=false;
    for(var k in store){ if(/^lqQ/.test(k)&&String(store[k]).trim()){ typed=true; break; } }
    if(!typed) return;
    ev.preventDefault(); ev.returnValue="";
    return "";
  });

  /* ---------- the simulator's own print button ----------
     Each simulator sheet ends with "Print submission sheet", which prints the
     simulator record alone. That is a valid-looking PDF that is missing every
     handout answer, and Canvas takes one file. Offer the right one first.
     Capture phase, so it runs ahead of the inline onclick. */
  document.addEventListener("click",function(ev){
    var b=ev.target&&ev.target.closest?ev.target.closest("button"):null;
    if(!b||card.contains(b)||b.dataset.lqPrintOk==="1") return;
    var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
    if(!/print/.test(t)) return;
    ev.preventDefault(); ev.stopPropagation();
    var full=confirm(
      "This button prints the simulator record on its own.\n\n"+
      "The file Canvas expects is the full submission PDF: the simulator record "+
      "AND every handout question with your response, in one document.\n\n"+
      "OK — build the full submission PDF (recommended).\n"+
      "Cancel — print the simulator record on its own anyway.");
    if(full){
      var out=document.getElementById("lqBuild");
      if(out){ out.scrollIntoView({behavior:"smooth",block:"center"}); out.click(); }
    }else{
      /* HTMLElement.click() is a no-op while that same element's click is still
         in progress, so re-dispatching from inside this handler would silently
         do nothing. Defer it out of the current dispatch. */
      setTimeout(function(){
        b.dataset.lqPrintOk="1";
        b.click();
        setTimeout(function(){ b.dataset.lqPrintOk=""; },0);
      },0);
    }
  },true);

  /* ---------- keyboard and screen-reader shim for the simulator ----------
     The simulators drive rows, zones, chips, document cards and one-line-diagram
     symbols through click handlers on <tr>, <th>, <div> and SVG nodes. None of
     those is focusable and none announces as anything, which is why 524.5.3
     could not be completed with a keyboard at all.

     Rewriting sixteen simulators is not the cheap fix. Every one of those
     affordances already declares itself in exactly one way — cursor:pointer —
     so find them by that, give each a tab stop and a name, and translate Enter
     and Space into the click the simulator is already listening for.

     Only the OUTERMOST element of a pointer subtree is taken: `cursor` inherits,
     so a clickable <tr> would otherwise hand out one tab stop per cell. */
  var A11Y_NATIVE={A:1,BUTTON:1,INPUT:1,SELECT:1,TEXTAREA:1,LABEL:1,SUMMARY:1,
                   OPTION:1,DETAILS:1,AUDIO:1,VIDEO:1};
  var A11Y_TABLE={TR:1,TH:1,TD:1,THEAD:1,TBODY:1};
  var uid=0;

  function ptr(el){
    try{ return window.getComputedStyle(el).cursor==="pointer"; }catch(e){ return false; }
  }
  function nameFor(el){
    var t=(el.textContent||"").replace(/\s+/g," ").trim();
    if(!t&&el.parentNode&&el.parentNode.textContent)
      t=(el.parentNode.textContent||"").replace(/\s+/g," ").trim();
    if(t.length>120) t=t.slice(0,117)+"…";
    return t;
  }
  function hasName(el){
    return !!(el.getAttribute("aria-label")||el.getAttribute("aria-labelledby")
             ||el.getAttribute("title"));
  }
  function clip(t){ t=(t||"").replace(/\s+/g," ").trim();
    return t.length>120?t.slice(0,117)+"…":t; }
  /* A data-entry grid cell is named by the row it is on and the column it is in,
     which is what a sighted learner reads off the table. */
  /* Not every table in the module declares a <thead>; several put their <th>
     cells in the first row of the <tbody>. Take whichever is actually there. */
  function headerRow(tbl){
    var hr=tbl.querySelector("thead tr"); if(hr) return hr;
    var rows=tbl.rows||[];
    for(var i=0;i<rows.length&&i<3;i++) if(rows[i].querySelector("th")) return rows[i];
    return null;
  }
  function cellName(f){
    var td=f.closest?f.closest("td,th"):null; if(!td) return "";
    var tr=td.parentElement, tbl=f.closest("table");
    if(!tr||!tbl||!tr.children) return "";
    var idx=Array.prototype.indexOf.call(tr.children,td), col="", row="", j;
    var hr=headerRow(tbl);
    if(hr&&hr!==tr&&hr.children[idx])
      col=clip((hr.children[idx].textContent||"").replace(/[▲▼]/g,""));
    for(j=0;j<tr.children.length;j++){
      var c=tr.children[j];
      if(c===td) break;
      if(c.querySelector("input,select,textarea")) continue;
      var t=clip(c.textContent);
      if(t){ row=t; break; }
    }
    /* a grid whose rows carry no label still needs the two cells on one row to
       announce differently from each other */
    if(!row&&col&&typeof tr.rowIndex==="number") row="row "+(tr.rowIndex+1);
    return clip([row,col].filter(Boolean).join(", "));
  }
  /* <div class="extrow"><div>1. Condenser water supply temperature</div><select>
     — visually a labelled field, with no <label> anywhere in it. */
  function blockName(f){
    var p=f.parentElement, d;
    for(d=0;d<2&&p;d++){
      if(p.querySelectorAll("input,select,textarea").length===1){
        var c=p.cloneNode(true);
        Array.prototype.forEach.call(c.querySelectorAll("input,select,textarea"),
          function(n){ if(n.parentNode) n.parentNode.removeChild(n); });
        var t=clip(c.textContent);
        if(t) return t;
      }
      p=p.parentElement;
    }
    return "";
  }

  function a11yPass(){
    var app=document.getElementById("app"); if(!app) return;

    /* 1 — clickable things nobody can tab to */
    var all=app.querySelectorAll("*"), i, el;
    for(i=0;i<all.length;i++){
      el=all[i];
      if(card.contains(el)) continue;
      if(el.hasAttribute("tabindex")||el.dataset.lqA11y==="1") continue;
      var tag=(el.tagName||"").toUpperCase();
      if(A11Y_NATIVE[tag]) continue;
      if(!ptr(el)) continue;
      /* outermost only — a pointer parent already owns this affordance */
      var p=el.parentElement;
      if(p&&p!==app&&!card.contains(p)&&!A11Y_NATIVE[(p.tagName||"").toUpperCase()]&&ptr(p)) continue;
      el.dataset.lqA11y="1";
      el.setAttribute("tabindex","0");
      /* a <tr> with role=button would flatten the row a screen reader is about to
         read out; leave table semantics alone and give it the tab stop only */
      if(!A11Y_TABLE[tag]&&!el.getAttribute("role")) el.setAttribute("role","button");
      if(!hasName(el)){
        var n=nameFor(el);
        if(n) el.setAttribute("aria-label",n);
      }
    }

    /* 2 — <label>Text</label><select> : visually a label, programmatically not one */
    var labs=app.querySelectorAll("label:not([for])");
    for(i=0;i<labs.length;i++){
      var lb=labs[i]; if(card.contains(lb)) continue;
      if(lb.querySelector("input,select,textarea")) continue;   /* wrapping label, already fine */
      var box=lb.parentElement; if(!box) continue;
      var ctrls=box.querySelectorAll("input,select,textarea");
      if(ctrls.length!==1) continue;
      var c=ctrls[0];
      if(!c.id) c.id="lqA"+(++uid);
      lb.setAttribute("for",c.id);
    }

    /* 3 — anything still nameless takes its name from the grid cell it sits in,
       then the block around it, then, last, its own placeholder. A control already
       wrapped in a <label> is named and is left alone. */
    var ctl=app.querySelectorAll("input,select,textarea");
    for(i=0;i<ctl.length;i++){
      var f=ctl[i]; if(card.contains(f)) continue;
      if(hasName(f)) continue;
      if(f.closest&&f.closest("label")) continue;
      if(f.id&&app.querySelector('label[for="'+f.id+'"]')) continue;
      var nm=cellName(f)||blockName(f)||f.getAttribute("placeholder");
      if(nm) f.setAttribute("aria-label",nm);
    }

    /* 4 — the telemetry charts are bare <canvas>: no role, no name, nothing to
       announce. The chart's own heading and its band description are the text
       equivalent already on the page, so bind them to the canvas. */
    var cvs=app.querySelectorAll("canvas");
    for(i=0;i<cvs.length;i++){
      var cv=cvs[i]; if(card.contains(cv)||hasName(cv)) continue;
      var boxc=cv.closest?cv.closest(".chartbox"):null, bits=[];
      if(boxc){
        var h=boxc.querySelector("h3"), s=boxc.querySelector(".sub");
        if(h) bits.push((h.textContent||"").trim());
        if(s) bits.push((s.textContent||"").trim());
      }
      cv.setAttribute("role","img");
      cv.setAttribute("aria-label",
        (bits.length?bits.join(". "):"Telemetry chart")
        +". Trend chart; the same readings are available as numbers in the panels beside it.");
    }
  }

  /* Enter and Space activate whatever the shim made focusable. Delegated, so it
     survives the wholesale innerHTML rebuilds the simulators do on every render. */
  document.addEventListener("keydown",function(ev){
    if(ev.key!=="Enter"&&ev.key!==" "&&ev.key!=="Spacebar") return;
    var el=ev.target;
    if(!el||!el.dataset||el.dataset.lqA11y!=="1") return;
    ev.preventDefault();
    el.click();
  });

  /* Most views rebuild their whole subtree, so re-run after any mutation. */
  var a11yQueued=false;
  function a11ySoon(){
    if(a11yQueued) return; a11yQueued=true;
    setTimeout(function(){ a11yQueued=false; try{ a11yPass(); }catch(e){} },120);
  }
  a11ySoon();
  if(window.MutationObserver){
    var appEl=document.getElementById("app");
    if(appEl) new MutationObserver(a11ySoon)
      .observe(appEl,{childList:true,subtree:true});
  }
})();
</script>
<!-- ===== end submission module ============================================= -->

</body>
