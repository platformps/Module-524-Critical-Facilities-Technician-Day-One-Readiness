<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLAB 524.2.3 — Telemetry Simulation Audit — UCI 2227 (Training Simulator)</title>
<style>
  :root{
    --bg:#0b1620; --panel:#132433; --panel2:#0f1d29; --line:#4a7291;
    --ink:#dfeaf3; --dim:#8ba6bd; --faint:#7e9bb2;
    --blue:#33a6e8; --navy:#0079C0; --ice:#CFEBFC;
    --ok:#37c07a; --warn:#e8a33d; --stop:#e8604c;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
  button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:5px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:7px 13px}
  button:hover{background:#1b3044;border-color:#2d4d68}
  button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
  button.primary:hover{background:#0a8bd8}
  button:disabled{opacity:.4;cursor:not-allowed}
  select,input[type=text],input[type=number],textarea{
    font-family:inherit;font-size:13px;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:5px;padding:7px 9px}
  textarea{width:100%;resize:vertical;font-size:13px;line-height:1.45}
  h1,h2,h3{margin:0;font-weight:700}
  .mono{font-family:var(--mono)}

  /* ---------- shell ---------- */
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--panel);
    border-bottom:1px solid var(--line);flex:0 0 auto}
  .brand{font-weight:700;letter-spacing:.4px;font-size:14px}
  .brand span{color:var(--blue)}
  .sysname{color:var(--dim);font-size:12px;border-left:1px solid var(--line);padding-left:16px}
  .spacer{flex:1}
  .clock{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:1px}
  .clocklbl{color:var(--faint);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;text-align:right}
  .badge{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;font-weight:700;
    padding:4px 10px;border-radius:20px;background:#16324a;color:var(--blue);border:1px solid #23485f}
  .badge.run{background:#123a2a;color:var(--ok);border-color:#1d5b41}
  .badge.hold{background:#3d3220;color:var(--warn);border-color:#5c4c2e}

  main{flex:1;overflow:auto;padding:18px}
  .wrap{max-width:1500px;margin:0 auto}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin-bottom:14px}
  .card h3{font-size:15px;margin-bottom:4px}
  .card p{color:var(--dim);margin:0 0 14px;line-height:1.5;font-size:13px}
  .card ul{color:var(--dim);margin:0;padding-left:20px;line-height:1.7;font-size:13px}
  .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);font-weight:700}

  /* ---------- console ---------- */
  .toolbar{display:flex;gap:9px;align-items:center;padding:9px 18px;background:var(--panel2);
    border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1fr 1fr}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px 16px}
  .tile .name{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:700}
  .tile .val{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1.15;margin-top:5px}
  .tile .unit{font-size:14px;color:var(--dim);font-weight:400;margin-left:3px}
  .tile .band{font-size:11px;color:var(--faint);margin-top:5px;font-family:var(--mono)}
  .tile.alarm{border-color:var(--stop);background:#2a1512}
  .tile.alarm .val{color:var(--stop)}
  .tile.caution{border-color:#5c4c2e}
  .chartbox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .chartbox h3{font-size:13px;margin-bottom:2px}
  .chartbox .sub{font-size:11px;color:var(--faint);margin-bottom:8px}
  canvas{display:block;width:100%;height:auto}
  .steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .stepchip{font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:4px;
    background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
  .stepchip.on{background:#16324a;border-color:var(--blue);color:var(--ice)}
  .counter{font-family:var(--mono);font-size:12px;color:var(--faint)}

  /* ---------- log sheet ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--faint);
    font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:6px 8px;border-bottom:1px solid #182b3b;vertical-align:middle}
  td input[type=text]{width:100%;padding:5px 7px;font-family:var(--mono)}
  .steplbl{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
  .note{font-size:12px;color:var(--dim);line-height:1.55}
  .hidden{display:none !important}

  /* ---------- submission ---------- */
  .submit{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-top:14px}
  .submit h3{font-size:14px;margin-bottom:3px}
  .submit .sub{font-size:12px;color:var(--faint);margin-bottom:13px}
  .fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
  .fgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
  .result{margin-top:12px;padding:13px;border-radius:7px;font-size:13px;line-height:1.55;display:none}
  .result.show{display:block;background:var(--panel2);border:1px solid var(--line)}
  .sheet h2{font-size:16px;margin-bottom:2px}
  .learnerline{font-size:14px;margin:6px 0 4px}
  .sheet .sheetsub{font-size:12px;color:var(--faint);margin-bottom:12px}
  .sheet h4{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--blue);
    font-weight:700;margin:16px 0 6px}
  .srow{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px solid #182b3b;font-size:12.5px}
  .srow span:first-child{color:var(--faint);flex:0 0 42%}
  .srow span:last-child{font-family:var(--mono);text-align:right;flex:1;white-space:pre-wrap}
  .missing{background:#2b2310;border:1px solid #5c4c2e;border-radius:7px;padding:11px;margin:12px 0;font-size:12.5px;line-height:1.55}
  .closing{margin-top:14px;font-size:12.5px;color:var(--dim);line-height:1.55}

  @media print{
    body{background:#fff;color:#000;overflow:visible}
    header,.toolbar,.noprint{display:none !important}
    main{overflow:visible}
    .result{border:1px solid #999 !important;background:#fff !important}
    .srow span:first-child{color:#444}
    .sheet h4{color:#000}
  }

  .labtag{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;
    color:var(--blue);margin-bottom:8px}
  .lede{color:var(--dim);line-height:1.6;margin:0 0 26px;max-width:820px}

  /* ---------- packet (previous-test baseline sheet), printable ---------- */
  .packet{background:#fbfaf6;color:#111;border:1px solid #c9c4b4;border-radius:9px;padding:22px 26px;
    margin-bottom:14px;font-family:var(--sans);font-size:13px;line-height:1.5}
  .packet h2{font-size:17px;margin:0 0 2px;color:#111}
  .packet h3{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#345;margin:20px 0 8px;font-weight:700}
  .packet .pkmeta{font-size:12px;color:#555;margin-bottom:12px}
  .packet p{margin:0 0 10px;color:#222}
  .packet table{font-size:12.5px}
  .packet th{color:#345;border-bottom:1px solid #999;font-size:10px}
  .packet td{border-bottom:1px solid #ddd;color:#111;vertical-align:top;padding:6px 8px}
  .packet td.mono,.packet .mono{font-family:var(--mono)}
  .packet input[type=text],.packet textarea{background:#fff;color:#111;border:1px solid #b9b3a3;border-radius:4px;
    padding:5px 7px;font-size:12.5px;width:100%;font-family:inherit}
  .packet textarea{min-height:44px;resize:vertical}
  .packet label.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .packet label{display:block;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:#345;font-weight:700;margin:0 0 4px}
  .packet .pkbtns{display:flex;gap:9px;margin-top:16px;align-items:center}
  .packet .pkbtns button{background:#fff;color:#111;border-color:#999}
  .packet .pkbtns button:hover{background:#eee}
  .packet .pkfoot{font-size:11px;color:#666;margin-top:16px;border-top:1px solid #ccc;padding-top:8px}
  @media print{
    body.pk-print{background:#fff!important;color:#000!important;overflow:visible!important;height:auto!important}
    body.pk-print>*{display:none!important}
    body.pk-print>#packetPane{display:block!important}
    body.pk-print .packet{border:0;padding:0;background:#fff;color:#000;border-radius:0}
    body.pk-print .packet *{color:#000!important;background:transparent!important;box-shadow:none!important}
    body.pk-print .packet input[type=text],body.pk-print .packet textarea{border:0;border-bottom:1px solid #888;border-radius:0;resize:none}
    body.pk-print .packet .pkbtns,body.pk-print .noprint{display:none!important}
    body.pk-print .packet tr{page-break-inside:avoid;break-inside:avoid}
    body.pk-print .packet thead{display:table-header-group}
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">GENERATOR LOAD-BANK CONSOLE</div>
    <div class="sysname">GLAB 524.2.3 &middot; UCI 2227 · objective M2.3 · <span id="setTag"></span> · TRAINING SIMULATOR — not connected to any live plant</div>
    <div class="spacer"></div>
    <div id="statusBadge" class="badge">Ready</div>
    <div>
      <div class="clocklbl">Site time</div>
      <div class="clock mono" id="clock">--:--:--</div>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <button id="btnStart" class="primary">Start run</button>
    <button id="btnPause">Pause</button>
    <button id="btnStep">Step +1 min</button>
    <button id="btnPacket" title="Previous-test baseline sheet, readable and printable here">Packet</button>
    <span style="width:10px"></span>
    <div class="fld"><label>Speed</label>
      <select id="speed">
        <option value="1">Real time (1x)</option>
        <option value="4">4x</option>
        <option value="12" selected>12x</option>
        <option value="30">30x</option>
        <option value="60">60x</option>
      </select>
    </div>
    <span class="spacer"></span>
    <span class="counter" id="elapsed">T+00:00</span>
    <button id="btnRestart">Restart</button>
  </div>

  <main>
    <div class="wrap">
      <section id="packetPane" class="hidden" aria-label="Previous-test baseline sheet"></section>
      <section id="genView"></section>
    </div>
  </main>
</div>

<script>
"use strict";
const SET = 4;   /* fixed for this file */
/* ============================================================
   UCI 2227 — GLAB 524.2.3 · Telemetry Simulation Audit
   Standalone training console. Offline, no libraries, no network.
   ============================================================ */

/* ---------- fixed scenario ---------- */
const SETLETTER="ABCDEFGH".charAt(SET);
const RUNKEY=(0x9E3779B1 ^ Math.imul(SET+1,2654435761))>>>0;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let rnd=mulberry32(1);
let QUIET=false;                       /* true = model without noise (packet reference rows) */
function noise(amp){return QUIET?0:(rnd()*2-1)*amp;}
function fmtClock(mins){
  const base=3*60+14; // scenarios run from 03:14 site time
  const total=base+mins;
  const h=Math.floor(total/60)%24, m=Math.floor(total%60), s=Math.floor((mins%1)*60);
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
function fmtElapsed(mins){
  return "T+"+String(Math.floor(mins)).padStart(2,"0")+":"+String(Math.floor((mins%1)*60)).padStart(2,"0");
}
function drawChart(cv,cfg){
  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth, H=cfg.height||150;
  cv.width=W*dpr; cv.height=H*dpr; cv.style.height=H+"px";
  const x=cv.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,W,H);
  const pad={l:46,r:10,t:10,b:20};
  const pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  const {min,max}=cfg;
  const sy=v=>pad.t+ph-((v-min)/(max-min))*ph;
  const sx=i=>pad.l+(i/Math.max(1,cfg.xmax))*pw;

  // alarm band shading
  if(cfg.band){
    x.fillStyle="rgba(232,96,76,.10)";
    if(cfg.band.hi<max) x.fillRect(pad.l,pad.t,pw,sy(cfg.band.hi)-pad.t);
    if(cfg.band.lo>min) x.fillRect(pad.l,sy(cfg.band.lo),pw,pad.t+ph-sy(cfg.band.lo));
  }
  // grid + y labels
  x.strokeStyle="#1d3346"; x.lineWidth=1; x.font="10px "+getComputedStyle(document.body).fontFamily;
  x.fillStyle="#5c7a92"; x.textAlign="right"; x.textBaseline="middle";
  for(let i=0;i<=4;i++){
    const v=min+(max-min)*i/4, yy=sy(v);
    x.beginPath(); x.moveTo(pad.l,yy); x.lineTo(W-pad.r,yy); x.stroke();
    x.fillText(cfg.fmt?cfg.fmt(v):v.toFixed(1),pad.l-6,yy);
  }
  // step markers
  if(cfg.steps) cfg.steps.forEach(s=>{
    if(s>cfg.xmax) return;
    x.strokeStyle="#25415a"; x.setLineDash([3,3]);
    x.beginPath(); x.moveTo(sx(s),pad.t); x.lineTo(sx(s),pad.t+ph); x.stroke(); x.setLineDash([]);
  });
  // series
  (cfg.series||[]).forEach(se=>{
    if(!se.data.length) return;
    x.strokeStyle=se.color; x.lineWidth=se.width||2; x.beginPath();
    se.data.forEach((v,i)=>{ const px=sx(i*(cfg.xstep||1)), py=sy(clamp(v,min,max));
      i?x.lineTo(px,py):x.moveTo(px,py); });
    x.stroke();
    // last point dot
    const li=se.data.length-1;
    x.fillStyle=se.color; x.beginPath();
    x.arc(sx(li*(cfg.xstep||1)),sy(clamp(se.data[li],min,max)),2.6,0,7); x.fill();
  });
  // x label
  x.fillStyle="#5c7a92"; x.textAlign="center"; x.textBaseline="top";
  x.fillText(cfg.xlabel||"minutes",pad.l+pw/2,H-13);
}
function tile(name,val,unit,band,cls){
  return `<div class="tile ${cls||''}"><div class="name">${name}</div>
    <div class="val">${val}<span class="unit">${unit||''}</span></div>
    <div class="band">${band||''}</div></div>`;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ---------- this lab ---------- */
const LAB={lab:"GLAB 524.2.3",obj:"M2.3",title:"Telemetry Simulation Audit",duration:24};
/* Set letter → variant, as in 5_Instructor_ONLY/SET_KEY.md:
   A = A0 healthy control · B = A1 frequency droop · C = A2 fuel +18 % · D = A3 coolant never plateaus · E = A4 oil sag */
const SCENARIOS=[{id:"A0"},{id:"A1"},{id:"A2"},{id:"A3"},{id:"A4"}];

const S={learner:"",t:0,started:false,running:false,timer:null,speed:12,
  series:{},last:null,packet:{exp:{}}};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let V=SCENARIOS[SET];

/* ---------- model ---------- */
function genSample(t,v){
  const steps=[0,4,8,12,16,20];
  let stepIdx=0; steps.forEach((s,i)=>{if(t>=s)stepIdx=i;});
  const loadPct=[25,40,55,70,85,100][stepIdx];
  const load=15*loadPct; // kW of 1500
  const sinceStep=t-steps[stepIdx];

  const dipDepth=0.30+stepIdx*0.02;
  const dip=Math.exp(-sinceStep*1.7)*dipDepth;
  let recoverTo=60.0;
  if(v==="A1") recoverTo=60.0-stepIdx*0.13;
  let hz=recoverTo-dip+noise(0.035);

  let volts=480-dip*7+noise(1.1);

  let coolant;
  if(v==="A3"){ coolant=42+54*(1-Math.exp(-t/13))+t*0.30; }
  else        { coolant=42+46*(1-Math.exp(-t/3.0)); }
  coolant+=noise(0.35);

  let oil=55+noise(0.45)-stepIdx*0.25;
  if(v==="A4"&&t>=20){ oil=55-0.25*5-(14*(1-Math.exp(-(t-20)/1.6)))+noise(0.4); }

  const baseRate=68.1+loadPct*3.256;              // liters/hr
  const rate=(v==="A2"? baseRate*1.18 : baseRate)+noise(5.3);
  return {load,loadPct,stepIdx,hz,volts,coolant,oil,rate,
          baselineRate:baseRate};
}


/* Pre-load reading: the set is running warm at no load, breaker closed, load bank at 0 %.
   This is what the console shows in the Ready state, before Start — the true baseline. */
function idleSample(v){
  const baseRate=68.1;                            // the model's fuel line at 0 % load
  return {load:0,loadPct:0,stepIdx:-1,idle:true,
          hz:60.0+noise(0.02),volts:480+noise(1.0),
          coolant:42+noise(0.35),oil:55.5+noise(0.3),
          rate:(v==="A2"?baseRate*1.18:baseRate)+noise(2.0),
          baselineRate:baseRate};
}
const PARAMS=["None","Frequency","Voltage","Real power","Coolant temperature","Oil pressure","Fuel rate"];
const BASEFIELDS=[["bHz","Frequency","Hz"],["bV","Voltage L-L","V"],["bKw","Real power","kW"],
                  ["bCo","Coolant temp","°C"],["bOil","Oil pressure","psi"],["bFu","Fuel rate","L/h"]];
const LOGCOLS=[["hz","Frequency (Hz)"],["v","Voltage (V)"],["kw","Real power (kW)"],
               ["co","Coolant (°C)"],["oil","Oil press (psi)"],["fu","Fuel rate (L/h)"]];
const STEPPCT=[25,40,55,70,85,100];

function val(id){const e=$(id);return e?e.value.trim():"";}

function buildSheet(){
  const r=$("genResult"); if(!r) return;
  r.className="result show";
  r.innerHTML=sheetHTML(false);
  const pb=$("btnPrint"); if(pb) pb.onclick=()=>window.print();
  if(r.scrollIntoView) r.scrollIntoView({behavior:"smooth",block:"start"});
}
/* The submission module calls this when the learner presses Build submission PDF. It rebuilds
   the record from the current entries whatever is on screen and does not touch the visible panes. */
window.lqRecord=function(){ return sheetHTML(true); };
function sheetHTML(forRecord){
  const missing=[];
  S.learner=val("learnerName")||S.learner;
  if(!S.learner) missing.push("Your name");
  const baseMissing=BASEFIELDS.filter(f=>!val(f[0])).map(f=>f[1]);
  if(baseMissing.length) missing.push("Baseline record: "+baseMissing.join(", "));
  let blanks=0;
  for(let i=0;i<6;i++) LOGCOLS.forEach(c=>{ if(!val("lg_"+i+"_"+c[0])) blanks++; });
  if(blanks) missing.push("Load-step log: "+blanks+" of 36 cells left blank");
  if(!val("ansParam")) missing.push("The parameter you are flagging (or \"None\")");
  if(val("ansParam")&&val("ansParam")!=="None"&&!val("ansTime")) missing.push("The time at which you flagged it");
  if(!val("ansText")) missing.push("Your one-sentence log entry");

  const now=new Date();
  const rows=[];
  const row=(k,v)=>`<div class="srow"><span>${esc(k)}</span><span>${esc(v||"—")}</span></div>`;
  rows.push(`<h2>${LAB.lab} — ${LAB.title}</h2>
             <div class="sheetsub">UCI 2227 · objective ${LAB.obj} · Set ${SETLETTER} · submission sheet</div>`+
             (forRecord?"":`<div class="learnerline"><b>Name:</b> ${esc(S.learner)||"\u2014"}</div>`));
  rows.push(`<h4>Session</h4>`);
  rows.push(row("Set",SETLETTER));
  rows.push(row("Completed",now.toLocaleDateString()+" "+now.toLocaleTimeString()));
  rows.push(row("Run time reached",fmtElapsed(S.t)+" of "+LAB.duration+":00 simulated"));

  rows.push(`<h4>Baseline recorded before the run (no load, before Start)</h4>`);
  BASEFIELDS.forEach(f=>rows.push(row(f[1]+" ("+f[2]+")",val(f[0]))));

  rows.push(`<h4>Logged readings at each load step</h4>`);
  for(let i=0;i<6;i++){
    const cells=LOGCOLS.map(c=>c[1].replace(/\s*\(.*\)$/,"")+" "+(val("lg_"+i+"_"+c[0])||"—")).join("   ");
    rows.push(row("Step "+(i+1)+" · "+STEPPCT[i]+"%",cells));
  }

  rows.push(`<h4>Your finding</h4>`);
  rows.push(row("Parameter flagged",val("ansParam")==="None"?"None — run logged as normal":val("ansParam")));
  rows.push(row("Time flagged",val("ansTime")));
  rows.push(row("Log entry",val("ansText")));

  rows.push(packetRecordHTML());
  if(!packetAnyFilled()) missing.push("Packet — previous-test baseline sheet: what each parameter did last time / what you expect");

  let html=`<div class="sheet">`+rows.join("");
  if(missing.length){
    html+=`<div class="missing"><b>Not yet filled in:</b><br>`+
          missing.map(m=>"· "+esc(m)).join("<br>")+
          `<br><br>This is a completeness check only. Fill these in and build the sheet again, or build the PDF as it stands and explain the gaps.</div>`;
  }
  html+=`<div class="closing">This record is embedded in your submission PDF.</div>`;
  if(!forRecord) html+=`<div class="noprint" style="margin-top:12px"><button id="btnPrint">Print submission sheet</button></div>`;
  html+=`</div>`;
  return html;
}

/* ---------- packet: previous-test baseline sheet ----------
   Reference rows come from the healthy model (A0) with the noise switched off, read three
   minutes into each step — the same points a learner logs — so the sheet agrees with the
   "baseline at this load" fuel figure on the tile and with the grey line on the fuel chart.
   The fillable "what it did last time / what I expect" rows are held in S.packet and written
   into the submission sheet. The pane is never repainted, so entries survive the run. */
const PK_PARAMS=[["hz","Frequency","Hz",v=>v.hz.toFixed(2)],["v","Voltage L-L","V",v=>v.volts.toFixed(0)],
  ["kw","Real power","kW",v=>v.load.toFixed(0)],["co","Coolant temp","°C",v=>v.coolant.toFixed(1)],
  ["oil","Oil pressure","psi",v=>v.oil.toFixed(1)],["fu","Fuel rate","L/h",v=>v.rate.toFixed(1)]];
function prevTestRows(){
  QUIET=true;
  const out=[{lbl:"No load · pre-test idle",d:idleSample("A0")}];
  [0,4,8,12,16,20].forEach((s,i)=>out.push({lbl:"Step "+(i+1)+" · "+STEPPCT[i]+" % · read at T+"+String(s+3).padStart(2,"0")+":00",d:genSample(s+3,"A0")}));
  QUIET=false;
  return out;
}
function pkExp(k,f){ const e=S.packet.exp[k]; return e&&e[f]?e[f]:""; }
function packetAnyFilled(){ return PK_PARAMS.some(p=>pkExp(p[0],"last").trim()||pkExp(p[0],"expect").trim()); }
function packetHTML(){
  const ref=prevTestRows();
  const refRows=ref.map(r=>`<tr><td class="mono" style="white-space:nowrap">${esc(r.lbl)}</td>`+
    PK_PARAMS.map(p=>`<td class="mono">${p[3](r.d)}</td>`).join("")+`</tr>`).join("");
  const expRows=PK_PARAMS.map(p=>`<tr>
      <td style="width:150px"><b>${esc(p[1])}</b><br><span style="font-size:11px;color:#555">${esc(p[2])}</span></td>
      <td><label class="vh" for="pk_last_${p[0]}">What it did last time</label>
          <textarea id="pk_last_${p[0]}" data-pk="${p[0]}" data-k="last">${esc(pkExp(p[0],"last"))}</textarea></td>
      <td><label class="vh" for="pk_exp_${p[0]}">What I expect this run</label>
          <textarea id="pk_exp_${p[0]}" data-pk="${p[0]}" data-k="expect">${esc(pkExp(p[0],"expect"))}</textarea></td>
    </tr>`).join("");
  return `<div class="packet" id="packetPaper">
    <h2>${LAB.lab} — Previous-test baseline sheet</h2>
    <div class="pkmeta">${esc(LAB.title)} · Set ${SETLETTER} · 1,500 kW standby diesel · monthly load-bank test, previous run (healthy, no findings)</div>
    <p>This is the site baseline sheet from the last load-bank test on this machine: the same six steps at 25, 40, 55, 70,
      85 and 100 % of nameplate, four minutes each, readings taken three minutes into each step once the set had settled.
      That test was signed off with no findings. Use it two ways: before you press Start, write beside each parameter what
      it did last time and what you therefore expect to see; during the run, compare what the console shows against these
      numbers. The fuel tile's &ldquo;baseline at this load&rdquo; figure and the grey line on the fuel chart are taken
      from this sheet. Everything you type here is written into your submission sheet.</p>

    <h3>Readings from the previous test</h3>
    <div style="overflow-x:auto"><table><thead><tr><th>Load step</th>${PK_PARAMS.map(p=>`<th>${esc(p[1])} (${esc(p[2])})</th>`).join("")}</tr></thead>
    <tbody>${refRows}</tbody></table></div>
    <p style="margin-top:10px;font-size:12px;color:#444">Shapes to expect on a healthy machine: frequency dips about 0.3 Hz at each load step and is back at 60.00 within a
      minute; voltage sags a few volts with the dip and recovers; coolant climbs from idle and flattens at about 88 °C by
      the third step; oil pressure eases a fraction of a psi per step and stays in the mid-50s; fuel rate steps up with load
      in a straight line. Alarm points: frequency 58.8–61.2 Hz, voltage 480 V ±10 %, coolant 105 °C, oil 30 psi.</p>

    <h3>What it did last time / what I expect — one line per parameter (Step 2)</h3>
    <table><thead><tr><th>Parameter</th><th>What it did last time</th><th>What I expect this run</th></tr></thead>
    <tbody>${expRows}</tbody></table>

    <div class="pkbtns noprint">
      <button type="button" id="btnPrintPacket">Print packet</button>
      <button type="button" id="btnClosePacket">Close packet</button>
      <span style="font-size:12px;color:#555">Your entries here are carried into the submission sheet automatically.</span>
    </div>
    <div class="pkfoot">UCI 2227 · ${LAB.lab} ${esc(LAB.title)} · Previous-test baseline sheet · Set ${SETLETTER}</div>
  </div>`;
}
function renderPacket(){
  const p=$("packetPane"); if(!p) return;
  p.innerHTML=packetHTML();
  p.oninput=e=>{
    const t=e.target; if(!t||!t.dataset.pk) return;
    S.packet.exp[t.dataset.pk]=S.packet.exp[t.dataset.pk]||{};
    S.packet.exp[t.dataset.pk][t.dataset.k]=t.value;
  };
  $("btnPrintPacket").onclick=printPacket;
  $("btnClosePacket").onclick=()=>togglePacket(false);
}
function togglePacket(force){
  const p=$("packetPane"); if(!p) return;
  const open=typeof force==="boolean"?force:p.classList.contains("hidden");
  p.classList.toggle("hidden",!open);
  $("btnPacket").classList.toggle("primary",open);
  if(open&&p.scrollIntoView) p.scrollIntoView({block:"start"});
}
function printPacket(){
  /* print only the packet: lift the pane to <body>, print, put it back where it was */
  const p=$("packetPane"), parent=p.parentNode, next=p.nextSibling;
  const wasHidden=p.classList.contains("hidden");
  p.classList.remove("hidden");
  document.body.appendChild(p);
  document.body.classList.add("pk-print");
  const restore=()=>{
    if(!document.body.classList.contains("pk-print")) return;
    document.body.classList.remove("pk-print");
    parent.insertBefore(p,next);
    if(wasHidden) p.classList.add("hidden");
    window.removeEventListener("afterprint",restore);
  };
  window.addEventListener("afterprint",restore);
  try{ window.print(); }catch(e){}
  setTimeout(restore,1500);
}
function packetRecordHTML(){
  const cell=v=>esc((v||"").trim())||"—";
  const ref=prevTestRows();
  const fuel=ref.slice(1).map(r=>r.d.rate.toFixed(1)).join(" / ");
  const row=(k,v)=>`<div class="srow"><span>${esc(k)}</span><span>${v}</span></div>`;
  return `<h4>Packet — Previous-test baseline sheet</h4>`+
    row("Reference used","previous healthy test · fuel at steps 1–6: "+fuel+" L/h · coolant plateau "+ref[6].d.coolant.toFixed(1)+" °C · oil "+ref[1].d.oil.toFixed(1)+"–"+ref[6].d.oil.toFixed(1)+" psi")+
    PK_PARAMS.map(p=>row(p[1]+" — last time / expect",cell(pkExp(p[0],"last"))+"  |  "+cell(pkExp(p[0],"expect")))).join("");
}

/* ---------- view ---------- */

/* ---------- run loop ---------- */
function pushSeries(){
  const dd=S.started?genSample(S.t,V.id):idleSample(V.id);
    S.last=dd;
    (S.series.hz=S.series.hz||[]).push(dd.hz);
    (S.series.coolant=S.series.coolant||[]).push(dd.coolant);
    (S.series.oil=S.series.oil||[]).push(dd.oil);
    (S.series.rate=S.series.rate||[]).push(dd.rate);
    (S.series.base=S.series.base||[]).push(dd.baselineRate);
}
function render(){
  $("clock").textContent=fmtClock(S.t);
  $("elapsed").textContent=fmtElapsed(S.t);
  renderGen();
}
function tick(){
  if(S.t>=LAB.duration){stopRun(true);return;}
  S.started=true;                                   // step 1 begins on Start (or the first Step +1 min)
  S.t=Math.min(LAB.duration,S.t+0.25);
  pushSeries(); render();
  if(S.t>=LAB.duration) stopRun(true);              // badge flips the moment the run reaches T+24:00
}
function startRun(){
  if(S.running)return;
  if(S.t>=LAB.duration){stopRun(true);return;}
  S.running=true;
  $("statusBadge").textContent="Running"; $("statusBadge").className="badge run";
  clearInterval(S.timer);
  S.timer=setInterval(tick,Math.max(60,1000*15/S.speed));
}
function stopRun(done){
  S.running=false; clearInterval(S.timer); S.timer=null;
  $("statusBadge").textContent=done?"Run complete":"Held";
  $("statusBadge").className="badge "+(done?"":"hold");
}
function resetRun(){
  stopRun(false);
  rnd=mulberry32(RUNKEY);
  S.t=0; S.started=false; S.series={}; S.last=null;
  S.packet={exp:{}};
  pushSeries(); render(); renderPacket(); togglePacket(false);
  $("statusBadge").textContent="Ready"; $("statusBadge").className="badge";
}

/* ---------- wiring ---------- */
$("btnStart").onclick=startRun;
$("btnPause").onclick=()=>stopRun(false);
$("btnStep").onclick=()=>{
  if(S.running)stopRun(false);
  for(let i=0;i<4;i++)tick();
  if(!S.running&&S.t<LAB.duration){$("statusBadge").textContent="Held";$("statusBadge").className="badge hold";}
};
$("btnRestart").onclick=resetRun;
$("btnPacket").onclick=()=>togglePacket();
$("speed").onchange=()=>{S.speed=+$("speed").value;if(S.running){stopRun(false);startRun();}};
window.addEventListener("resize",render);
document.addEventListener("keydown",e=>{
  if(e.key===" "&&e.target.tagName!=="TEXTAREA"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="SELECT"){
    e.preventDefault(); S.running?stopRun(false):startRun();
  }
});

/* ---------- boot ---------- */
$("setTag").textContent="Set "+SETLETTER;
resetRun();
</script>

<script id="lqScript">
(function(){
  if(window.__lqLoaded) return; window.__lqLoaded=true;

  var esc=function(s){return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");};

  var KEY="uci2227:"+LQ.file;
  var store={}, storageBroken=false;
  try{ store=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ store={}; }

  /* ---------- cross-lab storage budget ----------
     Every lab in the module is served from one origin, so all 43 share a single
     ~5 MB localStorage budget. Seventeen image questions at ~325 KB apiece is 5.4 MB
     — a learner working through the whole module on one browser profile would run out
     near the end. Images belonging to OTHER labs are evicted when room is needed,
     oldest and already-exported first. Text answers are never evicted: they are tiny,
     and they are the part a learner cannot reproduce. An evicted image is already
     inside the submission PDF that lab produced. */
  function otherLabKeys(){
    var out=[];
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf("uci2227:")===0&&k!==KEY) out.push(k);
      }
    }catch(e){}
    return out;
  }
  function usedBytes(){
    var n=0;
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf("uci2227:")===0) n+=(localStorage.getItem(k)||"").length;
      }
    }catch(e){}
    return n;
  }
  function evictOtherImages(target){
    /* returns bytes freed. Prefers labs whose PDF has already been built, then oldest. */
    var recs=[];
    otherLabKeys().forEach(function(k){
      var raw,obj;
      try{ raw=localStorage.getItem(k)||"{}"; obj=JSON.parse(raw); }catch(e){ return; }
      var imgBytes=0;
      for(var f in obj) if(/_img$/.test(f)) imgBytes+=String(obj[f]).length;
      if(imgBytes>0) recs.push({k:k,obj:obj,bytes:imgBytes,ts:obj._ts||0,done:obj._done?1:0});
    });
    recs.sort(function(a,b){ return (b.done-a.done)||(a.ts-b.ts); });
    var freed=0;
    for(var i=0;i<recs.length&&freed<target;i++){
      var r=recs[i];
      for(var f in r.obj) if(/_img$/.test(f)) delete r.obj[f];
      r.obj._evicted=true;
      try{ localStorage.setItem(r.k,JSON.stringify(r.obj)); freed+=r.bytes; }catch(e){}
    }
    return freed;
  }

  function save(){
    store._ts=Date.now();
    var payload;
    try{ payload=JSON.stringify(store); }catch(e){ return false; }
    try{
      localStorage.setItem(KEY,payload);
      if(storageBroken){ storageBroken=false; showStoreErr(null); }
      return true;
    }catch(e){
      /* make room from other labs, then try once more */
      if(evictOtherImages(payload.length+200000)>0){
        try{
          localStorage.setItem(KEY,payload);
          if(storageBroken){ storageBroken=false; showStoreErr(null); }
          return true;
        }catch(e2){}
      }
      storageBroken=true;
      showStoreErr(e);
      return false;
    }
  }
  function showStoreErr(e){
    var b=document.getElementById("lqStoreErr");
    if(!b) return;
    if(!e){ b.style.display="none"; return; }
    b.style.display="block";
    b.innerHTML='<b>Your work is no longer being saved in this browser.</b><br>'
      +'Storage is full or switched off — usually private browsing, or a great many images '
      +'attached across the labs on this machine. Everything on screen is intact and the '
      +'submission PDF will still build correctly — but <b>do not refresh or close this tab</b>. '
      +'Press <b>Build submission PDF</b> now and save the file. '
      +'Then press <b>Clear my responses</b> to free the space up for the next lab.';
    if(b.scrollIntoView) b.scrollIntoView({block:"nearest"});
  }

  function announce(msg){
    var s=document.getElementById("lqStatus");
    if(s){ s.textContent=""; setTimeout(function(){ s.textContent=msg; },30); }
  }

  /* ---------- detect the set letter the tool is running ---------- */
  function setLetter(){
    try{ if(typeof SETLETTER!=="undefined"&&SETLETTER) return SETLETTER; }catch(e){}
    var tag=document.getElementById("setTag");
    if(tag&&tag.textContent){
      var m=tag.textContent.match(/set\s+([A-H])/i); if(m) return m[1].toUpperCase();
    }
    var m2=(LQ.file||"").match(/524-\d-\d-([A-H])_/); if(m2) return m2[1];
    return LQ.set||"—";
  }

  function hasSet(){ var l=setLetter(); return !!l&&l!=="—"; }

  /* ---------- downscale an image before it goes anywhere near storage ----------
     A phone photo is 2-5 MB and base64 inflates it by a third; localStorage is
     about 5 MB for the whole origin. Downscaling to 1600px JPEG brings a typical
     capture under 400 KB, which is still far more detail than the PDF can show. */
  var MAXPX=1600, JPEGQ=0.82;
  function downscale(file,cb){
    var rd=new FileReader();
    rd.onerror=function(){ cb(null,"The browser could not read that file."); };
    rd.onload=function(){
      var img=new Image();
      img.onerror=function(){ cb(null,"That file does not look like an image the browser can open."); };
      img.onload=function(){
        try{
          var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
          if(!w||!h){ cb(rd.result,null); return; }
          var sc=Math.min(1,MAXPX/Math.max(w,h));
          if(sc>=1&&rd.result.length<600000){ cb(rd.result,null); return; }
          var cw=Math.max(1,Math.round(w*sc)), ch=Math.max(1,Math.round(h*sc));
          var c=document.createElement("canvas"); c.width=cw; c.height=ch;
          var x=c.getContext("2d");
          x.fillStyle="#fff"; x.fillRect(0,0,cw,ch);
          x.drawImage(img,0,0,cw,ch);
          cb(c.toDataURL("image/jpeg",JPEGQ),null);
        }catch(err){ cb(rd.result,null); }
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(file);
  }

  /* ---------- build the card ---------- */

  var html=""
   +'<h2 id="lqCardTitle">Lab submission — questions and responses</h2>'
   +'<p class="lqsub">Every question from the <b>'+esc(LQ.handout)+'</b> handout is answered here, not on paper. '
   +'Your responses, together with the record this simulator builds, print to a <b>single PDF</b> that you upload to Canvas. '
   +'<b>What is saved:</b> everything you type in this panel is kept in this browser as you type, so a refresh will not lose your answers. '
   +(LQ.nosim?'':'<b>What is not:</b> the simulator above starts again on a refresh — if you refresh mid-lab, work the simulator again before you build the PDF.')+'</p>'
   +'<div id="lqStoreErr" role="alert"></div>'
   +'<p id="lqStatus" class="lqvh" role="status" aria-live="polite"></p>'
   +'<div class="lqid">'
   +'<div class="lqfld" style="flex:1 1 260px"><label for="lqName">Your name</label>'
     +'<input type="text" id="lqName" autocomplete="name" placeholder="First and last" value="'+esc(store.name||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 180px"><label for="lqCohort">Cohort / section</label>'
     +'<input type="text" id="lqCohort" placeholder="e.g. UCI 2227-01" value="'+esc(store.cohort||"")+'"></div>'
   +'<div class="lqfld" style="flex:0 1 150px"><label for="lqDate">Date</label>'
     +'<input type="text" id="lqDate" value="'+esc(store.date||new Date().toLocaleDateString())+'"></div>'
   +'</div>';

  secs.forEach(function(sec,si){
    html+='<h3 class="lqsec" id="lqSec'+si+'">'+esc(sec.name||"Questions")+'</h3>';
    sec.list.forEach(function(o){
      var id="lqQ"+o.i, n=o.i+1;
      html+='<div class="lqq">';
      if(o.it.k==="image"){
        html+='<p class="lqp"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</p>'
             +'<div class="lqimgwrap">'
             +'<label class="lqfilelbl" for="'+id+'_f">Attach your image for question '+n+'</label>'
             +'<input type="file" accept="image/*" id="'+id+'_f">'
             +'<p class="lqnote" style="margin:5px 0 0">A photo or screenshot. It is resized and '
             +'embedded in the PDF you hand in.</p>'
             +'<img id="'+id+'_img" alt="Your attached image for question '+n+'" style="display:none">'
             +'<label class="lqfilelbl" for="'+id+'" style="margin-top:8px">Caption or note for question '+n+'</label>'
             +'<textarea id="'+id+'" rows="2" placeholder="Add any caption or note that goes with the image.">'
             +esc(store[id]||"")+'</textarea></div>';
      }else{
        html+='<label class="lqp" for="'+id+'"><span class="qn">Q'+n+'.</span>'+esc(o.it.p)+'</label>'
             +'<textarea id="'+id+'" rows="3" placeholder="Type your answer here.">'+esc(store[id]||"")+'</textarea>';
      }
      html+='</div>';
    });
  });

  html+='<div class="lqbtns">'
    +'<button type="button" class="lqprimary" id="lqBuild">Build submission PDF</button>'
    +'<button type="button" id="lqPreview">Preview without printing</button>'
    +'<button type="button" id="lqClear">Clear my responses</button>'
    +'<span class="lqnote">The PDF carries every question, your responses and the simulator record. One file, one upload.</span>'
    +'</div><div id="lqOut" role="region" aria-label="Submission sheet preview"></div>';

  card.innerHTML=html;
  host.appendChild(card);

  /* ---------- wiring ---------- */
  ["lqName","lqCohort","lqDate"].forEach(function(id){
    var el=document.getElementById(id);
    el.oninput=function(){ store[id.replace("lq","").toLowerCase()]=el.value; save(); };
  });
  qs.forEach(function(it,i){
    var id="lqQ"+i, ta=document.getElementById(id);
    if(ta) ta.oninput=function(){ store[id]=ta.value; save(); };
    var f=document.getElementById(id+"_f");
    if(f) f.onchange=function(){
      var file=f.files&&f.files[0]; if(!file) return;
      announce("Processing your image for question "+(i+1)+".");
      downscale(file,function(dataUrl,err){
        if(err){ announce(err); alert(err); return; }
        var img=document.getElementById(id+"_img");
        img.src=dataUrl; img.style.display="block";
        store[id+"_img"]=dataUrl;
        var okSave=save();
        announce("Image attached to question "+(i+1)+
          (okSave?"." : ", but it could not be saved in this browser. Build your PDF now."));
      });
    };
    if(store[id+"_img"]){
      var im0=document.getElementById(id+"_img");
      if(im0){ im0.src=store[id+"_img"]; im0.style.display="block"; }
    }
  });

  /* an image of this lab was evicted to make room for another lab on the shared
     origin, and this lab had not yet been exported — say so plainly */
  if(store._evicted&&!store._done){
    var eb=document.getElementById("lqStoreErr");
    eb.style.display="block";
    eb.innerHTML='<b>An image you attached is no longer stored.</b><br>'
      +'This browser ran out of room across all the labs on this machine and dropped it. '
      +'Your typed answers are all still here — only the image went. '
      +'Attach it again before you build your submission PDF.';
    delete store._evicted; save();
  }

  document.getElementById("lqClear").onclick=function(){
    if(!confirm("Clear every response you have typed in this lab? This cannot be undone.")) return;
    store={}; save();
    qs.forEach(function(it,i){
      var ta=document.getElementById("lqQ"+i); if(ta) ta.value="";
      var im=document.getElementById("lqQ"+i+"_img"); if(im){ im.removeAttribute("src"); im.style.display="none"; }

  /* ---------- guard the simulator's Restart button ----------

     covers every variant of the handler. */
  (function(){
    var rb=document.getElementById("btnRestart")||document.getElementById("btnReset");
    if(!rb||card.contains(rb)) return;
    rb.addEventListener("click",function(ev){
      if(rb.dataset.lqOk==="1"){ rb.dataset.lqOk=""; return; }
      ev.preventDefault(); ev.stopImmediatePropagation();
      var ok=confirm(
        "Restart the scenario?\n\n"+
        "Everything you recorded in the simulator — readings, marks, logs, the "+
        "submission sheet it built — is wiped and the run starts again.\n\n"+
        "The answers you typed in the submission panel lower down are KEPT. If they "+
        "describe readings you are about to erase, build your submission PDF first.");

  })();

  /* ---------- harvest the simulator's own record ---------- */
  var REC_SEL=".result.show, .result.show .sheet";
  function syncSimName(){
    /* the simulator keeps its own name field; the learner is told to fill the
       module's. Copy across so the harvested record never reports the name blank. */
    try{
      var n=document.getElementById("lqName"); if(!n||!n.value.trim()) return;
      var sim=document.getElementById("learnerName")||document.getElementById("learner")
            ||document.querySelector('input[name="learnerName"]');
      if(sim&&!card.contains(sim)&&!sim.value.trim()){
        sim.value=n.value.trim();
        sim.dispatchEvent(new Event("input",{bubbles:true}));
        sim.dispatchEvent(new Event("change",{bubbles:true}));
      }
    }catch(e){}
  }
  function collect(){
    var raw=[];
    Array.prototype.forEach.call(document.querySelectorAll(REC_SEL),function(s){
      if(card.contains(s)) return;
      if(!s.textContent.replace(/\s/g,"")) return;
      raw.push(s);
    });
    return raw.filter(function(s){
      return !raw.some(function(o){ return o!==s && o.contains(s); });
    });
  }

  /* the module already prints the learner name in its own Learner block, and every
     simulator sheet prints it again — four of them twice. Strip it from the clone. */
  var NAMEKEY=/^(your\s+)?(name|learner(\s+name)?)\s*:?\s*$/i;
  function stripDuplicateName(root){
    Array.prototype.forEach.call(root.querySelectorAll(".learnerline"),function(n){
      if(n.parentNode) n.parentNode.removeChild(n);
    });
    var rows=root.querySelectorAll("div,tr,p");
    Array.prototype.forEach.call(rows,function(r){
      var first=r.firstElementChild;
      if(!first||r.children.length>3) return;
      if(NAMEKEY.test((first.textContent||"").trim())){
        if(r.parentNode) r.parentNode.removeChild(r);
      }
    });
  }

  function cleanClone(s){
    var c=s.cloneNode(true);
    Array.prototype.forEach.call(c.querySelectorAll(".noprint, button"),function(n){
      if(n.parentNode) n.parentNode.removeChild(n);
    });
    stripDuplicateName(c);
    /* paper-era close line some simulators still print under their sheet */
    Array.prototype.forEach.call(c.querySelectorAll("p,div,span,small"),function(n){
      if(n.children.length===0&&/hand this sheet to your instructor/i.test(n.textContent||"")){
        if(n.parentNode) n.parentNode.removeChild(n);
      }
    });
    return c;
  }
  function toolRecord(){
    syncSimName();
    /* Preferred path: the simulator hands over its record itself. A simulator
       defines window.lqRecord() to (re)build its sheet from its current state and
       return the element or an HTML string — so the harvest no longer depends on
       which pane or tab happens to be showing when the learner presses the button. */
    if(typeof window.lqRecord==="function"){
      try{
        var r=window.lqRecord();
        if(typeof r==="string"&&r.replace(/\s/g,"")) return r;
        if(r&&r.nodeType===1&&r.textContent.replace(/\s/g,"")) return cleanClone(r).innerHTML;
      }catch(e){}
    }
    var found=collect();
    if(!found.length){
      var btns=document.querySelectorAll("button");
      var hit=null;
      Array.prototype.forEach.call(btns,function(b){
        if(card.contains(b)||hit) return;
        var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
        if(/print/.test(t)) return;
        if(/^build submission sheet$/.test(t)) hit=b;
      });
      if(!hit){
        Array.prototype.forEach.call(btns,function(b){
          if(card.contains(b)||hit) return;
          var t=(b.textContent||"").replace(/\s+/g," ").trim().toLowerCase();
          if(/print/.test(t)) return;
          if(/build .*sheet|submission sheet|submit .*(map|answer|sheet|round|log)|^submit$/.test(t)) hit=b;
        });
      }
      if(hit){ try{ hit.click(); }catch(e){} }
      found=collect();
    }
    if(!found.length) return null;
    var wrap=document.createElement("div");
    found.forEach(function(s){ wrap.appendChild(cleanClone(s)); });
    return wrap.innerHTML;
  }

  /* ---------- assemble the one sheet ---------- */
  function build(){
    var name=document.getElementById("lqName").value.trim();
    var coh=document.getElementById("lqCohort").value.trim();
    var dt=document.getElementById("lqDate").value.trim();
    var gaps=[];
    if(!name) gaps.push("Your name");
    if(!coh)  gaps.push("Cohort / section");

    var h=''
     +'<div class="lqsheet">'
     +'<h1>'+esc(LQ.lab)+' — '+esc(LQ.title)+'</h1>'
     +'<div class="lqmeta">UCI 2227 · Module 524 · '+esc(LQ.handout)
       +(hasSet()?' · Set '+esc(setLetter()):'')+' · submission sheet</div>'
     +'<h2>Learner</h2>'
     +'<div class="lqrow"><span class="k">Name</span><span class="v">'+(esc(name)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Cohort / section</span><span class="v">'+(esc(coh)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Date</span><span class="v">'+(esc(dt)||"—")+'</span></div>'
     +'<div class="lqrow"><span class="k">Scenario set</span><span class="v">'
       +(hasSet()?esc(setLetter()):'single set')+'</span></div>'
     +'<div class="lqrow"><span class="k">Built</span><span class="v">'
       +esc(new Date().toLocaleString())+'</span></div>';

    /* a response tool (nosim) can still carry an in-tool packet record via window.lqRecord() */
    var rec=(LQ.nosim&&typeof window.lqRecord!=="function")?null:toolRecord();
    if(rec){ h+='<h2>'+(LQ.nosim?'Packet record':'Simulator record')+'</h2>'+rec; }
    if(!rec&&!LQ.nosim){
      var why=(typeof window.lqRecordReason==="string"&&window.lqRecordReason)?" ("+window.lqRecordReason+")":"";
      gaps.push("The simulator record — the lab tool above has nothing to record yet"+why
               +". Work through the lab, then build this PDF again");
    }else if(LQ.nosim){
      h+='<h2>Assessed on the floor</h2>'
        +'<div class="lqrow"><span class="k">Practical steps</span><span class="v">'
        +'Observed and signed off by the instructor against the handout. '
        +'The instructor signature below records that sign-off.</span></div>';
    }

    var curSec=null;
    qs.forEach(function(it,i){
      if(it.s!==curSec){ curSec=it.s; h+='<h2>'+esc(curSec||"Questions")+'</h2>'; }
      var ta=document.getElementById("lqQ"+i);
      var a=ta?ta.value.trim():"";
      var im=store["lqQ"+i+"_img"];
      if(!a&&!im) gaps.push("Q"+(i+1));
      h+='<div class="lqa"><div class="q"><span class="qn">Q'+(i+1)+'.</span>'+esc(it.p)+'</div>';
      if(im) h+='<img src="'+im+'" alt="Attachment for question '+(i+1)+'">';
      h+='<div class="a'+((!a&&!im)?" blank":"")+'">'+(a?esc(a):"— not answered —")+'</div></div>';
    });

    if(gaps.length){
      h+='<div class="lqgap"><b>Not yet filled in ('+gaps.length+'):</b> '+esc(gaps.join(", "))
        +'.<br>This is a completeness check, not a grade. Fill them in and build again, '
        +'or hand the sheet in as it stands and explain the gaps to your instructor.</div>';
    }else{
      h+='<div class="lqgap ok">'
        +'<b>Complete.</b> Every question on this sheet carries a response'
        +(LQ.nosim?'.':' and the simulator record is attached.')+'</div>';
    }

    h+='<div class="lqsign">Learner signature: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'Instructor verification: ______________________________'
      +'&nbsp;&nbsp;&nbsp;Date: ______________<br>'
      +'<span style="font-size:11px">Save this as a PDF and upload the single file to the '
      +esc(LQ.lab)+' assignment in Canvas.</span></div></div>';

    document.getElementById("lqOut").innerHTML=h;
    announce(gaps.length
      ? ("Submission sheet built. "+gaps.length+" item"+(gaps.length===1?"":"s")+" still blank: "+gaps.join(", ")+".")
      : "Submission sheet built. Every question carries a response.");
    return h;
  }

  document.getElementById("lqPreview").onclick=function(){
    build();
    var o=document.getElementById("lqOut");
    if(o&&o.scrollIntoView) o.scrollIntoView({behavior:"smooth",block:"start"});
  };

  /* ---------- the one PDF ---------- */
  function safeName(s){
    return String(s||"").normalize?String(s||"").normalize("NFKD").replace(/[^\w\s-]/g,"").trim()
      :String(s||"").replace(/[^\w\s-]/g,"").trim();
  }
  function fileTitle(){
    var n=safeName(document.getElementById("lqName").value).split(/\s+/).filter(Boolean);
    var last=n.length>1?n[n.length-1]:(n[0]||"Learner");
    var first=n.length>1?n.slice(0,-1).join("_"):"";
    var who=first?(last+"_"+first):last;
    return who+"_"+String(LQ.lab||"").replace(/[^\d.]/g,"");
  }

  document.getElementById("lqBuild").onclick=function(){
    var h=build();
    /* this lab's images are now inside a PDF the learner holds, so they become the
       first thing evicted when another lab needs room on the shared origin */
    store._done=true; save();

    var old=document.getElementById("lqPrint"); if(old) old.parentNode.removeChild(old);

    /* The sheet goes inside a one-cell table whose thead repeats on every printed
       page, so pages 2+ still carry the learner name, the lab and the set. */
    var runHead='<span class="r">'+esc(LQ.lab)+(hasSet()?' · Set '+esc(setLetter()):'')+'</span>'
      +esc(document.getElementById("lqName").value.trim()||"Name not entered")
      +' · '+esc(LQ.title);
    var pr=document.createElement("div"); pr.id="lqPrint";
    pr.innerHTML='<table class="lqpage"><thead class="lqrhead"><tr><td class="lqrh">'
      +runHead+'</td></tr></thead><tbody><tr><td class="lqbody">'+h+'</td></tr></tbody></table>';
    document.body.appendChild(pr);

    /* the browser suggests document.title as the Save-as-PDF filename */
    var prevTitle=document.title;
    document.title=fileTitle();
    document.body.classList.add("lq-print");

    var restored=false;
    var done=function(){
      if(restored) return; restored=true;
      document.body.classList.remove("lq-print");
      document.title=prevTitle;
      var a=document.getElementById("lqPrint"); if(a&&a.parentNode) a.parentNode.removeChild(a);
      window.removeEventListener("afterprint",done);
      if(mq&&mq.removeListener) mq.removeListener(mqHandler);
    };
    var mq=window.matchMedia?window.matchMedia("print"):null;
    var mqHandler=function(m){ if(!m.matches) done(); };
    if(mq&&mq.addListener) mq.addListener(mqHandler);
    window.addEventListener("afterprint",done);

    setTimeout(function(){
      window.print();
      /* generous fallback: mobile print sheets are asynchronous, and tearing the
         container out too early yields a blank PDF */
      setTimeout(done,60000);
    },80);
  };
})();
</script>
<!-- ===== end submission module ============================================= -->
</body>
</html>
